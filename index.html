<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Тест Fullscreen Hack 1</title>
  
  <style>
    /* Стилі сторінки */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      
      /* Відступи Safe Area */
      padding-top: env(safe-area-inset-top, 10px);
      padding-bottom: env(safe-area-inset-bottom, 10px);
      padding-left: env(safe-area-inset-left, 10px);
      padding-right: env(safe-area-inset-right, 10px);
    }

    header {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #ff9800;
      text-align: center;
    }

    main {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
    }

    .info-box {
      background: #333;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 16px;
      color: #00e676;
    }

    footer {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #2196f3;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h2>Тест ХАК 1 (Мікроскролл)</h2>
    <p>Спробуйте торкнутися екрана або потягнути сторінку</p>
  </header>

  <main>
    <h3>Параметри екрана:</h3>
    <div class="info-box">
      <p>Ширина вікна (innerWidth): <span id="winWidth">-</span>px</p>
      <p>Висота вікна (innerHeight): <span id="winHeight">-</span>px</p>
      <p>Ширина екрана (screen.width): <span id="screenWidth">-</span>px</p>
    </div>
  </main>

  <footer>
    <p>Якщо ширина розгорнулася до 844px — хак спрацював!</p>
  </footer>

  <script>
    /* 1. Відображення розмірів екрана */
    function updateDimensions() {
      document.getElementById('winWidth').textContent = window.innerWidth;
      document.getElementById('winHeight').textContent = window.innerHeight;
      document.getElementById('screenWidth').textContent = screen.width;
    }

    window.addEventListener('load', updateDimensions);
    window.addEventListener('resize', updateDimensions);
    window.addEventListener('scroll', updateDimensions);

    /* 2. ХАК 1: Автоматичний мікроскролл для Bluefy */
    (function initFullscreenHack() {
      /* Додаємо CSS для активації скролу */
      var style = document.createElement('style');
      style.innerHTML = 'html, body { width: 100lvw !important; min-height: 100.1vh !important; overflow-x: hidden; -webkit-overflow-scrolling: touch; }';
      document.head.appendChild(style);

      /* Зсув на 1 піксель */
      function triggerFullscreenScroll() {
        if (window.scrollY === 0) {
          window.scrollTo({ top: 1, behavior: 'instant' });
        }
      }

      /* Запуск при завантаженні */
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(triggerFullscreenScroll, 50);
      });

      window.addEventListener('load', function() {
        setTimeout(triggerFullscreenScroll, 100);
        setTimeout(triggerFullscreenScroll, 300);
      });

      /* Запуск при першому дотику пальцем */
      function handleFirstTouch() {
        triggerFullscreenScroll();
        window.removeEventListener('touchstart', handleFirstTouch);
      }

      window.addEventListener('touchstart', handleFirstTouch, { passive: true });

      /* Запуск при повороті екрана */
      window.addEventListener('orientationchange', function() {
        setTimeout(triggerFullscreenScroll, 200);
      });
    })();
  </script>
</body>
</html>
