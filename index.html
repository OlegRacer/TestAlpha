<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>vRacer Dash Pro</title>
<style>
:root{
  --bg:#000000;--panel:#0d0d0f;--line:rgba(255,255,255,0.07);
  --text:#f2f2f0;--muted:#666;
  --cyan:#37e0e6;--amber:#ffb74d;--red:#ff4d4d;
  --green:#4ade80;--blue:#3b82f6;--yellow:#ffd23f;
  --th:48px;
  --sat-cold:0.70;--sat-warn:0.70;--sat-alrt:0.70;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;}
html,body{margin:0;padding:0;height:100%;width:100%;
  background:#000000 !important;color:#f2f2f0 !important;
  font-family:'Rajdhani','Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;}

/* TOPBAR */
.tb{position:fixed;top:0;left:0;right:0;z-index:50;
  display:flex;align-items:center;gap:5px;
  padding:max(5px,env(safe-area-inset-top)) 8px 5px;
  background:#000000;border-bottom:1px solid var(--line);
  height:var(--th);
  overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
.tb::-webkit-scrollbar{display:none;}
.pill{border:1px solid var(--line);border-radius:6px;padding:5px 9px;
  font-size:12px;color:var(--muted);background:#0d0d0f;white-space:nowrap;cursor:pointer;
  flex-shrink:0;}
.pill.on{color:#9be8ff;border-color:#2b6f7a;}
.pill.ok{color:#4ade80;border-color:rgba(74,222,128,0.4);}
.pill.err{color:#ff8080;border-color:rgba(255,77,77,0.3);}
.pill.go{color:var(--amber);border-color:rgba(255,183,77,0.3);}

#bs{display:none;}
#bs.err{display:inline-block;}
#eb{margin-left:auto;flex-shrink:0;border:1px solid var(--line);border-radius:6px;
  padding:5px 11px;font-size:12px;color:#f2f2f0;background:#0d0d0f;cursor:pointer;}
#eb.a{color:#000;background:var(--cyan);border-color:var(--cyan);font-weight:700;}

/* GRID */
#grid{position:fixed;inset:0;background:#000000 !important;
  padding-top:calc(env(safe-area-inset-top) + var(--th) + 2px);
  padding-bottom:env(safe-area-inset-bottom,6px);overflow-y:auto;}
#gi{display:grid;gap:6px;padding:6px;height:100%;
  grid-template-columns:repeat(2,1fr);grid-auto-rows:minmax(120px,160px);}

/* TILES */
.tile{position:relative;border-radius:10px;background:var(--panel);
  border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:8px;overflow:hidden;-webkit-touch-callout:none;
  transition:background .3s,border-color .3s;}

.tile.s1{grid-column:span 1;grid-row:span 1;}
.tile.s21{grid-column:span 2;grid-row:span 1;}
.tile.s22{grid-column:span 2;grid-row:span 2;}
.tile.s23{grid-column:span 2;grid-row:span 3;}

/* Alert States */
.tile.cold{background:rgba(59,130,246,var(--sat-cold))!important;border-color:var(--cyan)!important;}
.tile.warn{background:rgba(255,211,63,var(--sat-warn))!important;border-color:var(--amber)!important;}
.tile.alrt{background:rgba(255,77,77,var(--sat-alrt))!important;border-color:var(--red)!important;
  animation:palrt 0.6s ease-in-out infinite;}
@keyframes palrt{0%,100%{opacity:1;}50%{opacity:0.6;}}

/* TILE CONTENT */
.tl{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--pc,var(--muted));margin-bottom:2px;text-align:center;font-weight:700;}
.tv{font-family:'JetBrains Mono','Courier New',monospace;font-weight:700;
  line-height:1;color:#fff;letter-spacing:1px;font-size:clamp(26px,7vw,42px);}
.tu{font-size:11px;color:var(--muted);margin-top:4px;letter-spacing:1px;}
.tun{width:40%;height:1px;background:var(--pc,var(--cyan));opacity:0.45;margin:4px 0;}

/* MAP TILE */
.tile.map-tile{padding:0;overflow:hidden;cursor:pointer;position:relative;}
.map-tile-preview{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#15151a;}
.map-tile-badge{position:absolute;top:8px;left:8px;z-index:10;font-size:10px;letter-spacing:1px;
  color:#fff;background:rgba(0,0,0,0.65);padding:3px 8px;border-radius:6px;text-transform:uppercase;}

/* FULLSCREEN MAP MODAL */
.map-modal{position:fixed;inset:0;z-index:2000;background:#000;display:none;flex-direction:column;}
.map-modal.sh{display:flex;}
.map-modal-header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:#0d0d0f;border-bottom:1px solid var(--line);z-index:10;}
.map-modal-body{flex:1;position:relative;width:100%;height:100%;}
#fullMapContainer{width:100%;height:100%;}

/* MODALS GENERAL */
.mb{position:fixed;inset:0;background:rgba(0,0,0,0.82);
  backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-end;
  justify-content:center;}
.mb.sh{display:flex;}
.ms{width:100%;max-width:620px;background:#0c0c0f;border:1px solid var(--line);
  border-radius:16px 16px 0 0;max-height:88vh;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);}
.mh{padding:12px 14px 9px;display:flex;align-items:center;
  justify-content:space-between;border-bottom:1px solid var(--line);flex-shrink:0;}
.mh h3{margin:0;font-size:14px;letter-spacing:1px;font-weight:600;}
.mc2{border:none;background:rgba(255,255,255,0.05);color:var(--text);
  width:26px;height:26px;border-radius:50%;font-size:14px;cursor:pointer;}

.mbody{overflow-y:auto;padding:12px;flex:1;}
.tbar{display:flex;border-bottom:1px solid var(--line);flex-shrink:0;}
.tab{flex:1;padding:9px;text-align:center;font-size:11px;font-weight:600;
  letter-spacing:1px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
.tab.a{color:var(--cyan);border-bottom-color:var(--cyan);}

.tsw{position:relative;display:inline-block;width:46px;height:26px;flex-shrink:0;}
.tsw input{opacity:0;width:0;height:0;position:absolute;}
.tsw .sldr{position:absolute;inset:0;background:#333;border-radius:26px;transition:background .2s;cursor:pointer;}
.tsw .sldr:before{position:absolute;content:"";height:20px;width:20px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:transform .2s;}
.tsw input:checked + .sldr{background:var(--cyan);}
.tsw input:checked + .sldr:before{transform:translateX(20px);}

.ht{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.95);border:1px solid var(--line);
  padding:6px 14px;border-radius:18px;font-size:11px;color:var(--muted);
  z-index:80;opacity:0;transition:opacity .25s ease;pointer-events:none;white-space:nowrap;}
.ht.sh{opacity:1;}

.dbgc{display:none;position:fixed;inset:0;z-index:9999;background:#000;flex-direction:column;}
.dbgc.sh{display:flex;}
.dbgc-h{display:flex;align-items:center;justify-content:space-between;
  padding:10px 12px;border-bottom:1px solid var(--line);background:#000;}
.dbgc-body{flex:1;overflow-y:auto;padding:10px;font-family:monospace;font-size:11px;line-height:1.45;}
.dbgc-line{white-space:pre-wrap;padding:3px 0;border-bottom:1px solid rgba(255,255,255,0.05);}
.dbgc-line.warn{color:var(--amber);}
.dbgc-line.error{color:var(--red);}
.dbgc-line.log{color:#ccc;}
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>

<div class="tb">
  <button id="cb" class="pill">🔵 Connect</button>
  <div id="bs" class="pill"></div>
  <button id="tripBtn" class="pill">Trip</button>
  <button id="routeBtnTop" class="pill" onclick="sht('Маршрут')">Маршрут</button>
  <button id="sndBtnTop" class="pill" onclick="toggleSoundBtn()">Звук ВВІМК</button>
  <button id="consoleBtnTop" class="pill" onclick="toggleConsolePanel()">Консоль</button>
  <button id="eb">Налаштувати</button>
</div>

<div id="grid">
  <div id="gi"></div>
</div>

<!-- FULLSCREEN MAP MODAL -->
<div class="map-modal" id="fullMapModal">
  <div class="map-modal-header">
    <div style="display:flex;align-items:center;gap:10px;">
      <b style="font-size:14px;letter-spacing:1px;">Навігаційна карта</b>
      <span id="fullMapTEngBadge" style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:var(--cyan);background:rgba(255,255,255,0.05);padding:2px 8px;border-radius:6px;border:1px solid var(--line);">T_Eng: --°C</span>
    </div>
    <div style="display:flex;align-items:center;gap:12px;">
      <label class="tsw" title="Темна тема">
        <input type="checkbox" id="fullMapThemeToggle" onchange="toggleFullMapTheme(this.checked)">
        <span class="sldr"></span>
      </label>
      <button class="mc2" onclick="closeFullMapModal()">✕</button>
    </div>
  </div>
  <div class="map-modal-body">
    <div id="fullMapContainer"></div>
  </div>
</div>

<div class="ht" id="ht"></div>

<!-- EDIT MODAL -->
<div class="mb" id="em">
  <div class="ms">
    <div class="mh"><h3>Налаштування</h3><button class="mc2" id="emc">✕</button></div>
    <div class="tbar">
      <div class="tab a" id="t0" onclick="st(0)">ЕКРАН</div>
      <div class="tab" id="t1" onclick="st(1)">СИГНАЛИ</div>
      <div class="tab" id="t2" onclick="st(2)">ПАДІННЯ</div>
      <div class="tab" id="t3" onclick="st(3)">КАРТА</div>
    </div>
    <div class="mbody" id="emb"></div>
  </div>
</div>

<!-- CONSOLE -->
<div class="dbgc" id="dbgConsolePanel">
  <div class="dbgc-h">
    <b>Консоль</b>
    <div style="display:flex;gap:6px;">
      <button class="pill" onclick="copyConsoleLog()">📋 Копіювати</button>
      <button class="pill err" onclick="clearConsoleLog()">🗑 Очистити</button>
      <button class="mc2" onclick="toggleConsolePanel()">✕</button>
    </div>
  </div>
  <div class="dbgc-body" id="dbgc-body"></div>
</div>

<script>
// КОНСОЛЬ
const _consoleLog=[];
const _origConsole={log:console.log,warn:console.warn,error:console.error};
function _pushConsoleLine(type,args){
  const line=Array.from(args).map(a=>{
    if(a instanceof Error) return a.message;
    if(typeof a==='object'){ try{ return JSON.stringify(a); }catch(e){ return String(a); } }
    return String(a);
  }).join(' ');
  const t=new Date();
  const stamp=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0')+':'+String(t.getSeconds()).padStart(2,'0');
  _consoleLog.push({type,line,stamp});
  if(_consoleLog.length>300) _consoleLog.shift();
  const panel=document.getElementById('dbgConsolePanel');
  if(panel && panel.classList.contains('sh')) renderConsolePanel();
}
console.log=function(...args){ _origConsole.log.apply(console,args); _pushConsoleLine('log',args); };
console.warn=function(...args){ _origConsole.warn.apply(console,args); _pushConsoleLine('warn',args); };
console.error=function(...args){ _origConsole.error.apply(console,args); _pushConsoleLine('error',args); };

function toggleConsolePanel(){
  const p=document.getElementById('dbgConsolePanel');
  if(!p) return;
  p.classList.toggle('sh');
  if(p.classList.contains('sh')) renderConsolePanel();
}
function renderConsolePanel(){
  const body=document.getElementById('dbgc-body');
  if(!body) return;
  body.innerHTML=_consoleLog.map(e=>'<div class="dbgc-line '+e.type+'">['+e.stamp+'] '+
    e.line.replace(/&/g,'&amp;').replace(/</g,'&lt;')+'</div>').join('') || '<div class="dbgc-line log">(порожньо)</div>';
  body.scrollTop=body.scrollHeight;
}
function clearConsoleLog(){ _consoleLog.length=0; renderConsolePanel(); }
async function copyConsoleLog(){
  const text=_consoleLog.map(e=>'['+e.stamp+'] '+e.type.toUpperCase()+': '+e.line).join('\n');
  try{ await navigator.clipboard.writeText(text); sht('Скопійовано'); }catch(e){ alert(text); }
}

// ПАРАМЕТРИ
const P={
  RPM:      {n:'RPM',      u:'rpm',  c:'#ffd23f'},
  T_Eng:    {n:'T_Eng',   u:'°C',   c:'#3b82f6'},
  TPS:      {n:'TPS%',    u:'%',    c:'#37e0e6'},
  GPS:      {n:'GPS',     u:'km/h', c:'#ffffff'},
  Volt:     {n:'Volt',    u:'V',    c:'#4ade80'},
  T_Air:    {n:'T_Air',   u:'°C',   c:'#06b6d4'},
  MapTile:  {n:'Карта',     u:'',     c:'#4ade80'},
};
const V={RPM:0, T_Eng:75, TPS:0, GPS:0, Volt:13.8, T_Air:22};

function lg(k){try{const s=localStorage.getItem('ar_'+k);return s?JSON.parse(s):null;}catch(e){return null;}}
function ls(k,v){try{localStorage.setItem('ar_'+k,JSON.stringify(v));}catch(e){}}

const DA={T_cold:64,T_warn:90,T_crit:96,Sound_enabled:true};
let AL={...DA,...(lg('al')||{})};

let _lastLat=50.4501, _lastLon=30.5234;

// МАКЕТ ПЛИТОК
let lay = lg('layout') || [
  {id:'m1', k:'MapTile', s:'s23'},
  {id:'m2', k:'RPM', s:'s21'},
  {id:'m3', k:'T_Eng', s:'s1'},
  {id:'m4', k:'GPS', s:'s1'}
];

// РЕНДЕР СІТКИ
function renderGrid(){
  const container = document.getElementById('gi');
  if(!container) return;
  container.innerHTML = '';

  lay.forEach(item => {
    const pDef = P[item.k];
    if(!pDef) return;

    const tile = document.createElement('div');
    tile.className = `tile ${item.s}`;
    tile.id = `tile_${item.id}`;

    if(item.k === 'MapTile'){
      tile.classList.add('map-tile');
      tile.innerHTML = `
        <div class="map-tile-badge">Карта</div>
        <div class="map-tile-preview">
          <span style="font-size:28px;">🗺️</span>
          <span style="font-size:11px;color:var(--muted);margin-top:6px;">Натисніть для відкриття</span>
        </div>
      `;
      setupMapTileTap(tile);
    } else {
      tile.style.setProperty('--pc', pDef.c);
      tile.innerHTML = `
        <div class="tl">${pDef.n}</div>
        <div class="tun"></div>
        <div class="tv" id="val_${item.id}">${V[item.k] !== undefined ? V[item.k] : '--'}</div>
        <div class="tu">${pDef.u}</div>
      `;
    }
    container.appendChild(tile);
  });
  ud();
}

// ОНОВЛЕННЯ ДАНИХ ТА СТАНІВ
function ud(){
  updateFullMapTEng(V.T_Eng);

  lay.forEach(item => {
    if(item.k === 'MapTile') return;
    const valEl = document.getElementById(`val_${item.id}`);
    const tileEl = document.getElementById(`tile_${item.id}`);
    if(valEl) valEl.textContent = V[item.k] !== undefined ? V[item.k] : '--';

    if(tileEl && item.k === 'T_Eng'){
      tileEl.classList.remove('cold', 'warn', 'alrt');
      const temp = parseFloat(V.T_Eng);
      if(!isNaN(temp)){
        if(temp >= AL.T_crit) tileEl.classList.add('alrt');
        else if(temp >= AL.T_warn) tileEl.classList.add('warn');
        else if(temp < AL.T_cold) tileEl.classList.add('cold');
      }
    }
  });

  if(fullMapObj && fullMapMarker && _lastLat != null && _lastLon != null){
    fullMapMarker.setLatLng([_lastLat, _lastLon]);
  }
}

// КАРТА
let fullMapObj=null, fullMapMarker=null;

function initFullMap(){
  if(fullMapObj) return;
  const container = document.getElementById('fullMapContainer');
  if(!container || typeof L==='undefined') return;
  
  fullMapObj = L.map(container, {zoomControl:true, attributionControl:false}).setView([_lastLat, _lastLon], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(fullMapObj);

  fullMapMarker = L.circleMarker([_lastLat, _lastLon], {
    radius: 8, color: '#000', weight: 2, fillColor: '#37e0e6', fillOpacity: 1
  }).addTo(fullMapObj);
}

function openFullMapModal(){
  document.getElementById('fullMapModal').classList.add('sh');
  setTimeout(()=>{
    initFullMap();
    if(fullMapObj){
      fullMapObj.invalidateSize();
      fullMapObj.setView([_lastLat, _lastLon], 15);
      if(fullMapMarker) fullMapMarker.setLatLng([_lastLat, _lastLon]);
    }
  }, 100);
}

function closeFullMapModal(){
  document.getElementById('fullMapModal').classList.remove('sh');
}

function toggleFullMapTheme(isDark){
  const el = document.getElementById('fullMapContainer');
  if(el) el.classList.toggle('map-theme-dark', isDark);
}

function updateFullMapTEng(val){
  const badge = document.getElementById('fullMapTEngBadge');
  if(!badge) return;
  badge.textContent = `T_Eng: ${val}°C`;
  const fv = parseFloat(val);
  if(!isNaN(fv)){
    if(fv >= AL.T_crit){ badge.style.color = 'var(--red)'; }
    else if(fv >= AL.T_warn){ badge.style.color = 'var(--amber)'; }
    else { badge.style.color = 'var(--cyan)'; }
  }
}

function setupMapTileTap(tileEl){
  tileEl.addEventListener('click', ()=> openFullMapModal());
}

// НАЛАШТУВАННЯ ТА ВКЛАДКИ
function st(idx){
  document.querySelectorAll('.tbar .tab').forEach((t, i)=> t.classList.toggle('a', i===idx));
  const emb = document.getElementById('emb');
  if(!emb) return;
  if(idx === 0){
    emb.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:10px;">Вкладка Екрану (налаштування віджетів)</div>`;
  } else if(idx === 1){
    emb.innerHTML = `
      <div style="display:flex;flex-direction:column;gap:12px;padding:6px;">
        <label>T_Eng Warn (°C): <input type="number" value="${AL.T_warn}" style="background:#222;color:#fff;border:1px solid #444;padding:4px;border-radius:4px;width:60px;" onchange="AL.T_warn=+this.value;ls('al',AL);ud();"></label>
        <label>T_Eng Crit (°C): <input type="number" value="${AL.T_crit}" style="background:#222;color:#fff;border:1px solid #444;padding:4px;border-radius:4px;width:60px;" onchange="AL.T_crit=+this.value;ls('al',AL);ud();"></label>
      </div>`;
  } else {
    emb.innerHTML = `<div style="font-size:13px;color:var(--muted);padding:10px;">Налаштування розділу ${idx}</div>`;
  }
}

function toggleSoundBtn(){
  AL.Sound_enabled = !AL.Sound_enabled;
  ls('al', AL);
  const btn = document.getElementById('sndBtnTop');
  if(btn){
    btn.textContent = AL.Sound_enabled ? "Звук ВВІМК" : "Звук ВИМК";
    btn.classList.toggle('err', !AL.Sound_enabled);
  }
}

function sht(msg){
  const el = document.getElementById('ht');
  if(!el) return;
  el.textContent = msg;
  el.classList.add('sh');
  setTimeout(()=>el.classList.remove('sh'), 2000);
}

// ІНІЦІАЛІЗАЦІЯ ПІСЛЯ ЗАВАНТАЖЕННЯ
document.addEventListener('DOMContentLoaded', ()=>{
  renderGrid();
  
  document.getElementById('eb').addEventListener('click', ()=>{
    document.getElementById('em').classList.add('sh');
    st(0);
  });
  document.getElementById('emc').addEventListener('click', ()=>{
    document.getElementById('em').classList.remove('sh');
  });
});
</script>
</body>
</html>
