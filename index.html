<script>
(function initWidthLockHack() {
  var maxLandscapeWidth = 0;
  var maxPortraitWidth = 0;

  function catchAndLockWidth() {
    var currentWidth = window.innerWidth;
    var isLandscape = window.matchMedia("(orientation: landscape)").matches;

    if (isLandscape) {
      // 1. Алгоритм для АЛЬБОМНОГО режиму
      if (currentWidth > 750 && currentWidth > maxLandscapeWidth) {
        maxLandscapeWidth = currentWidth;
        document.documentElement.style.setProperty('--real-width', maxLandscapeWidth + 'px');
      } else if (maxLandscapeWidth > 0) {
        // Якщо вже ловили альбомну ширину — тримаємо її
        document.documentElement.style.setProperty('--real-width', maxLandscapeWidth + 'px');
      } else {
        // Якщо ще не ловили — скидаємо на 100vw
        document.documentElement.style.setProperty('--real-width', '100vw');
      }
    } else {
      // 2. Алгоритм для ПОРТРЕТНОГО режиму (скидаємо 844px, щоб не було гігантського зуму!)
      if (currentWidth > maxPortraitWidth) {
        maxPortraitWidth = currentWidth;
      }
      // В портретному режимі повертаємо звичайні 100vw або ширину портрета
      document.documentElement.style.setProperty('--real-width', '100vw');
    }
  }

  // Перевіряємо при завантаженні та будь-яких подіях
  catchAndLockWidth();

  window.addEventListener('resize', catchAndLockWidth);
  window.addEventListener('scroll', catchAndLockWidth, { passive: true });
  window.addEventListener('touchmove', catchAndLockWidth, { passive: true });

  // При повороті екрана миттєво перераховуємо розміри
  window.addEventListener('orientationchange', function() {
    setTimeout(catchAndLockWidth, 50);
    setTimeout(catchAndLockWidth, 200);
  });
})();
</script>
