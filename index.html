<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>vRacer - Taiwan Scooter (≤240cc/249cc) Test Bench</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #121212; color: #fff; overflow: hidden; }

    #map { width: 100vw; height: 100vh; z-index: 1; }

    /* Верхня панель HUD / Режими */
    .top-panel {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      display: flex; gap: 8px; flex-wrap: wrap; background: rgba(20,20,20,0.85);
      padding: 10px; border-radius: 12px; backdrop-filter: blur(8px); border: 1px solid #333;
    }

    .btn {
      background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 8px 12px;
      border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .btn:active, .btn.active { background: #37e0e6; color: #000; border-color: #37e0e6; }
    .btn-scooter { background: #e65100; border-color: #ff9800; }
    .btn-scooter.active { background: #ff9800; color: #000; }

    /* Панель вводу координат вручну */
    .coord-panel {
      position: absolute; bottom: 20px; left: 12px; right: 12px; z-index: 1000;
      background: rgba(20,20,20,0.9); padding: 12px; border-radius: 12px; border: 1px solid #333;
      display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(8px);
    }
    .coord-row { display: flex; gap: 6px; }
    .coord-input {
      flex: 1; background: #1a1a1a; border: 1px solid #444; color: #fff; padding: 8px;
      border-radius: 6px; font-size: 12px; text-align: center;
    }

    /* Контекстне міні-меню тапу на карті */
    .map-popup-menu { display: flex; flex-direction: column; gap: 6px; padding: 4px; }
    .popup-btn {
      background: #333; color: #fff; border: none; padding: 8px 12px;
      border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; text-align: left;
    }
    .popup-btn:hover { background: #37e0e6; color: #000; }

    /* HUD повороту */
    .turn-hud {
      position: absolute; top: 80px; left: 12px; z-index: 999;
      background: rgba(0,0,0,0.85); border: 2px solid #37e0e6; padding: 10px 16px;
      border-radius: 12px; display: flex; align-items: center; gap: 12px;
    }
    .turn-hud svg { width: 32px; height: 32px; fill: none; stroke: #37e0e6; stroke-width: 3; }
    .turn-dist { font-size: 20px; font-weight: bold; color: #fff; }
  </style>
</head>
<body>

  <!-- Карта Leaflet -->
  <div id="map"></div>

  <!-- Верхня Панель Кнопок -->
  <div class="top-panel">
    <button class="btn btn-scooter active" id="btn249cc" onclick="toggleScooterMode()">🛵 249cc (Тайвань)</button>
    <button class="btn" onclick="fetchNearbyPOI('fuel')">⛽ АЗС</button>
    <button class="btn" onclick="fetchNearbyPOI('shop')">🏪 7-Eleven</button>
    <button class="btn" onclick="togglePitStopMode()">📍 Піт-стоп</button>
    <button class="btn" onclick="toggleTrafficLayer()">🚦 Затори</button>
    <button class="btn" onclick="buildFullRoute()" style="background:#2e7d32; border-color:#4caf50;">▶ Скласти маршрут</button>
    <button class="btn" onclick="clearAllWaypoints()" style="background:#c62828; border-color:#ef5350;">🗑 Очистити</button>
  </div>

  <!-- HUD Повороту -->
  <div class="turn-hud" id="turnHud" style="display: none;">
    <svg id="turnSvg" viewBox="0 0 24 24"><path id="turnPath" d="M 12 20 L 12 4 M 7 9 L 12 4 L 17 9"/></svg>
    <div class="turn-dist" id="turnDist">--- м</div>
  </div>

  <!-- Панель для ручного введення координат -->
  <div class="coord-panel">
    <div style="font-size: 11px; color: #aaa; text-align: center;">Введення координат (Широта, Довгота - Тайбей за замовчуванням):</div>
    <div class="coord-row">
      <input type="text" id="latInput" class="coord-input" placeholder="Lat (напр. 25.0330)" value="25.0330">
      <input type="text" id="lonInput" class="coord-input" placeholder="Lon (напр. 121.5654)" value="121.5654">
      <button class="btn" onclick="setManualCoords()">Задати GPS</button>
    </div>
  </div>

  <!-- Leaflet & JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    /* =========================================================================
       vRacer Test Engine + Taiwan Scooter (249cc) Routing Rules
       ========================================================================= */

    // Глобальні змінні
    let map, userMarker;
    let _lastLat = 25.0330, _lastLon = 121.5654; // За замовчуванням Тайбей (Taipei 101)
    
    // Точки маршруту
    let startPoint = null;
    let waypoints = []; // Проміжні точки [[lat, lon], ...]
    let endPoint = null;

    let routePolyline = null;
    let waypointMarkers = [];
    let isScooterMode249 = true; // Увімкнено правила 249cc для Тайваню

    // Ініціалізація карти (Тайвань)
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([_lastLat, _lastLon], 13);

      // Темна карта CartoDB Dark Matter
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Синій маркер GPS симулятора
      userMarker = L.marker([_lastLat, _lastLon], {
        icon: L.divIcon({
          html: `<div style="background:#00e5ff;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 10px #00e5ff;"></div>`,
          className: 'user-gps-icon', iconSize: [22, 22]
        })
      }).addTo(map);

      // Обробник тапу/кліку по карті для меню вибору
      map.on('click', onMapTap);
    }

    // ── МЕНЮ ПРИ ТАПІ НА КАРТУ ─────────────────────────────────────────────
    function onMapTap(e) {
      const { lat, lng } = e.latlng;

      const popupContent = document.createElement('div');
      popupContent.className = 'map-popup-menu';
      popupContent.innerHTML = `
        <button class="popup-btn" onclick="setRoutePoint('start', ${lat}, ${lng})">🟢 Точка старту</button>
        <button class="popup-btn" onclick="setRoutePoint('via', ${lat}, ${lng})">🟡 Проміжна точка</button>
        <button class="popup-btn" onclick="setRoutePoint('end', ${lat}, ${lng})">🔴 Фініш / Пункт призначення</button>
      `;

      L.popup()
        .setLatLng(e.latlng)
        .setContent(popupContent)
        .openOn(map);
    }

    function setRoutePoint(type, lat, lng) {
      map.closePopup();

      if (type === 'start') {
        startPoint = [lat, lng];
      } else if (type === 'via') {
        waypoints.push([lat, lng]);
      } else if (type === 'end') {
        endPoint = [lat, lng];
      }

      renderWaypointMarkers();
    }

    function renderWaypointMarkers() {
      waypointMarkers.forEach(m => map.removeLayer(m));
      waypointMarkers = [];

      if (startPoint) {
        const m = L.marker(startPoint, { icon: createColorIcon('#4caf50', 'S') }).addTo(map);
        waypointMarkers.push(m);
      }
      waypoints.forEach((pt, idx) => {
        const m = L.marker(pt, { icon: createColorIcon('#ffeb3b', idx + 1) }).addTo(map);
        waypointMarkers.push(m);
      });
      if (endPoint) {
        const m = L.marker(endPoint, { icon: createColorIcon('#f44336', 'F') }).addTo(map);
        waypointMarkers.push(m);
      }
    }

    function createColorIcon(color, text) {
      return L.divIcon({
        html: `<div style="background:${color};color:#000;font-weight:bold;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;">${text}</div>`,
        className: 'wp-icon', iconSize: [28, 28]
      });
    }

    function clearAllWaypoints() {
      startPoint = null;
      waypoints = [];
      endPoint = null;
      if (routePolyline) map.removeLayer(routePolyline);
      renderWaypointMarkers();
    }

    // ── РЕЖИМ СКУТЕРА 249cc (ТАЙВАНЬ) ──────────────────────────────────────
    function toggleScooterMode() {
      isScooterMode249 = !isScooterMode249;
      const btn = document.getElementById('btn249cc');
      if (isScooterMode249) {
        btn.classList.add('active');
        btn.innerHTML = '🛵 249cc (Без автострад)';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '🚗 Авто / Гіпер-траси';
      }
    }

    // ── РОЗРАХУНОК МАРШРУТУ З ВРАХУВАННЯМ ОБМЕЖЕНЬ 249cc ──────────────────
    async function buildFullRoute() {
      const pStart = startPoint || [_lastLat, _lastLon];
      if (!endPoint) {
        alert('Будь ласка, оберіть пункт призначення (Фініш 🔴) тапом по карті!');
        return;
      }

      // Збираємо всі точки [Start, ...Vias, End]
      const allPts = [pStart, ...waypoints, endPoint];
      const coordStr = allPts.map(p => `${p[1]},${p[0]}`).join(';');

      // ПАРАМЕТРИ ДЛЯ 249cc (Тайвань):
      // OSRM exclude: motorway (автостради, highways), toll (платні), ferry (пороми)
      let url = `https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson`;
      if (isScooterMode249) {
        url += `&exclude=motorway,toll,ferry`;
      }

      try {
        const res = await fetch(url);
        const data = await res.json();

        if (data.code === 'Ok' && data.routes && data.routes[0]) {
          const coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);

          if (routePolyline) map.removeLayer(routePolyline);
          routePolyline = L.polyline(coords, { color: '#37e0e6', weight: 6, opacity: 0.9 }).addTo(map);
          map.fitBounds(routePolyline.getBounds(), { padding: [40, 40] });

          document.getElementById('turnHud').style.display = 'flex';
          document.getElementById('turnDist').textContent = `${(data.routes[0].distance / 1000).toFixed(1)} км`;
        } else {
          alert('Не вдалося прокласти маршрут в обхід фривеїв!');
        }
      } catch (e) {
        console.error(e);
        alert('Помилка мережі при побудові маршруту');
      }
    }

    // ── РУЧНЕ ВВЕДЕННЯ КООРДИНАТ ──────────────────────────────────────────
    function setManualCoords() {
      const lat = parseFloat(document.getElementById('latInput').value);
      const lon = parseFloat(document.getElementById('lonInput').value);

      if (!isNaN(lat) && !isNaN(lon)) {
        _lastLat = lat;
        _lastLon = lon;
        userMarker.setLatLng([lat, lon]);
        map.panTo([lat, lon]);
      } else {
        alert('Некоректні координати!');
      }
    }

    // Запуск при завантаженні
    window.onload = initMap;
  </script>
</body>
</html>
