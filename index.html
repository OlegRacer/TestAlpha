<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Тест Fullscreen Hack 2</title>
  
  <style>
    /* ХАК 2: Базове значення змінної --real-width */
    :root {
      --real-width: 100vw;
    }

    /* Жорстко фіксуємо ширину через змінну */
    html, body {
      width: var(--real-width) !important;
      min-width: var(--real-width) !important;
      max-width: none !important;
      margin-left: auto !important;
      margin-right: auto !important;
      overflow-x: hidden;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      
      /* Відступи Safe Area */
      padding-top: env(safe-area-inset-top, 10px);
      padding-bottom: env(safe-area-inset-bottom, 10px);
      padding-left: env(safe-area-inset-left, 10px);
      padding-right: env(safe-area-inset-right, 10px);
    }

    header {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #ff9800;
      text-align: center;
    }

    main {
      background: #2a2a2a;
      padding: 20px;
      border-radius: 12px;
      margin: 15px 0;
    }

    .info-box {
      background: #333;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 16px;
      color: #00e676;
    }

    footer {
      background: #1e1e1e;
      padding: 15px;
      border-radius: 12px;
      border: 2px solid #2196f3;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h2>Тест ХАК 2 (Пастка ширини)</h2>
    <p>Потягніть сторінку (pull-to-refresh), щоб зафіксувати 844px</p>
  </header>

  <main>
    <h3>Параметри екрана:</h3>
    <div class="info-box">
      <p>Поточна innerWidth: <span id="winWidth">-</span>px</p>
      <p>Зафіксована ширина CSS: <span id="lockedWidth">ще не спіймано</span></p>
      <p>Ширина екрана (screen.width): <span id="screenWidth">-</span>px</p>
    </div>
  </main>

  <footer>
    <p>Як тільки ви потягнете сторінку, JS спіймає 844px і закріпить їх!</p>
  </footer>

  <script>
    /* Відображення розмірів на екрані */
    function updateDimensions() {
      document.getElementById('winWidth').textContent = window.innerWidth;
      document.getElementById('screenWidth').textContent = screen.width;
    }

    window.addEventListener('load', updateDimensions);
    window.addEventListener('resize', updateDimensions);
    window.addEventListener('scroll', updateDimensions);

    /* ХАК 2: Логіка перехоплення та фіксації ширини */
    (function initWidthLockHack() {
      var maxCapturedWidth = 0;

      function catchAndLockWidth() {
        var currentWidth = window.innerWidth;

        /* Якщо спіймали ширину, більшу за обрізані 750px */
        if (currentWidth > 750 && currentWidth > maxCapturedWidth) {
          maxCapturedWidth = currentWidth;

          /* Записуємо 844px у CSS-змінну */
          document.documentElement.style.setProperty('--real-width', maxCapturedWidth + 'px');
          
          /* Оновлюємо статус на екрані */
          var lockedEl = document.getElementById('lockedWidth');
          if (lockedEl) {
            lockedEl.textContent = maxCapturedWidth + 'px (Зафіксовано!)';
          }
        }
        updateDimensions();
      }

      /* Перевірка при завантаженні */
      catchAndLockWidth();

      /* Відстеження всіх подій руху та повороту */
      window.addEventListener('resize', catchAndLockWidth);
      window.addEventListener('scroll', catchAndLockWidth, { passive: true });
      window.addEventListener('touchmove', catchAndLockWidth, { passive: true });
      window.addEventListener('orientationchange', function() {
        maxCapturedWidth = 0;
        setTimeout(catchAndLockWidth, 200);
      });

      /* Авто-перевірка перші 3 секунди */
      var intervalId = setInterval(catchAndLockWidth, 100);
      setTimeout(function() { clearInterval(intervalId); }, 3000);
    })();
  </script>
</body>
</html>
