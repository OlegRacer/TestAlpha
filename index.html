<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>vRacer - Taiwan Scooter Nav</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    
    html, body { 
      width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background: #121212; color: #fff; overflow: hidden;
    }

    #map { position: absolute; top: 0; bottom: 0; width: 100%; height: 100%; z-index: 1; background: #121212; }

    /* Панель кнопок */
    .top-panel {
      position: absolute; top: 12px; left: 12px; right: 12px; z-index: 1000;
      display: flex; gap: 6px; flex-wrap: wrap; background: rgba(20,20,20,0.92);
      padding: 8px; border-radius: 12px; backdrop-filter: blur(8px); border: 1px solid #333;
      align-items: center;
    }

    .btn {
      background: #2a2a2a; color: #fff; border: 1px solid #444; padding: 6px 10px;
      border-radius: 8px; font-weight: 600; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }
    .btn:active, .btn.active { background: #37e0e6; color: #000; border-color: #37e0e6; }
    .btn-scooter { background: #e65100; border-color: #ff9800; }
    .btn-scooter.active { background: #ff9800; color: #000; }
    .btn-gps { background: #0288d1; border-color: #03a9f4; }
    .btn-gmaps { background: #4285F4; border-color: #1a73e8; }
    .btn-camera { background: #d32f2f; border-color: #f44336; }
    
    .btn-more { background: #333; font-size: 16px; padding: 4px 10px; border-radius: 8px; margin-left: auto; }

    /* Модальні вікна */
    .modal-overlay {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.75); z-index: 2000; display: none;
      align-items: center; justify-content: center; backdrop-filter: blur(5px);
    }
    .modal-card {
      background: #1e1e1e; border: 1px solid #444; border-radius: 14px;
      padding: 16px; width: 90%; max-width: 360px; display: flex; flex-direction: column; gap: 12px;
    }
    .modal-title { font-size: 15px; font-weight: bold; color: #37e0e6; display: flex; justify-content: space-between; align-items: center; }
    .modal-close { cursor: pointer; font-size: 18px; color: #aaa; }
    .input-group { display: flex; flex-direction: column; gap: 4px; }
    .input-label { font-size: 11px; color: #aaa; }
    .modal-input {
      background: #111; border: 1px solid #444; color: #fff; padding: 10px;
      border-radius: 8px; font-size: 13px; font-family: monospace; user-select: text; -webkit-user-select: text;
    }

    /* Меню кліку на карті */
    .leaflet-popup-content-wrapper { background: rgba(25,25,25,0.95); border: 1px solid #444; border-radius: 10px; padding: 4px 8px; color: #fff; }
    .leaflet-popup-content { margin: 6px 8px; }
    .map-popup-menu { display: flex; flex-direction: column; gap: 4px; min-width: 150px; }
    .popup-btn {
      background: #333; color: #fff; border: none; padding: 6px 8px;
      border-radius: 6px; font-size: 11px; font-weight: 600; cursor: pointer; text-align: left;
      display: flex; align-items: center; gap: 6px;
    }
    .popup-btn:active { background: #37e0e6; color: #000; }

    /* HUD Дистанція та Альтернативи */
    .turn-hud {
      position: absolute; top: 110px; left: 12px; z-index: 999;
      background: rgba(0,0,0,0.85); border: 2px solid #37e0e6; padding: 8px 12px;
      border-radius: 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .turn-dist { font-size: 18px; font-weight: bold; color: #fff; }
    
    .routes-selector { display: flex; gap: 6px; margin-top: 4px; }
    .route-chip {
      background: #333; border: 1px solid #555; color: #ccc; padding: 4px 8px;
      border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;
    }
    .route-chip.active { background: #37e0e6; color: #000; border-color: #37e0e6; }

    .poi-icon-box {
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85); border: 1px solid #fff; border-radius: 50%;
      font-size: 14px; box-shadow: 0 0 6px rgba(0,0,0,0.5);
    }

    /* Стиль іконок камер */
    .camera-icon-box {
      display: flex; align-items: center; justify-content: center;
      background: #d32f2f; color: #fff; border: 1.5px solid #fff; border-radius: 50%;
      font-size: 12px; box-shadow: 0 0 8px rgba(211,47,47,0.8); width: 24px; height: 24px;
    }
  </style>
</head>
<body>

  <div id="map"></div>

  <!-- Верхня Панель -->
  <div class="top-panel" id="topPanel">
    <button class="btn btn-scooter active" id="btn249cc" onclick="toggleScooterMode()">🛵 249cc</button>
    <button class="btn btn-gps" onclick="requestGPSLocation(true)">📍 GPS</button>
    <button class="btn btn-gmaps" onclick="openImportModal()">📋 Гугл</button>
    <button class="btn btn-camera" onclick="openGpxModal()">📷 GPX/CSV</button>
    <button class="btn" onclick="fetchNearbyPOI('fuel')">⛽ АЗС</button>
    <button class="btn" onclick="fetchNearbyPOI('shop')">🏪 7-11</button>
    <button class="btn" onclick="buildFullRoute()" style="background:#2e7d32; border-color:#4caf50;">▶ Старт</button>
    <button class="btn" onclick="clearAllWaypoints()" style="background:#c62828; border-color:#ef5350;">🗑</button>
    <button class="btn btn-more" onclick="openSettingsModal()">⋮</button>
  </div>

  <!-- Модальне вікно вставки Гугл -->
  <div class="modal-overlay" id="importModal">
    <div class="modal-card">
      <div class="modal-title">
        <span>📋 Імпорт з Google Maps</span>
        <span class="modal-close" onclick="closeImportModal()">✕</span>
      </div>
      <div class="input-group">
        <label class="input-label">Вставте посилання або координати:</label>
        <input type="text" id="gmapsUrlInput" class="modal-input" placeholder="https://maps.app.goo.gl/..." autocomplete="off">
      </div>
      <button class="btn" id="btnImportSubmit" onclick="processImportModal()" style="justify-content:center; background:#37e0e6; color:#000; padding:10px;">OK</button>
    </div>
  </div>

  <!-- Модальне вікно завантаження GPX / CSV Камер -->
  <div class="modal-overlay" id="gpxModal">
    <div class="modal-card">
      <div class="modal-title">
        <span>📷 Імпорт Камер (GPX / CSV)</span>
        <span class="modal-close" onclick="closeGpxModal()">✕</span>
      </div>
      <div class="input-group">
        <label class="input-label">Оберіть файл (.gpx або .csv):</label>
        <input type="file" id="gpxFileInput" accept=".gpx, .csv, .txt" class="modal-input">
      </div>
      <button class="btn" onclick="processCameraFile()" style="justify-content:center; background:#d32f2f; color:#fff; padding:10px;">Завантажити камери</button>
    </div>
  </div>

  <!-- Модалка Налаштувань -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <div class="modal-title">
        <span>⚙️ Налаштування</span>
        <span class="modal-close" onclick="closeSettingsModal()">✕</span>
      </div>
      <div class="input-group">
        <label class="input-label">OpenRouteService API Key:</label>
        <input type="text" id="orsKeyInput" class="modal-input" placeholder="Введіть ключ ORS">
      </div>
      <div class="input-group">
        <label class="input-label">Маршрутизатор:</label>
        <select id="routerEngineSelect" class="modal-input">
          <option value="osrm">OSRM Public (З альтернативами)</option>
          <option value="ors">OpenRouteService (ORS API)</option>
        </select>
      </div>
      <button class="btn" onclick="saveSettings()" style="background:#37e0e6; color:#000; justify-content:center; padding:10px;">Зберегти</button>
    </div>
  </div>

  <!-- HUD Дистанції та вибору альтернатив -->
  <div class="turn-hud" id="turnHud" style="display: none;">
    <div class="turn-dist" id="turnDist">--- км</div>
    <div class="routes-selector" id="routesSelector"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map, userMarker;
    let _lastLat = 25.0330, _lastLon = 121.5654;
    let isGpsCenteredOnce = false;
    
    let startPoint = null, waypoints = [], endPoint = null;
    let routePolylines = [];
    let activeRouteIndex = 0;
    let routesData = [];
    
    let waypointMarkers = [];
    let poiMarkers = [];
    let cameraMarkers = [];
    let cameraLayerGroup = null;
    let isScooterMode249 = true;

    const lg = k => localStorage.getItem(k);
    const ls = (k, v) => localStorage.setItem(k, v);

    function initMap() {
      try {
        map = L.map('map', { zoomControl: false }).setView([_lastLat, _lastLon], 14);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
          maxZoom: 19, attribution: '© OpenStreetMap'
        }).addTo(map);

        cameraLayerGroup = L.layerGroup().addTo(map);

        userMarker = L.marker([_lastLat, _lastLon], {
          icon: L.divIcon({
            html: `<div style="background:#00e5ff;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 8px #00e5ff;"></div>`,
            className: 'user-gps-icon', iconSize: [18, 18]
          })
        }).addTo(map);

        map.on('click', onMapTap);
        loadSettings();

        requestGPSLocation(true);
        startGpsWatch();

        setTimeout(() => { map.invalidateSize(); }, 500);
      } catch(e) {
        console.error("Map init error:", e);
      }
    }

    function requestGPSLocation(shouldFly = false) {
      if (!navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          _lastLat = pos.coords.latitude;
          _lastLon = pos.coords.longitude;
          if (userMarker) userMarker.setLatLng([_lastLat, _lastLon]);
          if (shouldFly || !isGpsCenteredOnce) {
            map.flyTo([_lastLat, _lastLon], 16, { animate: true });
            isGpsCenteredOnce = true;
          }
        },
        (err) => {},
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    }

    function startGpsWatch() {
      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          (pos) => {
            _lastLat = pos.coords.latitude;
            _lastLon = pos.coords.longitude;
            if (userMarker) userMarker.setLatLng([_lastLat, _lastLon]);
          },
          (err) => console.warn(err),
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 2000 }
        );
      }
    }

    /* ── ФУНКЦІЇ ДЛЯ МОДАЛКИ GPX / CSV ────────────────────────────────── */
    function openGpxModal() {
      document.getElementById('gpxModal').style.display = 'flex';
    }

    function closeGpxModal() {
      document.getElementById('gpxModal').style.display = 'none';
    }

    function processCameraFile() {
      const fileInput = document.getElementById('gpxFileInput');
      const file = fileInput.files[0];

      if (!file) {
        alert("Будь ласка, виберіть файл (.gpx або .csv).");
        return;
      }

      const fileName = file.name.toLowerCase();
      const reader = new FileReader();

      reader.onload = function(e) {
        const text = e.target.result;
        if (fileName.endsWith('.csv') || fileName.endsWith('.txt')) {
          parseAndDisplayCsvCameras(text);
        } else {
          parseAndDisplayGpxCameras(text);
        }
        closeGpxModal();
      };

      reader.readAsText(file);
    }

    /* ── ПАРСЕР CSV ФАЙЛІВ ────────────────────────────────────────────── */
    function parseAndDisplayCsvCameras(csvText) {
      const lines = csvText.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (lines.length === 0) {
        alert("CSV файл порожній!");
        return;
      }

      const firstLine = lines[0];
      let delimiter = ',';
      if (firstLine.includes(';')) delimiter = ';';
      else if (firstLine.includes('\t')) delimiter = '\t';

      const headers = firstLine.split(delimiter).map(h => h.trim().toLowerCase().replace(/^["']|["']$/g, ''));
      
      let latIdx = -1, lonIdx = -1, speedIdx = -1, nameIdx = -1, descIdx = -1;

      headers.forEach((h, i) => {
        if (['lat', 'latitude', 'y', 'lat_deg'].includes(h)) latIdx = i;
        else if (['lon', 'lng', 'longitude', 'x', 'lon_deg'].includes(h)) lonIdx = i;
        else if (['speed', 'maxspeed', 'limit', 'speedlimit', 'spd'].includes(h)) speedIdx = i;
        else if (['name', 'title', 'id', 'label', 'type'].includes(h)) nameIdx = i;
        else if (['desc', 'description', 'info', 'note'].includes(h)) descIdx = i;
      });

      let startIndex = 1;
      if (latIdx === -1 || lonIdx === -1) {
        startIndex = 0;
        const parts0 = lines[0].split(delimiter);
        if (parts0.length >= 2 && !isNaN(parseFloat(parts0[0])) && !isNaN(parseFloat(parts0[1]))) {
          let v0 = parseFloat(parts0[0]);
          let v1 = parseFloat(parts0[1]);
          if (v0 > 40 && v0 < 180) { lonIdx = 0; latIdx = 1; }
          else { latIdx = 0; lonIdx = 1; }
          if (parts0.length > 2) speedIdx = 2;
          if (parts0.length > 3) nameIdx = 3;
        } else {
          alert("Не вдалося автоматично визначити колонки широт та довгот у CSV файлі.");
          return;
        }
      }

      cameraLayerGroup.clearLayers();
      cameraMarkers = [];
      let bounds = L.latLngBounds();

      for (let i = startIndex; i < lines.length; i++) {
        const cols = lines[i].split(delimiter).map(c => c.trim().replace(/^["']|["']$/g, ''));
        if (cols.length <= Math.max(latIdx, lonIdx)) continue;

        let lat = parseFloat(cols[latIdx]);
        let lon = parseFloat(cols[lonIdx]);

        if (isNaN(lat) || isNaN(lon)) continue;

        let speedText = speedIdx !== -1 && cols[speedIdx] ? cols[speedIdx] : "";
        let nameText = nameIdx !== -1 && cols[nameIdx] ? cols[nameIdx] : "Камера";
        let descText = descIdx !== -1 && cols[descIdx] ? cols[descIdx] : "";

        if (speedText && !isNaN(speedText)) speedText = `${speedText} км/год`;

        const marker = L.marker([lat, lon], {
          icon: L.divIcon({
            html: `<div class="camera-icon-box">📷</div>`,
            className: 'camera-marker',
            iconSize: [24, 24]
          })
        });

        let popupContent = `<div style="font-size:12px;">`;
        popupContent += `<b style="color:#f44336;">📷 Камера фіксації</b><br>`;
        if (speedText) popupContent += `<span style="color:#ffeb3b; font-weight:bold;">⚡ Обмеження: ${speedText}</span><br>`;
        if (nameText) popupContent += `<span style="color:#aaa;">${nameText}</span><br>`;
        if (descText) popupContent += `<small style="color:#888;">${descText}</small>`;
        popupContent += `</div>`;

        marker.bindPopup(popupContent);
        cameraLayerGroup.addLayer(marker);
        cameraMarkers.push(marker);

        bounds.extend([lat, lon]);
      }

      alert(`Успішно завантажено камер з CSV: ${cameraMarkers.length}`);

      if (cameraMarkers.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    /* ── ПАРСЕР GPX ФАЙЛІВ ────────────────────────────────────────────── */
    function parseAndDisplayGpxCameras(gpxXmlText) {
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(gpxXmlText, "text/xml");
      const waypoints = xmlDoc.getElementsByTagName("wpt");

      if (waypoints.length === 0) {
        alert("У GPX-файлі не знайдено точок камер (wpt)!");
        return;
      }

      cameraLayerGroup.clearLayers();
      cameraMarkers = [];
      let bounds = L.latLngBounds();

      for (let i = 0; i < waypoints.length; i++) {
        const wpt = waypoints[i];
        const lat = parseFloat(wpt.getAttribute("lat"));
        const lon = parseFloat(wpt.getAttribute("lon"));

        if (isNaN(lat) || isNaN(lon)) continue;

        let nameNode = wpt.getElementsByTagName("name")[0];
        let descNode = wpt.getElementsByTagName("desc")[0];

        let name = nameNode ? nameNode.textContent : "Камера";
        let desc = descNode ? descNode.textContent : "";

        let speedMatch = desc.match(/maxspeed=(\d+)/);
        let speedText = speedMatch ? `${speedMatch[1]} км/год` : "";

        const marker = L.marker([lat, lon], {
          icon: L.divIcon({
            html: `<div class="camera-icon-box">📷</div>`,
            className: 'camera-marker',
            iconSize: [24, 24]
          })
        });

        let popupContent = `<div style="font-size:12px;">`;
        popupContent += `<b style="color:#f44336;">📷 Камера фіксації</b><br>`;
        if (speedText) popupContent += `<span style="color:#ffeb3b; font-weight:bold;">⚡ Обмеження: ${speedText}</span><br>`;
        if (name) popupContent += `<span style="color:#aaa;">${name}</span><br>`;
        if (desc) popupContent += `<small style="color:#888;">${desc.replace(/\n/g, '<br>')}</small>`;
        popupContent += `</div>`;

        marker.bindPopup(popupContent);
        cameraLayerGroup.addLayer(marker);
        cameraMarkers.push(marker);

        bounds.extend([lat, lon]);
      }

      alert(`Успішно завантажено камер з GPX: ${cameraMarkers.length}`);

      if (cameraMarkers.length > 0) {
        map.fitBounds(bounds, { padding: [30, 30] });
      }
    }

    function openImportModal() {
      const modal = document.getElementById('importModal');
      const input = document.getElementById('gmapsUrlInput');
      input.value = '';
      modal.style.display = 'flex';
      setTimeout(() => input.focus(), 100);
    }

    function closeImportModal() {
      document.getElementById('importModal').style.display = 'none';
    }

    /* ── УНІВЕРСАЛЬНИЙ ІМПОРТ (ПОСИЛАННЯ / МАРШРУТИ / НАЗВИ) ── */
    async function processImportModal() {
      const inputEl = document.getElementById('gmapsUrlInput');
      let rawText = inputEl.value;
      if (!rawText) return;

      const submitBtn = document.getElementById('btnImportSubmit');
      submitBtn.textContent = '⏳ Пошук координат...';
      submitBtn.disabled = true;

      try {
        // Витягуємо всі посилання, ігноруючи системне сміття bplist
        const urlMatches = rawText.match(/https?:\/\/[^\s"'\\]+/gi) || [];
        let coords = [];

        for (let url of urlMatches) {
          // 1. Пошук числових координат у самому посиланні
          coords = extractCoordsFromText(url);
          if (coords.length > 0) break;

          // 2. Аналіз посилань маршрутів (/dir/...)
          const decodedUrl = decodeURIComponent(url);
          const placeNameMatch = decodedUrl.match(/\/dir\/[^\/]+\/([^\/@?]+)/);
          if (placeNameMatch && placeNameMatch[1]) {
            let placeName = placeNameMatch[1].replace(/\+/g, ' ');
            const geocoded = await geocodeWithNominatim(placeName);
            if (geocoded) {
              coords = [geocoded];
              break;
            }
          }

          // 3. Розпакування коротких посилань (maps.app.goo.gl)
          if (url.includes('goo.gl')) {
            const resolvedList = await resolveShortUrlAdvanced(url);
            for (let resItem of resolvedList) {
              coords = extractCoordsFromText(resItem);
              if (coords.length > 0) break;

              const placeName = extractPlaceName(resItem);
              if (placeName) {
                const geocoded = await geocodeWithNominatim(placeName);
                if (geocoded) {
                  coords = [geocoded];
                  break;
                }
              }
            }
          }
          if (coords.length > 0) break;
        }

        // Якщо вставлено простий текст без http (наприклад, суто координати)
        if (coords.length === 0 && urlMatches.length === 0) {
          coords = extractCoordsFromText(rawText);
          if (coords.length === 0) {
            const geocoded = await geocodeWithNominatim(rawText);
            if (geocoded) coords = [geocoded];
          }
        }

        if (coords.length > 0) {
          closeImportModal();
          applyCoordinates(coords);
        } else {
          alert("Не вдалося знайти координати. Спробуйте в Google Maps відкрити магазин напряму без побудови маршруту.");
        }
      } catch (err) {
        console.error("Помилка імпорту:", err);
        alert("Виникла помилка під час обробки.");
      } finally {
        submitBtn.textContent = 'OK';
        submitBtn.disabled = false;
      }
    }

    async function resolveShortUrlAdvanced(shortUrl) {
      let sources = [];
      try {
        const res = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent(shortUrl)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.contents) sources.push(data.contents);
        }
      } catch (e) {}

      try {
        const res = await fetch(`https://corsproxy.io/?${encodeURIComponent(shortUrl)}`);
        if (res.ok) {
          sources.push(res.url);
          sources.push(await res.text());
        }
      } catch (e) {}

      sources.push(shortUrl);
      return sources;
    }

    function extractPlaceName(str) {
      if (!str) return null;
      try { str = decodeURIComponent(str); } catch(e) {}

      const matchPlace = str.match(/\/maps\/place\/([^\/@?]+)/);
      if (matchPlace && matchPlace[1]) return matchPlace[1].replace(/\+/g, ' ');

      const matchTitle = str.match(/<title>(.*?)<\/title>/i);
      if (matchTitle && matchTitle[1]) {
        let title = matchTitle[1].replace('- Google Maps', '').trim();
        if (title && !title.includes('Google Maps')) return title;
      }

      const matchOg = str.match(/property="og:title"\s+content="([^"]+)"/i);
      if (matchOg && matchOg[1]) return matchOg[1];

      return null;
    }

    async function geocodeWithNominatim(query) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=1`);
        const data = await res.json();
        if (data && data.length > 0) {
          return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
        }
      } catch (e) {}
      return null;
    }

    function extractCoordsFromText(str) {
      let results = [];
      if (!str) return results;

      try { str = decodeURIComponent(str); } catch(e) {}

      const g3d4d = [...str.matchAll(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/g)];
      if (g3d4d.length > 0) { g3d4d.forEach(m => results.push([parseFloat(m[1]), parseFloat(m[2])])); return results; }

      const g2d3d = [...str.matchAll(/!2d(-?\d+\.\d+)!3d(-?\d+\.\d+)/g)];
      if (g2d3d.length > 0) { g2d3d.forEach(m => results.push([parseFloat(m[2]), parseFloat(m[1])])); return results; }

      const gAt = [...str.matchAll(/@(-?\d+\.\d+),(-?\d+\.\d+)/g)];
      if (gAt.length > 0) { gAt.forEach(m => results.push([parseFloat(m[1]), parseFloat(m[2])])); return results; }

      const standard = [...str.matchAll(/(-?\d+\.\d{3,})\s*,\s*(-?\d+\.\d{3,})/g)];
      if (standard.length > 0) { standard.forEach(m => results.push([parseFloat(m[1]), parseFloat(m[2])])); return results; }

      return results;
    }

    function applyCoordinates(coordsList) {
      if (coordsList.length >= 2) {
        startPoint = coordsList[0];
        endPoint = coordsList[coordsList.length - 1];
      } else if (coordsList.length === 1) {
        startPoint = [_lastLat, _lastLon];
        endPoint = coordsList[0];
      }
      renderWaypointMarkers();
      buildFullRoute();
    }

    /* ── МАРШРУТИ З ОЧИЩЕННЯМ ДУБЛІКАТІВ ────────────────────────────────── */
    async function buildFullRoute() {
      const pStart = startPoint || [_lastLat, _lastLon];
      if (!endPoint) { alert('Оберіть пункт призначення!'); return; }

      const allPts = [pStart, ...waypoints, endPoint];
      const engine = lg('routerEngine') || 'osrm';
      const orsKey = lg('orsKey') || '';
      
      clearRoutePolylines();
      routesData = [];
      let rawRoutes = [];

      if (engine === 'ors' && orsKey) {
        const bodyQuery = { 
          coordinates: allPts.map(p => [p[1], p[0]]), 
          preference: "recommended", 
          alternative_routes: { target_count: 3 } 
        };
        if (isScooterMode249) bodyQuery.options = { avoid_features: ["highways", "tollways", "ferries"] };

        try {
          const res = await fetch(`https://api.openrouteservice.org/v2/directions/driving-car/geojson`, {
            method: 'POST',
            headers: { 'Authorization': orsKey, 'Content-Type': 'application/json' },
            body: JSON.stringify(bodyQuery)
          });
          const data = await res.json();
          if (data.features) {
            rawRoutes = data.features.map(f => ({
              coords: f.geometry.coordinates.map(c => [c[1], c[0]]),
              distance: f.properties.summary.distance
            }));
          }
        } catch(e) {}
      }

      if (rawRoutes.length === 0) {
        const coordStr = allPts.map(p => `${p[1]},${p[0]}`).join(';');
        try {
          const res = await fetch(`https://router.project-osrm.org/route/v1/driving/${coordStr}?overview=full&geometries=geojson&alternatives=true`);
          const data = await res.json();
          if (data.code === 'Ok' && data.routes) {
            rawRoutes = data.routes.map(r => ({
              coords: r.geometry.coordinates.map(c => [c[1], c[0]]),
              distance: r.distance
            }));
          }
        } catch (e) {}
      }

      if (rawRoutes.length > 0) {
        routesData = filterUniqueRoutes(rawRoutes);
        activeRouteIndex = 0;
        drawRoutesOnMap();
        updateHudUI();
      } else {
        alert("Не вдалося побудувати маршрут.");
      }
    }

    function filterUniqueRoutes(routes) {
      const unique = [];
      routes.forEach(rt => {
        const isDuplicate = unique.some(u => Math.abs(u.distance - rt.distance) < 100);
        if (!isDuplicate) unique.push(rt);
      });
      return unique;
    }

    function drawRoutesOnMap() {
      clearRoutePolylines();

      routesData.forEach((rt, idx) => {
        if (idx !== activeRouteIndex) {
          const poly = L.polyline(rt.coords, { color: '#777777', weight: 5, opacity: 0.6, interactive: true }).addTo(map);
          poly.on('click', () => selectRoute(idx));
          routePolylines[idx] = poly;
        }
      });

      const activeRt = routesData[activeRouteIndex];
      const activePoly = L.polyline(activeRt.coords, { color: '#37e0e6', weight: 7, opacity: 0.95, interactive: true }).addTo(map);
      routePolylines[activeRouteIndex] = activePoly;

      map.fitBounds(activePoly.getBounds(), { padding: [40, 40] });
    }

    function selectRoute(index) {
      activeRouteIndex = index;
      drawRoutesOnMap();
      updateHudUI();
    }

    function updateHudUI() {
      document.getElementById('turnHud').style.display = 'flex';
      const activeRt = routesData[activeRouteIndex];
      document.getElementById('turnDist').textContent = `${(activeRt.distance / 1000).toFixed(1)} км`;

      const selector = document.getElementById('routesSelector');
      selector.innerHTML = '';

      if (routesData.length > 1) {
        routesData.forEach((rt, idx) => {
          const chip = document.createElement('div');
          chip.className = `route-chip ${idx === activeRouteIndex ? 'active' : ''}`;
          chip.textContent = `#${idx + 1} (${(rt.distance / 1000).toFixed(1)}км)`;
          chip.onclick = () => selectRoute(idx);
          selector.appendChild(chip);
        });
      }
    }

    function clearRoutePolylines() {
      routePolylines.forEach(p => { if (p) map.removeLayer(p); });
      routePolylines = [];
    }

    function clearAllWaypoints() {
      startPoint = null; waypoints = []; endPoint = null;
      clearRoutePolylines();
      clearPoiMarkers();
      renderWaypointMarkers();
      document.getElementById('turnHud').style.display = 'none';
    }

    /* ── ЗАВАНТАЖЕННЯ POI З ФОЛБЕК-СЕРВЕРАМИ ────────────────────────────── */
    async function fetchNearbyPOI(type) {
      clearPoiMarkers();
      const center = map.getCenter();
      const radius = 3000;
      
      let queryFilter = type === 'fuel' 
        ? `node["amenity"="fuel"](around:${radius},${center.lat},${center.lng});`
        : `node["shop"="convenience"](around:${radius},${center.lat},${center.lng});`;
      
      const query = `[out:json][timeout:10];${queryFilter}out body 30;`;
      let emoji = type === 'fuel' ? '⛽' : '🏪';

      const endpoints = [
        'https://overpass-api.de/api/interpreter',
        'https://overpass.kumi.systems/api/interpreter',
        'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
      ];

      let data = null;

      for (const url of endpoints) {
        try {
          const response = await fetch(`${url}?data=${encodeURIComponent(query)}`);
          if (response.ok) {
            data = await response.json();
            break;
          }
        } catch (e) {
          console.warn(`Сервер ${url} не відповідає, пробуємо резервний...`);
        }
      }

      if (!data || !data.elements) {
        alert("Сервери POI тимчасово недоступні. Спробуйте ще раз.");
        return;
      }

      if (data.elements.length === 0) {
        alert("Поруч нічого не знайдено.");
        return;
      }

      data.elements.forEach(el => {
        const name = el.tags.name || (type === 'fuel' ? 'АЗС' : 'Магазин');
        const marker = L.marker([el.lat, el.lon], {
          icon: L.divIcon({ 
            html: `<div class="poi-icon-box">${emoji}</div>`, 
            className: 'poi-marker', 
            iconSize: [26, 26] 
          })
        }).addTo(map);

        const popupHtml = `
          <div class="map-popup-menu">
            <b style="font-size:12px; margin-bottom:4px;">${name}</b>
            <button class="popup-btn" onclick="setRoutePoint('start', ${el.lat}, ${el.lon})"><span style="color:#4caf50">🟢</span> Старт</button>
            <button class="popup-btn" onclick="setRoutePoint('via', ${el.lat}, ${el.lon})"><span style="color:#ffeb3b">🟡</span> Зупинка</button>
            <button class="popup-btn" onclick="setRoutePoint('end', ${el.lat}, ${el.lon})"><span style="color:#f44336">🔴</span> Фініш</button>
          </div>
        `;
        marker.bindPopup(popupHtml);
        poiMarkers.push(marker);
      });
    }

    function clearPoiMarkers() { poiMarkers.forEach(m => map.removeLayer(m)); poiMarkers = []; }

    function openSettingsModal() { document.getElementById('settingsModal').style.display = 'flex'; }
    function closeSettingsModal() { document.getElementById('settingsModal').style.display = 'none'; }
    function loadSettings() {
      document.getElementById('orsKeyInput').value = lg('orsKey') || '';
      document.getElementById('routerEngineSelect').value = lg('routerEngine') || 'osrm';
    }
    function saveSettings() {
      ls('orsKey', document.getElementById('orsKeyInput').value.trim());
      ls('routerEngine', document.getElementById('routerEngineSelect').value);
      closeSettingsModal();
      alert('Збережено!');
    }

    function onMapTap(e) {
      const { lat, lng } = e.latlng;
      const popupContent = document.createElement('div');
      popupContent.className = 'map-popup-menu';
      popupContent.innerHTML = `
        <button class="popup-btn" onclick="setRoutePoint('start', ${lat}, ${lng})"><span style="color:#4caf50">🟢</span> Старт</button>
        <button class="popup-btn" onclick="setRoutePoint('via', ${lat}, ${lng})"><span style="color:#ffeb3b">🟡</span> Проміжна</button>
        <button class="popup-btn" onclick="setRoutePoint('end', ${lat}, ${lng})"><span style="color:#f44336">🔴</span> Фініш</button>
      `;
      L.popup({ closeButton: false, offset: [0, -5] }).setLatLng(e.latlng).setContent(popupContent).openOn(map);
    }

    function setRoutePoint(type, lat, lng) {
      map.closePopup();
      if (type === 'start') startPoint = [lat, lng];
      else if (type === 'via') waypoints.push([lat, lng]);
      else if (type === 'end') endPoint = [lat, lng];
      renderWaypointMarkers();
    }

    function renderWaypointMarkers() {
      waypointMarkers.forEach(m => map.removeLayer(m));
      waypointMarkers = [];
      if (startPoint) waypointMarkers.push(L.marker(startPoint, { icon: createColorIcon('#4caf50', 'S') }).addTo(map));
      waypoints.forEach((pt, idx) => waypointMarkers.push(L.marker(pt, { icon: createColorIcon('#ffeb3b', idx + 1) }).addTo(map)));
      if (endPoint) waypointMarkers.push(L.marker(endPoint, { icon: createColorIcon('#f44336', 'F') }).addTo(map));
    }

    function createColorIcon(color, text) {
      return L.divIcon({
        html: `<div style="background:${color};color:#000;font-weight:bold;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;font-size:11px;">${text}</div>`,
        className: 'wp-icon', iconSize: [22, 22]
      });
    }

    function toggleScooterMode() {
      isScooterMode249 = !isScooterMode249;
      const btn = document.getElementById('btn249cc');
      btn.classList.toggle('active', isScooterMode249);
      btn.innerHTML = isScooterMode249 ? '🛵 249cc' : '🚗 Авто';
    }

    window.addEventListener('DOMContentLoaded', initMap);
  </script>
</body>
