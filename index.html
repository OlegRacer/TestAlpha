<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>vRacer Dash Pro - Cyberpunk HUD</title>
  
  <!-- Шрифти Cyberpunk / Digital -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  
  <!-- Leaflet CSS for Map -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      --bg-dark: #0a0c10;
      --panel-bg: linear-gradient(180deg, #212832 0%, #12161d 100%);
      --panel-border: #3b4756;
      --panel-border-highlight: #5b6c82;
      --accent-red: #ff2a44;
      --accent-green: #00ff88;
      --accent-cyan: #00f2fe;
      --text-digital: #ffffff;
      --font-digital: 'Share Tech Mono', monospace;
      --font-ui: 'Orbitron', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: #9ab0c7;
      font-family: var(--font-ui);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
    }

    /* Основний рамковий контейнер */
    .vracer-frame {
      width: 100%;
      max-width: 1280px;
      background: radial-gradient(circle at center, #181f28 0%, #080a0d 100%);
      border: 3px solid #2e3745;
      border-radius: 20px;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 0 20px rgba(0,0,0,0.8);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      position: relative;
    }

    /* Навігаційна панель зверху */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn-hud {
      background: linear-gradient(180deg, #2b3543 0%, #181e26 100%);
      border: 1px solid var(--panel-border);
      color: #c2d3e5;
      padding: 6px 14px;
      border-radius: 8px;
      font-family: var(--font-ui);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-hud:hover {
      border-color: var(--panel-border-highlight);
      color: #fff;
      box-shadow: 0 0 8px rgba(0, 242, 254, 0.3);
    }

    .btn-hud.active {
      background: linear-gradient(180deg, #ff2a44 0%, #990014 100%);
      border-color: #ff5e73;
      color: #fff;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #556677;
    }

    .status-dot.online {
      background-color: var(--accent-green);
      box-shadow: 0 0 8px var(--accent-green);
    }

    /* ОСНОВНА СІТКА */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr 1.1fr;
      gap: 14px;
    }

    /* Карточки модулів */
    .hud-card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-top: 1px solid var(--panel-border-highlight);
      border-radius: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 8px 16px rgba(0, 0, 0, 0.5);
      padding: 12px;
      position: relative;
      overflow: hidden;
    }

    .hud-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 4px;
      margin-bottom: 8px;
      font-size: 0.7rem;
      color: #8395a7;
      letter-spacing: 1px;
    }

    .hud-cross {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px solid #485460;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: #485460;
    }

    /* Блок двигуна (Зліва) */
    .engine-block {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
    }

    .engine-title {
      font-size: 0.9rem;
      font-weight: 800;
      color: #8ca0b5;
      letter-spacing: 1.5px;
    }

    .engine-visual-container {
      position: relative;
      width: 100%;
      height: 140px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .engine-svg-wrapper {
      position: relative;
      width: 50%;
      height: 100%;
    }

    .sensor-dot {
      width: 6px;
      height: 6px;
      background-color: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-red);
      position: absolute;
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: 0.4; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1.3); }
    }

    .digital-val {
      font-family: var(--font-digital);
      color: var(--text-digital);
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.7);
      font-weight: bold;
      line-height: 1;
    }

    .engine-val-large {
      font-size: 3.5rem;
      width: 48%;
      text-align: right;
    }

    /* Центральний спідометр */
    .speed-center-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      background: radial-gradient(circle at center, rgba(30, 38, 48, 0.8) 0%, rgba(15, 18, 24, 0.9) 100%);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 16px;
    }

    .big-speed {
      font-size: 6.5rem;
      letter-spacing: -2px;
    }

    .speed-unit {
      font-size: 1.2rem;
      color: #7f8c8d;
      margin-top: -10px;
      margin-bottom: 15px;
    }

    .v-racer-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.2rem;
      font-weight: 900;
      color: #ffffff;
      letter-spacing: 2px;
    }

    .v-logo-badge {
      background: linear-gradient(135deg, #ff2a44 0%, #7a0010 100%);
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 1.1rem;
      box-shadow: 0 0 10px rgba(255, 42, 68, 0.5);
    }

    /* Блок стану мотоцикла та GPS (Праворуч) */
    .bike-info-block {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .net-link-status {
      font-size: 0.7rem;
      color: #a4b0be;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .bike-display-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 140px;
      position: relative;
      margin-top: 8px;
    }

    #mini-map {
      width: 85px;
      height: 85px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }

    .bike-vector-container {
      position: relative;
      width: 140px;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .street-status-footer {
      font-size: 0.7rem;
      letter-spacing: 1px;
      color: #576574;
      text-align: center;
      margin-top: 4px;
    }

    /* НИЖНЯ ПАНЕЛЬ СЕНСОРІВ */
    .bottom-sensors-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1.3fr 1.2fr;
      gap: 14px;
    }

    .mini-chart {
      width: 100%;
      height: 28px;
      margin-top: 6px;
    }

    .sensor-num {
      font-size: 1.8rem;
      margin-top: 2px;
    }

    .dual-sensor-vals {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
    }

    .mode-nav-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      height: 100%;
      align-items: center;
    }

    .mode-btn {
      background: linear-gradient(180deg, #2b3543 0%, #151a21 100%);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: #8a9ba8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 100%;
      cursor: pointer;
      font-size: 0.65rem;
      font-family: var(--font-ui);
      transition: all 0.2s;
    }

    .mode-btn.active, .mode-btn:hover {
      color: #fff;
      border-color: var(--accent-red);
      background: linear-gradient(180deg, #3d2228 0%, #1a1215 100%);
    }

    .mode-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Медіазапити для мобільних пристроїв */
    @media (max-width: 900px) {
      .dashboard-grid, .bottom-sensors-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

<div class="vracer-frame">
  <!-- Верхня панель -->
  <header class="top-nav">
    <div class="btn-group">
      <button class="btn-hud" id="bleConnectBtn">
        <span class="status-dot" id="bleStatusDot"></span>
        <span id="bleBtnText">Connect</span>
      </button>
      <button class="btn-hud" id="resetBtn">Скинути</button>
      <button class="btn-hud" id="pipBtn">PiP</button>
      <button class="btn-hud" id="tripBtn">Trip</button>
    </div>
    <div class="btn-group">
      <button class="btn-hud" id="configBtn">Налаштувати</button>
    </div>
  </header>

  <!-- Основний контент -->
  <main class="dashboard-grid">
    <!-- Лівий блок: Двигун -->
    <section class="hud-card engine-block">
      <div class="engine-title">T_ENG</div>
      <div class="engine-visual-container">
        <div class="engine-svg-wrapper">
          <!-- Контур Двигуна (SVG) -->
          <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; opacity: 0.5; stroke: #00f2fe; fill: none; stroke-width: 1.5;">
            <path d="M20,30 L40,10 L60,10 L80,30 L80,70 L60,90 L40,90 L20,70 Z M40,10 L40,90 M60,10 L60,90 M20,50 L80,50" />
          </svg>
          <!-- Пульсуючі червоні сенсори -->
          <div class="sensor-dot" style="top: 25%; left: 20%;"></div>
          <div class="sensor-dot" style="top: 15%; left: 65%;"></div>
          <div class="sensor-dot" style="top: 50%; left: 80%;"></div>
          <div class="sensor-dot" style="top: 75%; left: 35%;"></div>
        </div>
        <div class="digital-val engine-val-large" id="valEngineTemp">112</div>
      </div>
    </section>

    <!-- Центральний блок: Спідометр -->
    <section class="speed-center-block">
      <div class="digital-val big-speed" id="valSpeed">0</div>
      <div class="speed-unit">km/h</div>
      <div class="v-racer-brand">
        <span class="v-logo-badge">V</span> Racer
      </div>
    </section>

    <!-- Правий блок: Стан та GPS -->
    <section class="hud-card bike-info-block">
      <div class="net-link-status">
        <span class="status-dot online"></span> NET_LINK: HEYWOOD FREE NET
      </div>
      <div class="bike-display-area">
        <div id="mini-map"></div>
        <div class="bike-vector-container">
          <!-- Схема Мотоцикла (SVG) -->
          <svg viewBox="0 0 100 100" style="width: 100%; height: 100%; opacity: 0.7; stroke: #ffffff; fill: none; stroke-width: 1.2;">
            <circle cx="25" cy="70" r="15" />
            <circle cx="75" cy="70" r="15" />
            <path d="M25,70 L40,40 L60,40 L75,70 M40,40 L30,20 L45,20 M60,40 L50,60" />
          </svg>
          <div class="sensor-dot" style="top: 20%; left: 40%;"></div>
          <div class="sensor-dot" style="top: 65%; left: 75%;"></div>
        </div>
      </div>
      <div class="street-status-footer">[ STREET-LEVEL: ACTIVE ]</div>
    </section>
  </main>

  <!-- Нижня панель датчиків -->
  <footer class="bottom-sensors-grid">
    <!-- TPS% -->
    <div class="hud-card">
      <div class="hud-card-header">
        <span>TPS%</span>
        <div class="hud-cross">×</div>
      </div>
      <div class="digital-val sensor-num" id="valTps">00</div>
      <canvas id="chartTps" class="mini-chart"></canvas>
    </div>

    <!-- T_AIR -->
    <div class="hud-card">
      <div class="hud-card-header">
        <span>T_AIR</span>
        <div class="hud-cross">×</div>
      </div>
      <div class="digital-val sensor-num" id="valAirTemp">25</div>
      <canvas id="chartAir" class="mini-chart"></canvas>
    </div>

    <!-- VOLT / RPM -->
    <div class="hud-card">
      <div class="hud-card-header">
        <span>VOLT</span>
        <span>RPM</span>
        <div class="hud-cross">×</div>
      </div>
      <div class="dual-sensor-vals">
        <span class="digital-val sensor-num" id="valVolt">12.8</span>
        <span class="digital-val sensor-num" id="valRpm">0</span>
      </div>
      <canvas id="chartRpm" class="mini-chart"></canvas>
    </div>

    <!-- Вибір режиму навігації -->
    <div class="hud-card">
      <div class="mode-nav-btns">
        <button class="mode-btn">
          <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
          GPS
        </button>
        <button class="mode-btn active">
          <svg viewBox="0 0 24 24"><path d="M20.38 8.57l-1.23 1.85a8 8 0 0 1-.22 7.58H5.07A8 8 0 0 1 15.58 6.85l1.85-1.23A10 10 0 0 0 2 18h20a10 10 0 0 0-1.62-9.43zM12 13a1 1 0 1 0 0-2 1 1 0 0 0 0 2z"/></svg>
          Speed
        </button>
        <button class="mode-btn">
          <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
          TRIP
        </button>
      </div>
    </div>
  </footer>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // Стан програми vRacer Dash Pro
  const state = {
    connected: false,
    bleDevice: null,
    telemetry: {
      speed: 0,
      rpm: 0,
      engineTemp: 112,
      airTemp: 25,
      tps: 0,
      volt: 12.8
    },
    history: {
      tps: new Array(20).fill(0),
      air: new Array(20).fill(25),
      rpm: new Array(20).fill(0)
    }
  };

  // Ініціалізація Leaflet карти
  let map;
  function initMap() {
    map = L.map('mini-map', {
      zoomControl: false,
      attributionControl: false
    }).setView([50.4501, 30.5234], 13); // Київ за замовчуванням

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
      maxZoom: 19
    }).addTo(map);
  }

  // Оновлення UI
  function updateUI() {
    document.getElementById('valSpeed').innerText = Math.round(state.telemetry.speed);
    document.getElementById('valEngineTemp').innerText = Math.round(state.telemetry.engineTemp);
    document.getElementById('valAirTemp').innerText = Math.round(state.telemetry.airTemp);
    document.getElementById('valTps').innerText = String(Math.round(state.telemetry.tps)).padStart(2, '0');
    document.getElementById('valVolt').innerText = state.telemetry.volt.toFixed(1);
    document.getElementById('valRpm').innerText = Math.round(state.telemetry.rpm);

    // Оновлення графіків-іскрограм (Sparklines)
    drawSparkline('chartTps', state.history.tps, '#00f2fe');
    drawSparkline('chartAir', state.history.air, '#00ff88');
    drawSparkline('chartRpm', state.history.rpm, '#ff2a44');
  }

  // Малювання міні-графіків на Canvas
  function drawSparkline(canvasId, data, color) {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.offsetWidth;
    const h = canvas.height = canvas.offsetHeight;

    ctx.clearRect(0, 0, w, h);
    ctx.beginPath();
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;

    const max = Math.max(...data, 1);
    const min = Math.min(...data, 0);
    const step = w / (data.length - 1);

    data.forEach((val, index) => {
      const x = index * step;
      const y = h - ((val - min) / (max - min || 1)) * (h - 4) - 2;
      if (index === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });

    ctx.stroke();
  }

  // Web Bluetooth LE Налаштування
  async function setupBleUI() {
    const btnConnect = document.getElementById('bleConnectBtn');
    const statusDot = document.getElementById('bleStatusDot');
    const btnText = document.getElementById('bleBtnText');

    btnConnect.addEventListener('click', async () => {
      if (state.connected) {
        if (state.bleDevice && state.bleDevice.gatt.connected) {
          state.bleDevice.gatt.disconnect();
        }
        state.connected = false;
        statusDot.classList.remove('online');
        btnText.innerText = 'Connect';
        return;
      }

      try {
        btnText.innerText = 'Searching...';
        state.bleDevice = await navigator.bluetooth.requestDevice({
          acceptAllDevices: true,
          optionalServices: ['battery_service', 0xFFE0]
        });

        const server = await state.bleDevice.gatt.connect();
        state.connected = true;
        statusDot.classList.add('online');
        btnText.innerText = 'Connected';

        state.bleDevice.addEventListener('gattserverdisconnected', () => {
          state.connected = false;
          statusDot.classList.remove('online');
          btnText.innerText = 'Connect';
        });

      } catch (err) {
        console.warn('Bluetooth connection cancelled or failed:', err);
        btnText.innerText = 'Connect';
      }
    });
  }

  // Симуляція даних (Demo Mode, якщо BLE не підключено)
  function startDemoSimulation() {
    setInterval(() => {
      if (!state.connected) {
        // Генеруємо плавну зміну показників
        state.telemetry.speed = Math.max(0, Math.min(180, state.telemetry.speed + (Math.random() * 6 - 3)));
        state.telemetry.rpm = state.telemetry.speed * 45 + (Math.random() * 200);
        state.telemetry.tps = Math.max(0, Math.min(100, state.telemetry.speed / 1.8 + (Math.random() * 10 - 5)));
        state.telemetry.engineTemp = 105 + Math.sin(Date.now() / 5000) * 8;
        state.telemetry.volt = 12.6 + Math.random() * 0.4;

        // Оновлюємо масиви історії
        state.history.tps.push(state.telemetry.tps); state.history.tps.shift();
        state.history.air.push(state.telemetry.airTemp); state.history.air.shift();
        state.history.rpm.push(state.telemetry.rpm); state.history.rpm.shift();

        updateUI();
      }
    }, 200);
  }

  // Старт при завантаженні сторінки
  window.addEventListener('DOMContentLoaded', () => {
    initMap();
    setupBleUI();
    startDemoSimulation();
  });
</script>
</body>
</html>
