<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>MotoNav Dual HUD - Map Test Phase</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root {
  --bg-panel: rgba(18, 18, 22, 0.94);
  --border-line: rgba(255, 255, 255, 0.15);
  --cyan: #37e0e6;
  --amber: #ffb74d;
  --red: #ff4d4d;
  --green: #4caf50;
  --text: #ffffff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

/* 1. КОНТЕЙНЕР КАРТИ ТА РЕЖИМ МІНІКАРТИ (2x2) */
#mapContainer {
  position: fixed;
  inset: 0;
  z-index: 1;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

#mapContainer.minimap-mode {
  top: auto;
  left: 16px;
  bottom: max(80px, env(safe-area-inset-bottom));
  right: auto;
  width: 160px;
  height: 160px;
  border-radius: 20px;
  border: 2px solid var(--cyan);
  box-shadow: 0 10px 30px rgba(0,0,0,0.8);
  overflow: hidden;
  z-index: 2200;
}

#map { width: 100%; height: 100%; background: #111; }

/* ВЕРХНЯ ЗОНА МЕРЕЖІ ПАНЕЛЕЙ (ДВІ КАРТКИ) */
#hudHeader {
  position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 2000;
  display: flex; justify-content: space-between; align-items: center; pointer-events: none;
}

.hud-card {
  pointer-events: auto;
  background: var(--bg-panel); border: 1px solid var(--border-line); border-radius: 18px;
  padding: 8px 16px; backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6); display: flex; align-items: center;
}

/* 1. ЛІВА КАРТКА: НАВІГАЦІЯ */
.hud-nav-card { gap: 12px; }

.turn-arrow-svg {
  width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  transition: transform 0.3s ease;
}
.turn-arrow-svg svg {
  width: 100%; height: 100%; fill: none; stroke: var(--cyan); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 0 6px rgba(55, 224, 230, 0.5));
}

.turn-dist { font-size: 30px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; white-space: nowrap; }

/* 2. ПРАВА КАРТКА: ТЕЛЕМЕТРІЯ */
.hud-telemetry-card { gap: 16px; padding: 6px 16px; }

.telemetry-block { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.telemetry-label { font-size: 10px; font-weight: 800; color: #888; text-transform: uppercase; margin-bottom: -2px; }
.telemetry-val { font-size: 30px; font-weight: 900; line-height: 1.1; }
.val-speed { color: var(--amber); }
.val-temp { color: var(--green); transition: color 0.3s; }
.val-temp.cold { color: var(--cyan); }
.val-temp.norm { color: var(--green); }
.val-temp.warn { color: var(--amber); }
.val-temp.crit { color: var(--red); animation: blink 0.6s infinite alternate; }

@keyframes blink { from { opacity: 1; } to { opacity: 0.3; } }

/* БУЛЬБАШКИ УПРАВЛІННЯ (СПРАВА ВНИЗУ) */
.floating-controls {
  position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: 16px; z-index: 2500;
  display: flex; flex-direction: column; gap: 10px;
}
.circle-btn {
  width: 46px; height: 46px; border-radius: 50%; background: var(--bg-panel);
  border: 1px solid var(--border-line); color: #fff; font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px); transition: all 0.2s;
}
.circle-btn:active { transform: scale(0.92); }
.circle-btn.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(55,224,230,0.4); }

/* СПЛИВАЮЧЕ МЕНЮ МАРШРУТУ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-card {
  width: 90%; max-width: 480px; background: #141418; border: 1px solid var(--border-line);
  border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto;
}

.plate-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #000; padding: 4px; border-radius: 12px; }
.plate-btn { padding: 8px 4px; border-radius: 8px; border: none; background: transparent; color: #888; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
.plate-btn.active { background: #22222a; color: #fff; border: 1px solid var(--border-line); }
.plate-btn.yellow-plate.active { border-color: var(--amber); color: var(--amber); }

.route-actions-grid { display: flex; flex-direction: column; gap: 8px; }
.btn-route-option {
  width: 100%; padding: 12px 14px; border-radius: 10px; background: #22222a;
  border: 1px solid var(--border-line); color: #fff; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
  transition: background 0.2s, border-color 0.2s;
}
.btn-route-option:active { background: #2a2a35; }
.btn-route-option.accent { border-color: var(--cyan); color: var(--cyan); }
.btn-route-option.save { border-color: var(--green); color: var(--green); }

.toggles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; }
.toggle-item { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.03); padding: 6px 8px; border-radius: 8px; }
.toggle-item input { accent-color: var(--cyan); }

.modal-actions { display: flex; gap: 10px; }
.btn-action { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; }
.btn-start { background: var(--green); color: #fff; }
.btn-stop { background: rgba(255, 77, 77, 0.15); color: var(--red); border: 1px solid var(--red); }

/* ТОСТ-СПОБІЩЕННЯ */
.toast-msg {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); border: 1px solid var(--border-line); color: #fff;
  padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 4000;
  pointer-events: none; opacity: 0; transition: opacity 0.25s ease; white-space: nowrap;
}
.toast-msg.show { opacity: 1; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>

<div id="mapContainer">
  <div id="map"></div>
</div>

<!-- ДВІ ОКРЕМІ КАРТКИ ЗВЕРХУ -->
<div id="hudHeader">
  
  <!-- 1. ЛІВА КАРТКА: Навігація з динамічною стрілкою -->
  <div class="hud-card hud-nav-card">
    <div class="turn-arrow-svg" id="hudArrow">
      <svg viewBox="0 0 24 24" id="arrowSvg">
        <path d="M 12 20 L 12 4 M 7 9 L 12 4 L 17 9"/>
      </svg>
    </div>
    <div class="turn-dist" id="hudDistance">---</div>
  </div>
  
  <!-- 2. ПРАВА КАРТКА: Телеметрія -->
  <div class="hud-card hud-telemetry-card">
    <div class="telemetry-block" onclick="testBeepSound()">
      <span class="telemetry-label">км/год</span>
      <span class="telemetry-val val-speed" id="speedVal">0</span>
    </div>
    <div class="telemetry-block" onclick="cycleEngineTempSim()">
      <span class="telemetry-label">двигун</span>
      <span class="telemetry-val val-temp norm" id="tempContainer"><span id="engineTempVal">85</span><small style="font-size:14px;">°C</small></span>
    </div>
  </div>

</div>

<!-- БУЛЬБАШКИ УПРАВЛІННЯ -->
<div class="floating-controls">
  <button class="circle-btn" id="btnSound" onclick="toggleSound()">🔇</button>
  <button class="circle-btn" id="btnMinimap" onclick="toggleMinimapMode()" title="Мінікарта">🖥️</button>
  <button class="circle-btn active" id="btnCenter" onclick="reCenterMap()">🎯</button>
  <button class="circle-btn" onclick="openRouteModal()">🗺️</button>
</div>

<!-- МЕНЮ "МАРШРУТ" -->
<div id="routeModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
  <div class="modal-card">
    <div class="plate-selector">
      <button class="plate-btn white-plate active" id="btnWhitePlate" onclick="selectPlate('white')">
        🛵 50–250 cc (Білі)
      </button>
      <button class="plate-btn yellow-plate" id="btnYellowPlate" onclick="selectPlate('yellow')">
        🏍️ 250+ cc (Жовті/Червоні)
      </button>
    </div>

    <div class="route-actions-grid">
      <button class="btn-route-option accent" onclick="pasteRouteFromClipboard()">
        📋 Вставити з буфера
      </button>

      <button class="btn-route-option" onclick="document.getElementById('gpxFileInput').click()">
        📁 Завантажити GPX
      </button>
      <input type="file" id="gpxFileInput" accept=".gpx" style="display:none;" onchange="handleGpxUpload(this)">

      <button class="btn-route-option save" id="btnSaveGpx" style="display:none;" onclick="exportRouteToGpx()">
        💾 Зберегти у Файли (GPX)
      </button>
    </div>

    <div class="toggles-grid">
      <label class="toggle-item"><input type="checkbox" id="avoidTolls" checked> Без платних</label>
      <label class="toggle-item"><input type="checkbox" id="avoidHighways"> Без швидкісних</label>
      <label class="toggle-item"><input type="checkbox" id="avoidFerries" checked> Без переправ</label>
    </div>

    <div class="modal-actions">
      <button class="btn-action btn-stop" onclick="stopNavigation()">❌ Скинути</button>
      <button class="btn-action btn-start" onclick="startNavigation()">▶️ ПОЧАТИ</button>
    </div>
  </div>
</div>

<div class="toast-msg" id="toastMsg"></div>

<script>
let map;
let userMarker = null;
let autoTracking = true;
let isSoundOn = false;
let isMinimap = false;
let userCoords = [50.4501, 30.5234]; // Київ за замовчуванням

let activeRoutePolyline = null;
let reroutePolyline = null;
let activeRouteCoords = [];
let routeManeuvers = [];
let isOffRoute = false;
const OFF_ROUTE_THRESHOLD_METERS = 45;

/* ПАРАМЕТРИ ДВИГУНА ТА ТЕМПЕРАТУРИ */
let T_Eng = 85;
const T_COLD = 64;
const T_WARN = 90;
const T_CRIT = 96;

/* АУДІО КОНТЕКСТ (AudioContext) ДЛЯ ЗВУКІВ */
let audioCtx = null;

function getAudioContext() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

function playAlarmSound() {
  if (!isSoundOn) return;
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(880, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(440, ctx.currentTime + 0.3);
    
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start();
    osc.stop(ctx.currentTime + 0.3);
  } catch (e) { console.warn(e); }
}

function playBeepSound(freq = 1000, duration = 0.15) {
  if (!isSoundOn) return;
  try {
    const ctx = getAudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
    
    osc.connect(gain);
    gain.connect(ctx.destination);
    
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) { console.warn(e); }
}

function testBeepSound() {
  playBeepSound(1200, 0.1);
}

/* ІНІЦІАЛІЗАЦИЯ ОФЛАЙН-КЕШУВАННЯ ТАЙЛІВ КАРТИ (INDEXEDDB) */
function initOfflineTileLayer() {
  const TileLayerOffline = L.TileLayer.extend({
    createTile: function(coords, done) {
      const tile = document.createElement('img');
      const url = this.getTileUrl(coords);
      const key = `tile_${coords.z}_${coords.x}_${coords.y}`;

      // Спроба отримати з локальної бази IndexedDB / Cache Storage
      getStoredTile(key).then(cachedUrl => {
        if (cachedUrl) {
          tile.src = cachedUrl;
          done(null, tile);
        } else {
          tile.crossOrigin = 'Anonymous';
          tile.src = url;
          tile.onload = function() {
            saveTileToCache(key, tile);
            done(null, tile);
          };
          tile.onerror = function() {
            done(null, tile);
          };
        }
      }).catch(() => {
        tile.src = url;
        done(null, tile);
      });

      return tile;
    }
  });

  return new TileLayerOffline('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    subdomains: 'abcd'
  });
}

// Просте IndexedDB кешування
let dbPromise = null;
function getDB() {
  if (!dbPromise) {
    dbPromise = new Promise((resolve, reject) => {
      const req = indexedDB.open("OfflineMapTiles", 1);
      req.onupgradeneeded = () => req.result.createObjectStore("tiles");
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }
  return dbPromise;
}

async function getStoredTile(key) {
  try {
    const db = await getDB();
    return new Promise((resolve) => {
      const tx = db.transaction("tiles", "readonly");
      const req = tx.objectStore("tiles").get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) { return null; }
}

async function saveTileToCache(key, imgEl) {
  try {
    const canvas = document.createElement('canvas');
    canvas.width = imgEl.naturalWidth || 256;
    canvas.height = imgEl.naturalHeight || 256;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(imgEl, 0, 0);
    const dataUrl = canvas.toDataURL('image/png');

    const db = await getDB();
    const tx = db.transaction("tiles", "readwrite");
    tx.objectStore("tiles").put(dataUrl, key);
  } catch (e) {}
}

/* ІНІЦІАЛІЗАЦІЯ КАРТИ */
function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(userCoords, 16);

  // Підключаємо карту з кешуванням
  initOfflineTileLayer().addTo(map);

  userMarker = L.circleMarker(userCoords, { radius: 9, fillColor: '#2B80FF', color: '#ffffff', weight: 3, fillOpacity: 1 }).addTo(map);

  map.on('dragstart zoomstart', function() {
    if (autoTracking) {
      autoTracking = false;
      document.getElementById('btnCenter').classList.remove('active');
    }
  });

  // Triple Tap (потрійній клік) для перемикання мінікарти
  let clickCount = 0;
  let clickTimer = null;
  map.on('click', function() {
    clickCount++;
    if (clickCount === 1) {
      clickTimer = setTimeout(() => { clickCount = 0; }, 400);
    } else if (clickCount === 3) {
      clearTimeout(clickTimer);
      clickCount = 0;
      toggleMinimapMode();
    }
  });

  startGpsTracking();
  updateEngineTemp(T_Eng);
}

/* ПЕРЕМИКАННЯ МІНІКАРТИ (2x2) */
function toggleMinimapMode() {
  isMinimap = !isMinimap;
  const container = document.getElementById('mapContainer');
  const btn = document.getElementById('btnMinimap');

  if (isMinimap) {
    container.classList.add('minimap-mode');
    btn.classList.add('active');
    showToast('Режим мінікарти');
  } else {
    container.classList.remove('minimap-mode');
    btn.classList.remove('active');
    showToast('Повнореальний режим');
  }

  setTimeout(() => { map.invalidateSize(); }, 350);
}

function startGpsTracking() {
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
      (pos) => {
        userCoords = [pos.coords.latitude, pos.coords.longitude];
        userMarker.setLatLng(userCoords);

        const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        document.getElementById('speedVal').innerText = speed;

        if (speed > 80) {
          playBeepSound(1500, 0.05); // Звуковий сигнал швидкості
        }

        if (autoTracking) {
          map.setView(userCoords, map.getZoom() > 15 ? map.getZoom() : 16, { animate: true });
        }

        processNavigationStep();
      },
      (err) => console.warn(err),
      { enableHighAccuracy: true }
    );
  }
}

/* ЛОГІКА ДВИГУНА ТА ТЕМПЕРАТУРИ */
function updateEngineTemp(temp) {
  T_Eng = temp;
  const tempValEl = document.getElementById('engineTempVal');
  const containerEl = document.getElementById('tempContainer');
  
  tempValEl.innerText = T_Eng;
  containerEl.className = "telemetry-val val-temp";

  if (T_Eng < T_COLD) {
    containerEl.classList.add('cold');
  } else if (T_Eng >= T_COLD && T_Eng < T_WARN) {
    containerEl.classList.add('norm');
  } else if (T_Eng >= T_WARN && T_Eng < T_CRIT) {
    containerEl.classList.add('warn');
    playBeepSound(600, 0.2);
  } else if (T_Eng >= T_CRIT) {
    containerEl.classList.add('crit');
    playAlarmSound();
    showToast('⚠️ ПЕРЕГРІВ ДВИГУНА!');
  }
}

// Симулятор температури при кліку
function cycleEngineTempSim() {
  if (T_Eng === 85) updateEngineTemp(55);
  else if (T_Eng === 55) updateEngineTemp(91);
  else if (T_Eng === 91) updateEngineTemp(98);
  else updateEngineTemp(85);
}

/* СИНТЕЗ МОВЛЕННЯ */
function speak(text) {
  if (!isSoundOn || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'uk-UA';
  utterance.rate = 1.0;
  utterance.pitch = 1.0;
  window.speechSynthesis.speak(utterance);
}

/* АНАЛІЗАТОР GPX */
function generateManeuversFromGpx(coords) {
  routeManeuvers = [];
  if (coords.length < 3) return;

  for (let i = 1; i < coords.length - 1; i++) {
    let p1 = coords[i - 1];
    let p2 = coords[i];
    let p3 = coords[i + 1];

    let b1 = calculateBearing(p1, p2);
    let b2 = calculateBearing(p2, p3);

    let angle = b2 - b1;
    if (angle > 180) angle -= 360;
    if (angle < -180) angle += 360;

    let type = null;
    let text = "";

    if (angle >= 35 && angle < 115) {
      type = "RIGHT"; text = "Поверніть праворуч";
    } else if (angle <= -35 && angle > -115) {
      type = "LEFT"; text = "Поверніть ліворуч";
    } else if (Math.abs(angle) >= 115) {
      type = "UTURN"; text = "Зробіть розворот";
    }

    if (type) {
      routeManeuvers.push({
        coords: p2,
        type: type,
        text: text,
        announced150m: false,
        announced30m: false
      });
    }
  }
}

function calculateBearing(p1, p2) {
  let lat1 = p1[0] * Math.PI / 180;
  let lat2 = p2[0] * Math.PI / 180;
  let dLon = (p2[1] - p1[1]) * Math.PI / 180;

  let y = Math.sin(dLon) * Math.cos(lat2);
  let x = Math.cos(lat1) * Math.sin(lat2) - Math.sin(lat1) * Math.cos(lat2) * Math.cos(dLon);
  let brng = Math.atan2(y, x) * 180 / Math.PI;
  return (brng + 360) % 360;
}

function processNavigationStep() {
  if (activeRouteCoords.length === 0) return;

  let minDistance = Infinity;
  let closestIndex = -1;

  for (let i = 0; i < activeRouteCoords.length; i++) {
    let d = getDistanceMeters(userCoords, activeRouteCoords[i]);
    if (d < minDistance) {
      minDistance = d;
      closestIndex = i;
    }
  }

  if (minDistance > OFF_ROUTE_THRESHOLD_METERS) {
    if (!isOffRoute) {
      isOffRoute = true;
      speak("Відхилення від маршруту");
      showToast('⚠️ Відхилення від маршруту!');
    }
    return;
  } else {
    if (isOffRoute) {
      isOffRoute = false;
      speak("Ви повернулися на маршрут");
      showToast('✅ На маршруті');
    }
  }

  let nextManeuver = null;
  let distToManeuver = Infinity;

  for (let m of routeManeuvers) {
    let d = getDistanceMeters(userCoords, m.coords);
    if (d < distToManeuver) {
      distToManeuver = d;
      nextManeuver = m;
    }
  }

  if (nextManeuver) {
    updateHudNavigation(nextManeuver.type, distToManeuver);

    if (distToManeuver <= 150 && distToManeuver > 40 && !nextManeuver.announced150m) {
      speak(`Через сто п'ятдесят метрів ${nextManeuver.text.toLowerCase()}`);
      nextManeuver.announced150m = true;
    }
    if (distToManeuver <= 35 && !nextManeuver.announced30m) {
      speak(nextManeuver.text);
      nextManeuver.announced30m = true;
    }
  } else {
    updateHudNavigation("STRAIGHT", 0);
  }
}

function updateHudNavigation(type, distanceMeters) {
  const distEl = document.getElementById('hudDistance');
  const svgEl = document.getElementById('arrowSvg');

  distEl.innerText = distanceMeters > 0 ? (distanceMeters > 999 ? (distanceMeters/1000).toFixed(1) + " км" : Math.round(distanceMeters) + " м") : "---";

  let pathData = "M 12 20 L 12 4 M 7 9 L 12 4 L 17 9";

  if (type === "RIGHT") {
    pathData = "M 6 19 L 6 9 C 6 6 8 4 11 4 L 17 4 M 13 8 L 18 4 L 13 0";
  } else if (type === "LEFT") {
    pathData = "M 18 19 L 18 9 C 18 6 16 4 13 4 L 7 4 M 11 8 L 6 4 L 11 0";
  } else if (type === "UTURN") {
    pathData = "M 7 19 L 7 9 C 7 4 17 4 17 9 L 17 19 M 12 14 L 17 19 L 22 14";
  }

  svgEl.innerHTML = `<path d="${pathData}" transform="translate(0, 2)"/>`;
}

function getDistanceMeters(coord1, coord2) {
  const R = 6371000;
  const dLat = (coord2[0] - coord1[0]) * Math.PI / 180;
  const dLon = (coord2[1] - coord1[1]) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(coord1[0] * Math.PI / 180) * Math.cos(coord2[0] * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  return R * c;
}

function reCenterMap() {
  autoTracking = true;
  document.getElementById('btnCenter').classList.add('active');
  map.setView(userCoords, 16, { animate: true });
}

function toggleSound() {
  isSoundOn = !isSoundOn;
  getAudioContext(); // Активація AudioContext за кліком
  const btn = document.getElementById('btnSound');
  btn.innerText = isSoundOn ? "🔊" : "🔇";
  btn.classList.toggle('active', isSoundOn);

  if (isSoundOn) {
    speak("Голосову навігацію увімкнено");
    playBeepSound(800, 0.1);
  }
}

function openRouteModal() { document.getElementById('routeModal').classList.add('open'); }
function closeRouteModal() { document.getElementById('routeModal').classList.remove('open'); }
function closeModalOnBackdrop(e) { if (e.target.id === 'routeModal') closeRouteModal(); }

function selectPlate(type) {
  document.getElementById('btnWhitePlate').classList.toggle('active', type === 'white');
  document.getElementById('btnYellowPlate').classList.toggle('active', type === 'yellow');
  document.getElementById('avoidHighways').checked = (type === 'white');
}

async function pasteRouteFromClipboard() {
  try {
    const text = await navigator.clipboard.readText();
    if (!text || !text.trim()) { showToast('Буфер порожній'); return; }
    parseRouteFromUrl(text.trim());
  } catch (err) {
    showToast('Надайте дозвіл на читання буфера');
  }
}

function parseRouteFromUrl(text) {
  let points = [];
  const mapRegex = /@(-?\d+\.\d+),(-?\d+\.\d+)/g;
  let matches = [...text.matchAll(mapRegex)];

  if (matches.length > 0) {
    points = matches.map(m => [parseFloat(m[1]), parseFloat(m[2])]);
  } else {
    const simpleCoords = text.match(/(-?\d+\.\d+)\s*,\s*(-?\d+\.\d+)/g);
    if (simpleCoords) {
      points = simpleCoords.map(item => {
        const p = item.split(',');
        return [parseFloat(p[0]), parseFloat(p[1])];
      });
    }
  }

  if (points.length === 0) { showToast('Координати не знайдено'); return; }
  if (points.length === 1) { points.unshift(userCoords); }

  drawRouteOnMap(points);
  showToast(`Маршрут завантажено (${points.length} точок)`);
}

function handleGpxUpload(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const xml = new DOMParser().parseFromString(e.target.result, "text/xml");
    const pts = xml.querySelectorAll("trkpt, rtept");
    let coords = [];

    pts.forEach(pt => {
      const lat = parseFloat(pt.getAttribute("lat"));
      const lon = parseFloat(pt.getAttribute("lon"));
      if (!isNaN(lat) && !isNaN(lon)) coords.push([lat, lon]);
    });

    if (coords.length > 0) {
      drawRouteOnMap(coords);
      showToast(`Завантажено GPX (${coords.length} точок)`);
    } else {
      showToast('Помилка: файл GPX порожній');
    }
  };
  reader.readAsText(file);
}

function drawRouteOnMap(coords) {
  clearActiveRoute();
  activeRouteCoords = coords;

  generateManeuversFromGpx(coords);

  activeRoutePolyline = L.polyline(coords, {
    color: '#37e0e6',
    weight: 6,
    opacity: 0.9
  }).addTo(map);

  autoTracking = false;
  document.getElementById('btnCenter').classList.remove('active');
  map.fitBounds(activeRoutePolyline.getBounds(), { padding: [40, 40] });

  document.getElementById('btnSaveGpx').style.display = 'flex';
}

async function exportRouteToGpx() {
  if (activeRouteCoords.length === 0) return;

  let gpxHeader = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="MotoNav" xmlns="http://www.topografix.com/GPX/1/1">
  <trk>
    <name>MotoRoute_${Date.now()}</name>
    <trkseg>\n`;

  let gpxBody = activeRouteCoords.map(pt => `      <trkpt lat="${pt[0]}" lon="${pt[1]}"></trkpt>`).join('\n');
  let gpxFooter = `\n    </trkseg>\n  </trk>\n</gpx>`;
  const gpxContent = gpxHeader + gpxBody + gpxFooter;

  const fileName = `route_${Date.now()}.gpx`;
  const blob = new Blob([gpxContent], { type: 'application/gpx+xml' });
  const file = new File([blob], fileName, { type: 'application/gpx+xml' });

  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'Маршрут GPX' });
      showToast('Збережено!');
      return;
    } catch (err) {
      if (err.name !== 'AbortError') showToast('Скасовано');
      return;
    }
  }

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = fileName;
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('GPX збережено!');
}

function clearActiveRoute() {
  if (activeRoutePolyline) {
    map.removeLayer(activeRoutePolyline);
    activeRoutePolyline = null;
  }
  activeRouteCoords = [];
  routeManeuvers = [];
  isOffRoute = false;
  updateHudNavigation("STRAIGHT", 0);
  document.getElementById('btnSaveGpx').style.display = 'none';
  document.getElementById('gpxFileInput').value = '';
}

function startNavigation() {
  if (activeRouteCoords.length > 0) {
    reCenterMap();
    if (!isSoundOn) toggleSound();
  }
  closeRouteModal();
}

function stopNavigation() {
  clearActiveRoute();
  closeRouteModal();
  showToast('Маршрут скинуто');
}

function showToast(msg) {
  const el = document.getElementById('toastMsg');
  el.innerText = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2200);
}

window.onload = initMap;
</script>
