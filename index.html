<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>vRacer Dash Pro - Cut & Re-route GPX</title>
<style>
:root {
  --bg: #000000; --panel: #0d0d0f; --line: rgba(255,255,255,0.12);
  --text: #f2f2f0; --muted: #888; --cyan: #37e0e6; --amber: #ffb74d; --green: #4caf50; --red: #ff4d4d;
  --purple: #a855f7;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

#map { position: fixed; inset: 0; z-index: 1; background-color: #f2efe9; }
.leaflet-tile-pane { filter: contrast(115%) brightness(96%) saturate(85%) hue-rotate(-5deg); }

/* ПАНЕЛЬ ВИБОРУ СЕРВІСУ */
#engineSelectorBar {
  position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%;
  transform: translateX(-50%); z-index: 2500; background: rgba(20, 20, 25, 0.95);
  border: 1px solid var(--purple); border-radius: 20px; padding: 4px 10px;
  display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 15px rgba(168, 85, 247, 0.3);
  backdrop-filter: blur(10px);
}
#engineSelectorBar label { font-size: 11px; font-weight: bold; color: var(--purple); text-transform: uppercase; }
#engineSelect { background: #000; color: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 4px 8px; font-size: 12px; outline: none; font-weight: bold; }

/* HUD ПАНЕЛЬ */
#hudPanel {
  position: fixed; top: calc(max(12px, env(safe-area-inset-top)) + 40px); left: 10px; right: 10px; z-index: 2000;
  background: rgba(13, 13, 15, 0.92); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px; display: none; justify-content: space-between; align-items: center; backdrop-filter: blur(8px);
}
.hud-instruction { font-size: 15px; font-weight: bold; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
.hud-speed { text-align: right; font-size: 11px; color: var(--muted); }
.hud-speed-val { font-size: 18px; font-weight: bold; color: var(--amber); }

/* ПАНЕЛЬ МАРШРУТУ */
#navOverlay {
  position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 10px; right: 10px; z-index: 2000;
  background: rgba(13, 13, 15, 0.94); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 8px;
  max-height: 65vh; overflow-y: auto; transition: transform 0.3s ease, opacity 0.3s ease;
}
#navOverlay.hidden { transform: translateY(120%); opacity: 0; pointer-events: none; }

.filters-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; border: 1px solid var(--line);
}
.filter-item { font-size: 11px; color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.filter-item input { accent-color: var(--cyan); }

.cut-box {
  background: rgba(255, 183, 77, 0.08); border: 1px solid var(--amber);
  border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px;
}
.cut-title { font-size: 11px; font-weight: bold; color: var(--amber); display: flex; justify-content: space-between; }

.input-group { display: flex; flex-direction: column; gap: 6px; }
.input-row { display: flex; gap: 6px; align-items: center; }
.input-label { font-size: 11px; color: var(--muted); width: 75px; font-weight: bold; }
input[type="text"], select {
  flex: 1; background: #000; border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; color: #fff; font-size: 13px; outline: none;
}
.icon-btn {
  background: #1a1a1e; color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; width: 34px; height: 34px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; font-weight: bold; flex-shrink: 0;
}
.icon-btn.danger { color: var(--red); border-color: rgba(255,77,77,0.3); }

button.action-btn { background: var(--cyan); color: #000; border: none; border-radius: 6px; padding: 10px 14px; font-weight: bold; font-size: 13px; cursor: pointer; }
button.close-panel-btn { background: #222; color: #fff; border: 1px solid var(--line); border-radius: 6px; padding: 10px 14px; font-weight: bold; font-size: 13px; cursor: pointer; }
button.go-btn {
  background: var(--green); color: #fff; border: none; border-radius: 6px;
  padding: 12px 14px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 4px;
  display: none; box-shadow: 0 0 10px rgba(76,175,80,0.4);
}

.bottom-controls {
  position: fixed; bottom: max(15px, env(safe-area-inset-bottom)); right: 15px; z-index: 3000;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px; transition: transform 0.3s ease;
}

.floating-btn {
  border: none; border-radius: 25px; padding: 12px 18px; font-weight: bold; font-size: 13px;
  cursor: pointer; color: #fff; backdrop-filter: blur(6px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.icon-float-btn {
  width: 44px; height: 44px; border-radius: 50%; background: rgba(13, 13, 15, 0.9);
  border: 1px solid var(--line); color: #fff; font-size: 18px; display: flex;
  align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.icon-float-btn.active-tracking { border-color: var(--cyan); color: var(--cyan); }
.icon-float-btn.active-sound { border-color: var(--green); color: var(--green); }

#toggleMenuBtn { background: #1a1a1e; border: 1px solid var(--line); display: none; }
#stopNavBtn { background: var(--red); display: none; }

.popup-btn {
  display: block; width: 100%; margin: 4px 0; padding: 6px;
  background: #222; color: #fff; border: 1px solid var(--line);
  border-radius: 4px; font-size: 11px; cursor: pointer; text-align: center;
}
.popup-btn.primary { background: var(--cyan); color: #000; font-weight: bold; }
.popup-btn.amber { background: var(--amber); color: #000; font-weight: bold; }
.popup-btn.red { background: var(--red); color: #fff; font-weight: bold; }
</style>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>

<div id="engineSelectorBar">
  <label for="engineSelect">⚙️ Сервіс:</label>
  <select id="engineSelect" onchange="buildRoute()">
    <option value="valhalla">Valhalla Engine (Основний)</option>
    <option value="direct">OSRM (Пряма артерія 113)</option>
    <option value="osrm">OSRM (Стандарт)</option>
  </select>
</div>

<div id="hudPanel">
  <div class="hud-instruction" id="hudTurnInfo"><span>🧭</span> <span id="hudText">Прямо по маршруту</span></div>
  <div class="hud-speed">Швидкість: <span class="hud-speed-val" id="hudCurrentSpeed">0</span> км/год</div>
</div>

<div id="map"></div>

<div class="bottom-controls" id="bottomControls">
  <button class="icon-float-btn" id="voiceToggleBtn" onclick="toggleVoice()">🔇</button>
  <button class="icon-float-btn active-tracking" id="centerGpsBtn" onclick="toggleAutoTracking()">🎯</button>
  <button class="floating-btn" id="toggleMenuBtn" onclick="openNavMenu()">🗺️ Маршрут</button>
  <button class="floating-btn" id="stopNavBtn" onclick="stopActiveNavigation()">❌ Завершити</button>
</div>

<div id="navOverlay">
  <div class="filters-grid">
    <label class="filter-item"><input type="checkbox" id="avoidTolls" onchange="buildRoute()"> 🆓 Без платних доріг</label>
    <label class="filter-item"><input type="checkbox" id="shortestRoute" onchange="buildRoute()"> 📏 Найкоротший шлях</label>
    <label class="filter-item"><input type="checkbox" id="avoidUnpaved" onchange="buildRoute()"> 🛣️ Тільки асфальт</label>
    <label class="filter-item"><input type="checkbox" id="footMode" onchange="buildRoute()"> 🚶 Пішохідний режим</label>
    <label class="filter-item"><input type="checkbox" id="noHighways" onchange="buildRoute()"> 🏙️ Без шосе</label>
    <label class="filter-item"><input type="checkbox" id="bikeMode" onchange="buildRoute()"> 🚲 Мото / Скутер</label>
  </div>

  <!-- Блок Редагування/Обрізки GPX -->
  <div class="cut-box" id="cutBox" style="display:none;">
    <div class="cut-title">
      <span>✂️ Зміна ділянки GPX</span>
      <span style="cursor:pointer;" onclick="resetCutSelection()">Очистити ❌</span>
    </div>
    <div class="input-row">
      <span class="input-label">Точка Входу А:</span>
      <input type="text" id="cutStartInput" readonly placeholder="Клікніть на карті -> Точка А">
    </div>
    <div class="input-row">
      <span class="input-label">Точка Виходу Б:</span>
      <input type="text" id="cutEndInput" readonly placeholder="Клікніть на карті -> Точка Б">
    </div>
  </div>

  <div class="input-group" id="waypointsContainer">
    <div class="input-row">
      <span class="input-label">Звідки:</span>
      <input type="text" id="startInput" placeholder="Моє місцезнаходження (GPS)">
    </div>
    
    <div id="dynamicWaypoints"></div>

    <div class="input-row" id="destRow">
      <span class="input-label">Куди:</span>
      <input type="text" id="destInput" placeholder="Адреса / Назва / GPX / Клік">
      <button class="icon-btn danger" onclick="resetRoute()" title="Скинути">❌</button>
    </div>
  </div>

  <input type="file" id="gpxFileInput" accept=".gpx" style="display:none;" onchange="handleGpxUpload(event)">

  <div style="display: flex; gap: 6px; margin-top: 4px;">
    <button class="icon-btn" style="width: auto; padding: 0 10px; font-size: 11px; background: #2a2a30;" onclick="addWaypointInput()">+ Зупинка</button>
    <button class="icon-btn" style="width: auto; padding: 0 10px; font-size: 11px; background: #3b2a54; color: var(--purple); border-color: var(--purple);" onclick="document.getElementById('gpxFileInput').click()">📁 GPX</button>
    <button class="action-btn" style="flex: 1;" onclick="buildRoute()">Розрахувати 🔍</button>
    <button class="close-panel-btn" onclick="closeNavMenu()">✕</button>
  </div>

  <button class="go-btn" id="startDriveBtn" onclick="startDriveMode()">▶️ ПОЇХАЛИ</button>
  
  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-top: 2px;">
    <span>Дистанція:</span>
    <span id="distDisplay" style="color: var(--cyan); font-weight: bold; font-size: 13px;">-- км</span>
  </div>
</div>

<script>
let map, userMarker, routeLayer, gpxLayer, pinnedMarker;
let cutStartMarker, cutEndMarker;
let userCoords = [50.4501, 30.5234]; 
let customStartCoords = null;
let activeDestCoords = null;
let rawGpxPoints = []; 

let cutStartCoords = null;
let cutEndCoords = null;

let isDriveActive = false;
let autoTracking = true;

let routeManeuvers = []; 
let announcedManeuvers = new Set(); 

const VoiceGuidance = {
  synth: window.speechSynthesis, 
  enabled: false,
  toggle() {
    this.enabled = !this.enabled;
    const btn = document.getElementById('voiceToggleBtn');
    btn.innerText = this.enabled ? "🔊" : "🔇";
    btn.classList.toggle('active-sound', this.enabled);

    if (this.enabled) {
      this.speak("Звуковий супровід активовано");
    }
  },
  speak(text) {
    if (!this.synth || !this.enabled) return;
    this.synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'uk-UA';
    this.synth.speak(utterance);
  }
};
function toggleVoice() { VoiceGuidance.toggle(); }

function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(userCoords, 14);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

  userMarker = L.circleMarker(userCoords, { radius: 8, fillColor: '#2B80FF', color: '#ffffff', weight: 3, fillOpacity: 1 }).addTo(map);

  map.on('dragstart zoomstart', function() { disableAutoTracking(); });
  map.on('click', function(e) { if (!isDriveActive) setPinMarker(e.latlng.lat, e.latlng.lng); });

  adjustControlsPosition();
  startGpsTracking();
}

function disableAutoTracking() {
  if (autoTracking) {
    autoTracking = false;
    document.getElementById('centerGpsBtn').classList.remove('active-tracking');
  }
}

function toggleAutoTracking() {
  autoTracking = true;
  document.getElementById('centerGpsBtn').classList.add('active-tracking');
  map.setView(userCoords, map.getZoom() > 15 ? map.getZoom() : 16, { animate: true });
}

function startGpsTracking() {
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
      (pos) => {
        userCoords = [pos.coords.latitude, pos.coords.longitude];
        userMarker.setLatLng(userCoords);
        
        const speedKmH = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        document.getElementById('hudCurrentSpeed').innerText = speedKmH;

        if (autoTracking) {
          map.setView(userCoords, map.getZoom() > 15 ? map.getZoom() : 16);
        }

        if (isDriveActive) {
          checkRouteNavigation(userCoords);
        }
      },
      (err) => { console.warn("GPS Помилка: ", err.message); },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 1000 }
    );
  }
}

function getDistanceMeters(coord1, coord2) {
  const R = 6371e3;
  const rad1 = coord1[0] * Math.PI / 180;
  const rad2 = coord2[0] * Math.PI / 180;
  const dRad = (coord2[0] - coord1[0]) * Math.PI / 180;
  const dLon = (coord2[1] - coord1[1]) * Math.PI / 180;

  const a = Math.sin(dRad/2) * Math.sin(dRad/2) +
            Math.cos(rad1) * Math.cos(rad2) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function checkRouteNavigation(currentPos) {
  if (!routeManeuvers || routeManeuvers.length === 0) return;

  for (let i = 0; i < routeManeuvers.length; i++) {
    const maneuver = routeManeuvers[i];
    if (announcedManeuvers.has(i)) continue;

    const dist = getDistanceMeters(currentPos, maneuver.coords);

    if (dist <= 110 && dist >= 20) {
      announcedManeuvers.add(i);
      const text = `Через 100 метрів ${maneuver.instruction}`;
      document.getElementById('hudText').innerText = text;
      VoiceGuidance.speak(text);
      break;
    }
  }
}

function handleGpxUpload(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const xmlText = e.target.result;
    parseAndRenderGPX(xmlText, file.name);
  };
  reader.readAsText(file);
}

function parseAndRenderGPX(xmlText, filename) {
  const parser = new DOMParser();
  const xmlDoc = parser.parseFromString(xmlText, "text/xml");
  const trkpts = xmlDoc.querySelectorAll("trkpt, rtept");

  if (trkpts.length === 0) {
    alert("У файлі GPX не знайдено точок!");
    return;
  }

  rawGpxPoints = [];
  let totalDist = 0;

  trkpts.forEach((pt, idx) => {
    const lat = parseFloat(pt.getAttribute("lat"));
    const lon = parseFloat(pt.getAttribute("lon"));
    rawGpxPoints.push([lat, lon]);

    if (idx > 0) {
      totalDist += getDistanceMeters(rawGpxPoints[idx - 1], rawGpxPoints[idx]);
    }
  });

  if (routeLayer) map.removeLayer(routeLayer);
  if (gpxLayer) map.removeLayer(gpxLayer);

  gpxLayer = L.polyline(rawGpxPoints, { color: '#ec4899', weight: 6, opacity: 0.85 }).addTo(map);
  map.fitBounds(gpxLayer.getBounds(), { padding: [40, 40] });

  customStartCoords = rawGpxPoints[0];
  activeDestCoords = rawGpxPoints[rawGpxPoints.length - 1];

  document.getElementById('startInput').value = `${rawGpxPoints[0][0].toFixed(4)}, ${rawGpxPoints[0][1].toFixed(4)} (GPX Старт)`;
  document.getElementById('destInput').value = filename || "GPX Імпортовано";
  document.getElementById('destInput').dataset.lat = rawGpxPoints[rawGpxPoints.length - 1][0];
  document.getElementById('destInput').dataset.lng = rawGpxPoints[rawGpxPoints.length - 1][1];

  document.getElementById('cutBox').style.display = 'flex';
  document.getElementById('distDisplay').innerText = `${(totalDist / 1000).toFixed(1)} км (GPX)`;
  document.getElementById('startDriveBtn').style.display = 'block';

  adjustControlsPosition();
}

function findClosestGpxPointIndex(coord) {
  if (!rawGpxPoints || rawGpxPoints.length === 0) return -1;
  let minDistance = Infinity;
  let closestIndex = -1;

  for (let i = 0; i < rawGpxPoints.length; i++) {
    const dist = getDistanceMeters(coord, rawGpxPoints[i]);
    if (dist < minDistance) {
      minDistance = dist;
      closestIndex = i;
    }
  }
  return closestIndex;
}

function adjustControlsPosition() {
  const overlay = document.getElementById('navOverlay');
  const controls = document.getElementById('bottomControls');
  controls.style.transform = !overlay.classList.contains('hidden') ? `translateY(-${overlay.offsetHeight + 8}px)` : `translateY(0px)`;
}

function setPinMarker(lat, lng) {
  if (pinnedMarker) map.removeLayer(pinnedMarker);
  
  let gpxButtons = '';
  if (rawGpxPoints.length > 0) {
    gpxButtons = `
      <button class="popup-btn amber" onclick="setAsCutStart(${lat}, ${lng})">✂️ Точка Входу А (З'їзд)</button>
      <button class="popup-btn amber" onclick="setAsCutEnd(${lat}, ${lng})">✂️ Точка Виходу Б (Повернення)</button>
    `;
  }

  const popupContent = `
    <div style="color:#000; font-size:12px; text-align:center;">
      <b>📌 Обрана точка</b><br>
      ${gpxButtons}
      <button class="popup-btn" onclick="addWaypointFromMap(${lat}, ${lng})">➕ Додати Зупинку між А і Б</button>
      <button class="popup-btn primary" onclick="setAsDest(${lat}, ${lng})">🏁 Зробити Фінішем</button>
    </div>
  `;
  pinnedMarker = L.marker([lat, lng]).addTo(map).bindPopup(popupContent).openPopup();
}

function setAsCutStart(lat, lng) {
  const closestIdx = findClosestGpxPointIndex([lat, lng]);
  cutStartCoords = rawGpxPoints[closestIdx];
  
  if (cutStartMarker) map.removeLayer(cutStartMarker);
  cutStartMarker = L.circleMarker(cutStartCoords, { radius: 7, fillColor: '#ffb74d', color: '#ffffff', weight: 2, fillOpacity: 1 }).addTo(map).bindPopup('🅰️ Точка З\'їзду А').openPopup();

  document.getElementById('cutStartInput').value = `Точка А [${cutStartCoords[0].toFixed(4)}, ${cutStartCoords[1].toFixed(4)}]`;
  map.closePopup();
  if (cutEndCoords) buildRoute();
}

function setAsCutEnd(lat, lng) {
  const closestIdx = findClosestGpxPointIndex([lat, lng]);
  cutEndCoords = rawGpxPoints[closestIdx];

  if (cutEndMarker) map.removeLayer(cutEndMarker);
  cutEndMarker = L.circleMarker(cutEndCoords, { radius: 7, fillColor: '#a855f7', color: '#ffffff', weight: 2, fillOpacity: 1 }).addTo(map).bindPopup('🅱️ Точка Повернення Б').openPopup();

  document.getElementById('cutEndInput').value = `Точка Б [${cutEndCoords[0].toFixed(4)}, ${cutEndCoords[1].toFixed(4)}]`;
  map.closePopup();
  if (cutStartCoords) buildRoute();
}

function resetCutSelection() {
  cutStartCoords = null;
  cutEndCoords = null;
  if (cutStartMarker) map.removeLayer(cutStartMarker);
  if (cutEndMarker) map.removeLayer(cutEndMarker);
  document.getElementById('cutStartInput').value = '';
  document.getElementById('cutEndInput').value = '';
  buildRoute();
}

function setAsDest(lat, lng) {
  activeDestCoords = [lat, lng];
  document.getElementById('destInput').value = `${lat.toFixed(4)}, ${lng.toFixed(4)} (Карта)`;
  document.getElementById('destInput').dataset.lat = lat;
  document.getElementById('destInput').dataset.lng = lng;
  map.closePopup();
  buildRoute();
}

function addWaypointInput(value = '', coords = null) {
  const container = document.getElementById('dynamicWaypoints');
  const row = document.createElement('div');
  row.className = 'input-row waypoint-row';
  const index = container.children.length + 1;
  row.style.marginTop = '4px';
  row.innerHTML = `
    <span class="input-label">Зупинка ${index}:</span>
    <input type="text" class="wp-input" placeholder="Проміжна точка" value="${value}">
    <button class="icon-btn danger" onclick="this.parentElement.remove(); adjustControlsPosition(); buildRoute();">✕</button>
  `;
  if (coords) row.querySelector('.wp-input').dataset.coords = JSON.stringify(coords);
  container.appendChild(row);
  adjustControlsPosition();
}

function addWaypointFromMap(lat, lng) {
  addWaypointInput(`${lat.toFixed(4)}, ${lng.toFixed(4)} (Карта)`, [lat, lng]);
  map.closePopup();
  buildRoute();
}

async function fetchRouteBetweenWaypoints(waypointsList) {
  const engine = document.getElementById('engineSelect').value;
  const avoidTolls = document.getElementById('avoidTolls').checked;
  const shortest = document.getElementById('shortestRoute').checked;
  const avoidUnpaved = document.getElementById('avoidUnpaved').checked;
  const footMode = document.getElementById('footMode').checked;
  const noHighways = document.getElementById('noHighways').checked;
  const bikeMode = document.getElementById('bikeMode').checked;

  let costing = 'auto';
  if (footMode) costing = 'pedestrian';
  else if (bikeMode) costing = 'motorcycle';

  let url;
  if (engine === 'valhalla') {
    const valhallaOptions = {
      locations: waypointsList.map(c => ({ lat: c[0], lon: c[1] })),
      costing: costing,
      costing_options: {
        [costing]: {
          use_tolls: avoidTolls ? 0.0 : 1.0,
          use_highways: noHighways ? 0.0 : 1.0,
          use_tracks: avoidUnpaved ? 0.0 : 1.0,
          shortest: shortest
        }
      }
    };
    url = `https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(valhallaOptions))}`;
  } else {
    const coordsStr = waypointsList.map(c => `${c[1]},${c[0]}`).join(';');
    url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson&steps=true`;
  }

  try {
    const res = await fetch(url);
    const data = await res.json();
    let coords = [];

    if (engine === 'valhalla' && data.trip) {
      const decoded = decodePolyline(data.trip.legs[0].shape);
      coords = decoded.coordinates.map(c => [c[1], c[0]]);
    } else if (data.routes && data.routes.length > 0) {
      coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
    }
    return coords.length > 0 ? coords : waypointsList;
  } catch(e) {
    console.error("Помилка отримання об'їзду:", e);
    return waypointsList;
  }
}

async function buildRoute() {
  let stopInputs = [];
  document.querySelectorAll('.wp-input').forEach(el => {
    if (el.dataset.coords) stopInputs.push(JSON.parse(el.dataset.coords));
  });

  // РЕЖИМ 1: ОБРІЗКА ТА ОБ'ЇЗД ДІЛЯНКИ ВІД А ДО Б У GPX
  if (rawGpxPoints.length > 0 && cutStartCoords && cutEndCoords) {
    let idxA = findClosestGpxPointIndex(cutStartCoords);
    let idxB = findClosestGpxPointIndex(cutEndCoords);

    if (idxA > idxB) {
      let temp = idxA; idxA = idxB; idxB = temp;
    }

    let combinedCoords = [];

    // 1. Початкова частина GPX (до точки A)
    combinedCoords.push(...rawGpxPoints.slice(0, idxA + 1));

    // 2. Новий маршрут об'їзду між A та B
    let bypassWaypoints = [rawGpxPoints[idxA], ...stopInputs, rawGpxPoints[idxB]];
    let bypassSegment = await fetchRouteBetweenWaypoints(bypassWaypoints);
    combinedCoords.push(...bypassSegment);

    // 3. Кінцева частина GPX (від точки B до кінця)
    combinedCoords.push(...rawGpxPoints.slice(idxB));

    if (gpxLayer) map.removeLayer(gpxLayer);
    if (routeLayer) map.removeLayer(routeLayer);

    routeLayer = L.polyline(combinedCoords, { color: '#a855f7', weight: 6 }).addTo(map);
    map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

    let totalDist = 0;
    for (let i = 1; i < combinedCoords.length; i++) {
      totalDist += getDistanceMeters(combinedCoords[i-1], combinedCoords[i]);
    }

    document.getElementById('distDisplay').innerText = `${(totalDist / 1000).toFixed(1)} км (Обрізано)`;
    document.getElementById('startDriveBtn').style.display = 'block';
    adjustControlsPosition();
    return;
  }

  // РЕЖИМ 2: Звичайне будівництво маршруту
  let start = userCoords;
  const startVal = document.getElementById('startInput').value;
  if (customStartCoords && (startVal.includes('(Карта)') || startVal.includes('(GPX Старт)'))) start = customStartCoords;

  let dest = activeDestCoords;
  const destInput = document.getElementById('destInput');
  if (destInput.dataset.lat && (destInput.value.includes('(Карта)') || destInput.value.includes('.gpx'))) {
    dest = [parseFloat(destInput.dataset.lat), parseFloat(destInput.dataset.lng)];
  }

  if (!dest) return;

  let waypoints = [start, ...stopInputs, dest];
  const coordsStr = waypoints.map(c => `${c[1]},${c[0]}`).join(';');
  const engine = document.getElementById('engineSelect').value;

  const avoidTolls = document.getElementById('avoidTolls').checked;
  const shortest = document.getElementById('shortestRoute').checked;
  const avoidUnpaved = document.getElementById('avoidUnpaved').checked;
  const footMode = document.getElementById('footMode').checked;
  const noHighways = document.getElementById('noHighways').checked;
  const bikeMode = document.getElementById('bikeMode').checked;

  let costing = 'auto';
  if (footMode) costing = 'pedestrian';
  else if (bikeMode) costing = 'motorcycle';

  let url;
  if (engine === 'valhalla') {
    const valhallaOptions = {
      locations: waypoints.map(c => ({ lat: c[0], lon: c[1] })),
      costing: costing,
      costing_options: {
        [costing]: {
          use_tolls: avoidTolls ? 0.0 : 1.0,
          use_highways: noHighways ? 0.0 : 1.0,
          use_tracks: avoidUnpaved ? 0.0 : 1.0,
          shortest: shortest
        }
      }
    };
    url = `https://valhalla1.openstreetmap.de/route?json=${encodeURIComponent(JSON.stringify(valhallaOptions))}`;
  } else if (engine === 'direct') {
    const radStr = waypoints.map(() => '1000').join(';');
    url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson&steps=true&radiuses=${radStr}&continue_straight=true`;
  } else {
    url = `https://router.project-osrm.org/route/v1/driving/${coordsStr}?overview=full&geometries=geojson&steps=true`;
  }

  try {
    const res = await fetch(url);
    const data = await res.json();
    
    let routeGeojson, routeDist;
    routeManeuvers = [];
    announcedManeuvers.clear();

    if (engine === 'valhalla' && data.trip) {
      routeDist = data.trip.summary.length * 1000;
      routeGeojson = { type: "Feature", geometry: decodePolyline(data.trip.legs[0].shape) };

      if (data.trip.legs[0].maneuvers) {
        const coordsList = routeGeojson.geometry.coordinates;
        data.trip.legs[0].maneuvers.forEach(m => {
          const point = coordsList[m.begin_shape_index];
          if (point) {
            routeManeuvers.push({
              coords: [point[1], point[0]],
              instruction: m.instruction || 'поверніть за маршрутом'
            });
          }
        });
      }
    } else if (data.routes && data.routes.length > 0) {
      routeDist = data.routes[0].distance;
      routeGeojson = data.routes[0].geometry;
      
      if (data.routes[0].legs[0].steps) {
        data.routes[0].legs[0].steps.forEach(step => {
          routeManeuvers.push({
            coords: [step.maneuver.location[1], step.maneuver.location[0]],
            instruction: `${step.maneuver.type} ${step.name || ''}`
          });
        });
      }
    }

    if (routeGeojson) {
      if (gpxLayer) map.removeLayer(gpxLayer);
      if (routeLayer) map.removeLayer(routeLayer);
      routeLayer = L.geoJSON(routeGeojson, { style: { color: '#a855f7', weight: 6 } }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

      document.getElementById('distDisplay').innerText = `${(routeDist / 1000).toFixed(1)} км`;
      document.getElementById('startDriveBtn').style.display = 'block';
      adjustControlsPosition();
    }
  } catch(e) { console.error('Помилка розрахунку', e); }
}

function decodePolyline(str, precision = 6) {
  let index = 0, lat = 0, lng = 0, coordinates = [], factor = Math.pow(10, precision);
  while (index < str.length) {
    let byte, shift = 0, result = 0;
    do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
    let deltaLat = ((result & 1) ? ~(result >> 1) : (result >> 1)); lat += deltaLat;
    shift = 0; result = 0;
    do { byte = str.charCodeAt(index++) - 63; result |= (byte & 0x1f) << shift; shift += 5; } while (byte >= 0x20);
    let deltaLng = ((result & 1) ? ~(result >> 1) : (result >> 1)); lng += deltaLng;
    coordinates.push([lng / factor, lat / factor]);
  }
  return { type: "LineString", coordinates: coordinates };
}

function resetRoute() {
  if (routeLayer) map.removeLayer(routeLayer);
  if (gpxLayer) map.removeLayer(gpxLayer);
  if (pinnedMarker) map.removeLayer(pinnedMarker);
  resetCutSelection();
  document.getElementById('cutBox').style.display = 'none';
  document.getElementById('dynamicWaypoints').innerHTML = '';
  document.getElementById('startInput').value = '';
  document.getElementById('destInput').value = '';
  document.getElementById('gpxFileInput').value = '';
  rawGpxPoints = [];
  customStartCoords = null; activeDestCoords = null;
  document.getElementById('distDisplay').innerText = '-- км';
  document.getElementById('startDriveBtn').style.display = 'none';
  adjustControlsPosition();
}

function closeNavMenu() {
  document.getElementById('navOverlay').classList.add('hidden');
  adjustControlsPosition();
  document.getElementById('toggleMenuBtn').style.display = isDriveActive ? 'none' : 'inline-block';
}

function openNavMenu() {
  document.getElementById('navOverlay').classList.remove('hidden');
  adjustControlsPosition();
  document.getElementById('toggleMenuBtn').style.display = 'none';
}

function startDriveMode() {
  isDriveActive = true;
  document.getElementById('hudPanel').style.display = 'flex';
  document.getElementById('stopNavBtn').style.display = 'inline-block';
  closeNavMenu();
  if (VoiceGuidance.enabled) {
    VoiceGuidance.speak("Маршрут прокладено. Розпочинаємо рух.");
  }
}

function stopActiveNavigation() {
  isDriveActive = false;
  document.getElementById('hudPanel').style.display = 'none';
  document.getElementById('stopNavBtn').style.display = 'none';
  openNavMenu();
}

window.onload = function() {
  initMap();
  window.addEventListener('resize', adjustControlsPosition);
};
</script>
