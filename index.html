<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Тест ХАК 2 (Без зуму)</title>
  
  <style>
    :root {
      --real-width: 100vw;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: var(--real-width) !important;
      max-width: 100% !important;
      overflow-x: hidden;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    header {
      background: #1e1e1e;
      padding: 15px;
      border-bottom: 2px solid #ff9800;
      text-align: center;
    }

    main {
      background: #2a2a2a;
      padding: 20px;
      margin: 15px;
      border-radius: 12px;
    }

    .info-box {
      background: #333;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 16px;
      color: #00e676;
    }

    footer {
      background: #1e1e1e;
      padding: 15px;
      border-top: 2px solid #2196f3;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h2>Тест ХАК 2 (Адаптивний)</h2>
    <p>Повертайте екран — зум більше не ламатиметься!</p>
  </header>

  <main>
    <h3>Параметри екрана:</h3>
    <div class="info-box">
      <p>Ширина вікна (innerWidth): <span id="winWidth">-</span>px</p>
      <p>Орієнтація: <span id="orient">-</span></p>
    </div>
  </main>

  <footer>
    <p>В альбомному — 844px, в портретному — звичайний розмір.</p>
  </footer>

  <script>
    function updateInfo() {
      var wEl = document.getElementById('winWidth');
      var oEl = document.getElementById('orient');
      if (wEl) wEl.textContent = window.innerWidth;
      if (oEl) oEl.textContent = (window.innerWidth > window.innerHeight) ? 'Альбомна' : 'Портретна';
    }

    (function initSmartWidthHack() {
      var maxLandscapeWidth = 0;

      function updateWidth() {
        var isLandscape = window.innerWidth > window.innerHeight;

        if (isLandscape) {
          /* В альбомному режимі ловимо 844px */
          if (window.innerWidth > 750 && window.innerWidth > maxLandscapeWidth) {
            maxLandscapeWidth = window.innerWidth;
          }
          
          if (maxLandscapeWidth > 0) {
            document.documentElement.style.setProperty('--real-width', maxLandscapeWidth + 'px');
          } else {
            document.documentElement.style.setProperty('--real-width', '100vw');
          }
        } else {
          /* В портретному режимі ЖОРСТКО повертаємо 100vw, щоб не було зуму */
          document.documentElement.style.setProperty('--real-width', '100vw');
        }

        updateInfo();
      }

      updateWidth();

      window.addEventListener('resize', updateWidth);
      window.addEventListener('scroll', updateWidth, { passive: true });
      window.addEventListener('touchmove', updateWidth, { passive: true });
      window.addEventListener('orientationchange', function() {
        setTimeout(updateWidth, 100);
        setTimeout(updateWidth, 300);
      });
    })();
  </script>
</body>
</html>
