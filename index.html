<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>V-Racer Dashboard - Authentic Reference UI</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    @font-face {
      font-family: 'Digital7';
      src: url('https://cdnjs.cloudflare.com/ajax/libs/dseg/0.46/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2') format('woff2');
    }

    :root {
      --bg-dark: #0a0d12;
      --panel-bg: #121620;
      --panel-border: #2c3648;
      --panel-border-glow: #3e4f6d;
      --text-main: #e0e6ed;
      --text-dim: #5c6b82;
      --accent-red: #ff2a4b;
      --accent-green: #00ff88;
      --accent-cyan: #00d9ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #05070a;
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .viewport-scaler {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Outermost Heavy Frame */
    .dashboard-frame {
      width: 1100px;
      height: 560px;
      background: linear-gradient(180deg, #181f2c 0%, #0c0f16 100%);
      border: 2px solid #3a475d;
      border-radius: 16px;
      padding: 12px;
      position: absolute;
      box-shadow: 0 0 40px rgba(0,0,0,0.9), inset 0 0 10px rgba(255,255,255,0.05);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-hdr {
      background: linear-gradient(180deg, #252e3e 0%, #171d27 100%);
      border: 1px solid #3d4a61;
      color: var(--text-main);
      padding: 3px 10px;
      border-radius: 4px;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .status-led {
      width: 7px;
      height: 7px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-green);
    }

    .net-title {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: 8px;
      letter-spacing: 1px;
    }

    /* Main Grid Section */
    .main-grid {
      display: grid;
      grid-template-columns: 310px 1fr 330px;
      gap: 10px;
      flex: 1;
    }

    /* Cyberpunk Panel Bevel Style */
    .panel {
      background: linear-gradient(145deg, #131722 0%, #0d1017 100%);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.6);
    }

    /* Left Panel */
    .panel-left {
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .panel-title {
      color: var(--text-dim);
      font-size: 15px;
      letter-spacing: 2px;
    }

    .engine-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 20px;
    }

    .engine-graphic {
      width: 125px;
      height: 125px;
      position: relative;
    }

    .sensor-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-red);
      animation: pulse 1.2s infinite alternate;
    }

    @keyframes pulse {
      from { transform: scale(0.8); opacity: 0.5; }
      to { transform: scale(1.3); opacity: 1; }
    }

    /* 7-Segment Digital LCD Number Display */
    .digital-lcd {
      font-family: 'Digital7', 'Orbitron', monospace;
      color: #ffffff;
      text-shadow: 0 0 12px rgba(255,255,255,0.6);
      letter-spacing: -2px;
    }

    .digital-val-large {
      font-size: 58px;
    }

    /* Center Panel: Speedometer with Concentric Circles BG */
    .panel-center {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: 
        radial-gradient(circle, transparent 20%, #0d1017 90%),
        repeating-radial-gradient(circle at center, transparent 0, transparent 15px, rgba(255,255,255,0.03) 16px, transparent 17px);
    }

    .speed-display {
      font-size: 115px;
      line-height: 0.9;
    }

    .speed-unit {
      font-size: 24px;
      color: var(--text-dim);
      margin-top: 5px;
    }

    .v-logo {
      margin-top: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .v-symbol {
      font-family: 'Orbitron', sans-serif;
      font-size: 38px;
      font-weight: 900;
      background: linear-gradient(180deg, #ff4d6d 0%, #b3001e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(255, 42, 75, 0.6));
    }

    .v-text {
      font-size: 14px;
      letter-spacing: 4px;
      color: #fff;
      margin-top: -6px;
    }

    /* Right Panel */
    .panel-right {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 11px;
    }

    .net-header {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 4px;
    }

    .hud-info-grid {
      display: grid;
      grid-template-columns: 75px 1fr;
      gap: 8px;
    }

    .map-box {
      width: 75px;
      height: 55px;
      background: #18202c;
      border: 1px solid #2e3b50;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .gps-spec {
      color: var(--text-dim);
      line-height: 1.2;
    }

    .gps-spec strong { color: #fff; }

    /* Detailed Bike SVG Graphic Container */
    .bike-schematic {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .callout {
      position: absolute;
      color: var(--accent-red);
      font-size: 9px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .callout-ecu { top: 25px; right: 25px; }
    .callout-sensor { bottom: 25px; right: 20px; }

    .callout::before {
      content: '';
      width: 15px;
      height: 1px;
      background: var(--accent-red);
    }

    /* Bottom Section Cards */
    .bottom-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.4fr 1.2fr;
      gap: 10px;
      height: 105px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-title {
      font-size: 11px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 1px;
    }

    .card-val {
      font-size: 26px;
      text-align: center;
      margin: 2px 0;
    }

    .sparkline {
      width: 100%;
      height: 22px;
    }

    /* Right Nav Buttons (Matching Reference) */
    .nav-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      background: #0f131a;
    }

    .nav-btn {
      background: #161c27;
      border: 1px solid #283344;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      gap: 4px;
      font-size: 9px;
    }

    .nav-btn.active {
      background: #1a2536;
      color: #fff;
      border: 1px solid var(--accent-cyan);
      box-shadow: inset 0 0 8px rgba(0,217,255,0.2);
    }

    .nav-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    /* Brand Logo Under Dashboard */
    .bottom-brand {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 15px;
      letter-spacing: 2px;
      color: #fff;
    }
    .bottom-brand span { color: var(--accent-red); }
  </style>
</head>
<body>

  <div class="viewport-scaler" id="scaler">
    <div class="dashboard-frame" id="dash">
      
      <!-- Top Header Bar -->
      <header class="top-bar">
        <div class="top-left">
          <button class="btn-hdr"><div class="status-led"></div> Connect</button>
          <button class="btn-hdr">Скинути</button>
          <button class="btn-hdr">PiP</button>
          <button class="btn-hdr">Trip</button>
          <span class="net-title">SAMURAI_NET</span>
        </div>
        <div class="top-right">
          <button class="btn-hdr">Налаштувати</button>
          <span class="net-title">CONF_SYS</span>
        </div>
      </header>

      <!-- Main Grid -->
      <main class="main-grid">
        
        <!-- Left Panel: Engine Temp -->
        <div class="panel panel-left">
          <div class="panel-title">T_ENG</div>
          <div class="engine-container">
            <div class="engine-graphic">
              <!-- Detailed V-Twin Engine Vector -->
              <svg viewBox="0 0 100 100" width="100%" height="100%" stroke="#4a5a73" stroke-width="1.2" fill="none">
                <path d="M 30 20 L 45 10 L 55 10 L 70 20 L 70 35 L 58 45 L 70 55 L 70 75 L 55 85 L 45 85 L 30 75 L 30 55 L 42 45 L 30 35 Z" stroke="#3d4c63" />
                <!-- Cooling Fins -->
                <line x1="32" y1="25" x2="68" y2="25" />
                <line x1="32" y1="30" x2="68" y2="30" />
                <line x1="32" y1="65" x2="68" y2="65" />
                <line x1="32" y1="70" x2="68" y2="70" />
                <circle cx="50" cy="45" r="12" stroke="#00d9ff" stroke-width="1" />
                <circle cx="50" cy="45" r="4" fill="#00d9ff" />
              </svg>
              <!-- Glowing Red Sensors -->
              <div class="sensor-dot" style="top: 18%; left: 28%;"></div>
              <div class="sensor-dot" style="top: 25%; left: 72%;"></div>
              <div class="sensor-dot" style="top: 65%; left: 20%;"></div>
              <div class="sensor-dot" style="top: 75%; left: 68%;"></div>
            </div>
            <div class="digital-lcd digital-val-large" id="t-eng-val">118</div>
          </div>
        </div>

        <!-- Center Panel: Speedometer -->
        <div class="panel panel-center">
          <div class="digital-lcd speed-display" id="speed-val">0</div>
          <div class="speed-unit">km/h</div>
          <div class="v-logo">
            <div class="v-symbol">V</div>
            <div class="v-text">Racer</div>
          </div>
        </div>

        <!-- Right Panel: Map & Scooter Outline -->
        <div class="panel panel-right">
          <div class="net-header">
            <div class="status-led"></div>
            <span>NET_LINK: HEYWOOD FREE NET</span>
          </div>

          <div class="hud-info-grid">
            <div class="map-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--accent-cyan)"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
              <span style="font-size: 8px; margin-top:2px;">0km/h</span>
            </div>
            <div class="gps-spec">
              <div>ENGINE_SPEC</div>
              <div style="font-size: 9px; opacity: 0.6;">30.5866°E, 129.6995°E</div>
              <div style="margin-top: 2px;"><strong>NIGHT CITY GPS</strong></div>
              <div style="font-size: 8px; opacity: 0.6;">V-Racer Headquarters</div>
            </div>
          </div>

          <div class="bike-schematic">
            <!-- Detailed Maxi-Scooter SVG Silhouette -->
            <svg width="210" height="110" viewBox="0 0 200 110" stroke="#00d9ff" stroke-width="1.3" fill="none" opacity="0.85">
              <!-- Wheels -->
              <circle cx="45" cy="80" r="16" stroke="#00d9ff" stroke-width="2"/>
              <circle cx="155" cy="80" r="16" stroke="#00d9ff" stroke-width="2"/>
              <circle cx="45" cy="80" r="6" fill="#00d9ff"/>
              <circle cx="155" cy="80" r="6" fill="#00d9ff"/>
              <!-- Bodywork Fairings -->
              <path d="M 30 75 Q 40 45 70 45 L 105 60 L 140 35 L 165 35 L 175 55 L 150 80 Z" />
              <path d="M 70 45 L 90 25 L 115 25 L 105 60" />
              <path d="M 105 60 L 145 60 L 165 80" />
              <!-- Handlebar & Windscreen -->
              <path d="M 125 30 L 135 15 L 145 20" stroke-width="2"/>
            </svg>
            <div class="callout callout-ecu">ECU</div>
            <div class="callout callout-sensor">SENSOR</div>
          </div>

          <div style="text-align: center; color: var(--text-dim); font-size: 9px; letter-spacing: 1px;">
            [ STREET-LEVEL: ACTIVE ]
          </div>
        </div>

      </main>

      <!-- Bottom Cards -->
      <footer class="bottom-row">
        
        <!-- TPS% Card -->
        <div class="card">
          <div class="card-title">TPS%</div>
          <div class="digital-lcd card-val" id="tps-val">00</div>
          <canvas id="chart-tps" class="sparkline"></canvas>
        </div>

        <!-- T_AIR Card -->
        <div class="card">
          <div class="card-title">T_AIR</div>
          <div class="digital-lcd card-val" id="tair-val">25</div>
          <canvas id="chart-tair" class="sparkline"></canvas>
        </div>

        <!-- VOLT & RPM Card -->
        <div class="card" style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
          <div>
            <div class="card-title">VOLT</div>
            <div class="digital-lcd card-val" id="volt-val" style="font-size: 19px;">12.8</div>
            <canvas id="chart-volt" class="sparkline"></canvas>
          </div>
          <div>
            <div class="card-title">RPM</div>
            <div class="digital-lcd card-val" id="rpm-val" style="font-size: 19px;">0</div>
            <canvas id="chart-rpm" class="sparkline"></canvas>
          </div>
        </div>

        <!-- Right Nav Buttons (With Speedometer Gauge Icon) -->
        <div class="card nav-card">
          <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            GPS
          </div>
          <div class="nav-btn active">
            <!-- Speedometer Icon -->
            <svg viewBox="0 0 24 24"><path d="M12 4C6.48 4 2 8.48 2 14c0 2.22.72 4.26 1.95 5.95l1.43-1.43C4.48 17.22 4 15.67 4 14c0-4.41 3.59-8 8-8s8 3.59 8 8c0 1.67-.48 3.22-1.38 4.52l1.43 1.43C21.28 18.26 22 16.22 22 14c0-5.52-4.48-10-10-10zm-1 5v2.05c-.59.22-1 .78-1 1.45 0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5c0-.67-.41-1.23-1-1.45V9h-1z"/></svg>
            Speedometer
          </div>
          <div class="nav-btn">
            <!-- TRIP Icon -->
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            TRIP
          </div>
        </div>

      </footer>

      <div class="bottom-brand"><span>V-</span>Racer</div>
    </div>
  </div>

  <script>
    // Auto Scaler
    function resizeDashboard() {
      const dash = document.getElementById('dash');
      const scaleX = (window.innerWidth - 10) / 1100;
      const scaleY = (window.innerHeight - 10) / 560;
      const scale = Math.min(scaleX, scaleY, 1.2);
      dash.style.transform = `scale(${scale})`;
    }
    window.addEventListener('resize', resizeDashboard);
    window.addEventListener('load', resizeDashboard);

    // Simulation Data & Logic
    let speed = 0, targetSpeed = 0, tps = 0, rpm = 0, tEng = 118, tAir = 25, volt = 12.8;
    const historyLength = 35;
    const tpsHist = new Array(historyLength).fill(0);
    const tAirHist = new Array(historyLength).fill(25);
    const voltHist = new Array(historyLength).fill(12.8);
    const rpmHist = new Array(historyLength).fill(0);

    const ctxTps = document.getElementById('chart-tps').getContext('2d');
    const ctxAir = document.getElementById('chart-tair').getContext('2d');
    const ctxVolt = document.getElementById('chart-volt').getContext('2d');
    const ctxRpm = document.getElementById('chart-rpm').getContext('2d');

    function drawChart(ctx, data, minVal, maxVal, color) {
      const width = ctx.canvas.width = ctx.canvas.clientWidth;
      const height = ctx.canvas.height = ctx.canvas.clientHeight;
      ctx.clearRect(0, 0, width, height);
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.8;

      const step = width / (historyLength - 1);
      for (let i = 0; i < data.length; i++) {
        const norm = (data[i] - minVal) / (maxVal - minVal || 1);
        const y = height - (norm * (height - 4) + 2);
        const x = i * step;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    let accelerating = true;
    function updateDemo() {
      if (accelerating) {
        targetSpeed += Math.random() * 10;
        if (targetSpeed > 160) accelerating = false;
      } else {
        targetSpeed -= Math.random() * 12;
        if (targetSpeed < 5) accelerating = true;
      }

      speed += (targetSpeed - speed) * 0.1;
      tps = Math.min(100, Math.max(0, Math.floor((targetSpeed - speed) * 4 + (speed > 5 ? 15 : 0))));
      rpm = speed > 2 ? Math.floor(speed * 42 + (tps * 20) + (Math.random() * 100)) : 0;
      volt = +(13.2 + (rpm / 8000) * 0.8 + (Math.random() * 0.1 - 0.05)).toFixed(1);

      document.getElementById('speed-val').innerText = Math.round(speed);
      document.getElementById('t-eng-val').innerText = tEng;
      document.getElementById('tps-val').innerText = String(tps).padStart(2, '0');
      document.getElementById('tair-val').innerText = tAir;
      document.getElementById('volt-val').innerText = volt;
      document.getElementById('rpm-val').innerText = rpm;

      tpsHist.push(tps); tpsHist.shift();
      tAirHist.push(tAir + (Math.random() * 0.2 - 0.1)); tAirHist.shift();
      voltHist.push(volt); voltHist.shift();
      rpmHist.push(rpm); rpmHist.shift();

      drawChart(ctxTps, tpsHist, 0, 100, '#00d9ff');
      drawChart(ctxAir, tAirHist, 20, 30, '#00ff88');
      drawChart(ctxVolt, voltHist, 11, 15, '#ff2a4b');
      drawChart(ctxRpm, rpmHist, 0, 8000, '#00d9ff');
    }

    setInterval(updateDemo, 100);
  </script>
</body>
</html>
