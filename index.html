

<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <!-- viewport-fit=cover змушує сторінку розгортатися під виріз камери -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Тест ХАК 1 (Мікроскролл)</title>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      /* 100lvw бере максимальну ширину (844px) */
      width: 100lvw !important;
      /* 100.1vh створює задел у 0.1% для можливості скролу */
      min-height: 100.1vh !important;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      /* Прибираємо бічні сейф-зони, щоб сторінка розтягнулася від краю до краю */
      padding-left: 0 !important;
      padding-right: 0 !important;

      /* Залишаємо відступи зверху/знизу, щоб не залазити під системний штрих */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    header {
      background: #1e1e1e;
      padding: 15px;
      border-bottom: 2px solid #ff9800;
      text-align: center;
      width: 100%;
    }

    main {
      background: #2a2a2a;
      padding: 20px;
      margin: 15px;
      border-radius: 12px;
    }

    .info-box {
      background: #333;
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
      font-family: monospace;
      font-size: 16px;
      color: #00e676;
    }

    footer {
      background: #1e1e1e;
      padding: 15px;
      border-top: 2px solid #2196f3;
      text-align: center;
      width: 100%;
    }
  </style>
</head>
<body>

  <header>
    <h2>Тест ХАК 1 (Мікроскролл)</h2>
    <p>Торкніться екрана або потягніть, щоб зняти рамки</p>
  </header>

  <main>
    <h3>Параметри екрана:</h3>
    <div class="info-box">
      <p>Ширина вікна (innerWidth): <span id="winWidth">-</span>px</p>
      <p>Ширина екрана (screen.width): <span id="screenWidth">-</span>px</p>
    </div>
  </main>

  <footer>
    <p>Цей спосіб безпечний для повороту екрана!</p>
  </footer>

  <script>
    /* Оновлення цифр на екрані */
    function updateDimensions() {
      var wEl = document.getElementById('winWidth');
      var sEl = document.getElementById('screenWidth');
      if (wEl) wEl.textContent = window.innerWidth;
      if (sEl) sEl.textContent = screen.width;
    }

    window.addEventListener('load', updateDimensions);
    window.addEventListener('resize', updateDimensions);
    window.addEventListener('scroll', updateDimensions);

    /* ХАК 1: Логіка автоматичного зсуву на 1px */
    (function initFullscreenHack() {
      function triggerFullscreenScroll() {
        if (window.scrollY === 0) {
          window.scrollTo({ top: 1, behavior: 'instant' });
        }
      }

      /* Спроба 1: Одразу при готовності сторінки */
      document.addEventListener('DOMContentLoaded', function() {
        setTimeout(triggerFullscreenScroll, 50);
      });

      /* Спроба 2: Після повного завантаження ресурсів */
      window.addEventListener('load', function() {
        setTimeout(triggerFullscreenScroll, 100);
        setTimeout(triggerFullscreenScroll, 300);
      });

      /* Спроба 3: При першому ж дотику користувача пальцем */
      function handleFirstTouch() {
        triggerFullscreenScroll();
        window.removeEventListener('touchstart', handleFirstTouch);
      }

      window.addEventListener('touchstart', handleFirstTouch, { passive: true });

      /* Спроба 4: При повертанні екрана */
      window.addEventListener('orientationchange', function() {
        setTimeout(triggerFullscreenScroll, 200);
      });
    })();
  </script>
</body>
</html>
