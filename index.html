<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>vRacer Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 100vh;
            background: #242424;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 16px 24px;
            border-radius: 12px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            text-align: center;
            font-weight: 600;
            color: #222;
        }
    </style>
</head>
<body>

<div id="status">Завантаження карти VRacer...</div>
<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>

<script>
    async function startApp() {
        const statusEl = document.getElementById('status');
        const map = L.map('map').setView([0, 0], 2);

        try {
            // Завантаження двигуна SQLite
            const SQL = await initSqlJs({
                locateFile: file => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${file}`
            });

            statusEl.innerText = 'Читання файлу VRacer.mbtiles...';

            // Завантаження вашого файлу
            const response = await fetch('./VRacer.mbtiles');
            
            if (!response.ok) {
                throw new Error('Файл VRacer.mbtiles не знайдено в репозиторії.');
            }

            const buffer = await response.arrayBuffer();
            const db = new SQL.Database(new Uint8Array(buffer));

            // Запит геопозиції користувача
            let locationFound = false;

            if ("geolocation" in navigator) {
                statusEl.innerText = 'Визначення вашого місцезнаходження...';
                
                await new Promise((resolve) => {
                    navigator.geolocation.getCurrentPosition(
                        (position) => {
                            const lat = position.coords.latitude;
                            const lng = position.coords.longitude;
                            
                            // Встановлюємо фокус карти на геопозицію
                            map.setView([lat, lng], 14);
                            
                            // Додаємо маркер точки місцезнаходження
                            L.circleMarker([lat, lng], {
                                radius: 9,
                                fillColor: "#2196F3",
                                color: "#FFFFFF",
                                weight: 3,
                                opacity: 1,
                                fillOpacity: 0.9
                            }).addTo(map).bindPopup("Ви тут").openPopup();
                            
                            locationFound = true;
                            resolve();
                        },
                        (error) => {
                            console.warn("Геопозицію не вдалося отримати:", error.message);
                            resolve(); // Продовжуємо, якщо користувач відхилив геопозицію
                        },
                        { timeout: 5000, enableHighAccuracy: true }
                    );
                });
            }

            // Якщо геопозицію не знайдено, фокусуємося на даних із файлу MBTiles
            if (!locationFound) {
                try {
                    const stmt = db.prepare("SELECT name, value FROM metadata");
                    let bounds = null;
                    let center = null;

                    while (stmt.step()) {
                        const row = stmt.getAsObject();
                        if (row.name === 'bounds') bounds = row.value.split(',').map(Number);
                        if (row.name === 'center') center = row.value.split(',').map(Number);
                    }
                    stmt.free();

                    if (bounds && bounds.length === 4) {
                        map.fitBounds([[bounds[1], bounds[0]], [bounds[3], bounds[2]]]);
                    } else if (center && center.length >= 2) {
                        map.setView([center[1], center[0]], center[2] || 13);
                    }
                } catch (e) {
                    console.log('Використовується стандартний центр.');
                }
            }

            // Шар для відображення тайлів
            const MBTilesLayer = L.TileLayer.extend({
                createTile: function(coords, done) {
                    const tile = document.createElement('img');
                    const z = coords.z;
                    const x = coords.x;
                    const tms_y = (1 << z) - 1 - coords.y;

                    try {
                        const stmt = db.prepare("SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=?");
                        stmt.bind([z, x, tms_y]);
                        
                        if (stmt.step()) {
                            const row = stmt.getAsObject();
                            const blob = new Blob([row.tile_data], { type: 'image/png' });
                            tile.src = URL.createObjectURL(blob);
                        }
                        stmt.free();
                    } catch (err) {
                        console.error(err);
                    }

                    setTimeout(() => done(null, tile), 0);
                    return tile;
                }
            });

            new MBTilesLayer().addTo(map);
            statusEl.style.display = 'none';

        } catch (error) {
            statusEl.innerText = 'Помилка: ' + error.message;
            statusEl.style.color = '#d32f2f';
        }
    }

    startApp();
</script>

</body>
</html>
