<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>MotoNav Dual HUD + Map Styles Test</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root {
  --bg-panel: rgba(18, 18, 22, 0.94);
  --border-line: rgba(255, 255, 255, 0.15);
  --cyan: #37e0e6;
  --amber: #ffb74d;
  --red: #ff4d4d;
  --green: #4caf50;
  --text: #ffffff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

#map { position: fixed; inset: 0; z-index: 1; }

/* КЛАСИ ДЛЯ ДИНАМІЧНОЇ ЗМІНИ ФІЛЬТРІВ КАРТИ */
.filter-none .leaflet-tile-container img { filter: none !important; }
.filter-new .leaflet-tile-container img { filter: contrast(130%) brightness(95%) saturate(140%) !important; }
.filter-sharp .leaflet-tile-container img { filter: contrast(160%) brightness(90%) saturate(180%) !important; }

/* ВЕРХНЯ ЗОНА МЕРЕЖІ ПАНЕЛЕЙ (ДВІ КАРТКИ) */
#hudHeader {
  position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 2000;
  display: flex; justify-content: space-between; align-items: center; pointer-events: none;
}

.hud-card {
  pointer-events: auto;
  background: var(--bg-panel); border: 1px solid var(--border-line); border-radius: 18px;
  padding: 8px 16px; backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6); display: flex; align-items: center;
}

/* 1. ЛІВА КАРТКА: НАВІГАЦІЯ */
.hud-nav-card { gap: 12px; }

.turn-arrow-svg {
  width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.turn-arrow-svg svg {
  width: 100%; height: 100%; fill: none; stroke: var(--cyan); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 0 6px rgba(55, 224, 230, 0.5));
}

.turn-dist { font-size: 30px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; white-space: nowrap; }

/* 2. ПРАВА КАРТКА: ТЕЛЕМЕТРІЯ */
.hud-telemetry-card { gap: 16px; padding: 6px 16px; }

.telemetry-block { display: flex; flex-direction: column; align-items: center; }
.telemetry-label { font-size: 10px; font-weight: 800; color: #888; text-transform: uppercase; margin-bottom: -2px; }
.telemetry-val { font-size: 30px; font-weight: 900; line-height: 1.1; }
.val-speed { color: var(--amber); }
.val-temp { color: #ff7043; }

/* БУЛЬБАШКИ УПРАВЛІННЯ (СПРАВА ВНИЗУ) */
.floating-controls {
  position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: 16px; z-index: 2500;
  display: flex; flex-direction: column; gap: 10px;
}
.circle-btn {
  width: 46px; height: 46px; border-radius: 50%; background: var(--bg-panel);
  border: 1px solid var(--border-line); color: #fff; font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px); transition: all 0.2s;
}
.circle-btn:active { transform: scale(0.92); }
.circle-btn.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(55,224,230,0.4); }

/* СПЛИВАЮЧІ МЕНЮ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-card {
  width: 90%; max-width: 480px; background: #141418; border: 1px solid var(--border-line);
  border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto;
}

.section-title { font-size: 12px; font-weight: bold; color: var(--cyan); text-transform: uppercase; margin-bottom: 2px; }

/* КНОПКИ ДЛЯ СТИЛІВ ТА ФІЛЬТРІВ */
.test-btn-group { display: flex; flex-direction: column; gap: 8px; }
.test-btn {
  padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border-line);
  background: #000; color: #aaa; font-size: 12px; font-weight: bold; cursor: pointer; text-align: left;
  display: flex; justify-content: space-between; align-items: center; transition: all 0.2s;
}
.test-btn.active { background: #22222a; color: #fff; border-color: var(--cyan); }

.plate-selector { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #000; padding: 4px; border-radius: 12px; }
.plate-btn { padding: 8px 4px; border-radius: 8px; border: none; background: transparent; color: #888; font-size: 11px; font-weight: bold; cursor: pointer; text-align: center; }
.plate-btn.active { background: #22222a; color: #fff; border: 1px solid var(--border-line); }
.plate-btn.yellow-plate.active { border-color: var(--amber); color: var(--amber); }

.input-box { display: flex; flex-direction: column; gap: 4px; }
.input-box label { font-size: 11px; color: #aaa; font-weight: bold; }
.input-box input { background: #000; border: 1px solid var(--border-line); border-radius: 10px; padding: 10px; color: #fff; font-size: 12px; outline: none; }

.toggles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 11px; }
.toggle-item { display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.03); padding: 6px 8px; border-radius: 8px; }
.toggle-item input { accent-color: var(--cyan); }

.modal-actions { display: flex; gap: 10px; }
.btn-action { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; }
.btn-start { background: var(--green); color: #fff; }
.btn-stop { background: rgba(255, 77, 77, 0.15); color: var(--red); border: 1px solid var(--red); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body class="filter-none">

<div id="map"></div>

<div id="hudHeader">
  
  <div class="hud-card hud-nav-card">
    <div class="turn-arrow-svg">
      <svg viewBox="0 0 24 24">
        <path d="M 6 19 L 6 9 C 6 6 8 4 11 4 L 17 4 M 13 8 L 18 4 L 13 0" transform="translate(0, 2)"/>
      </svg>
    </div>
    <div class="turn-dist" id="hudDistance">150 м</div>
  </div>
  
  <div class="hud-card hud-telemetry-card">
    <div class="telemetry-block">
      <span class="telemetry-label">км/год</span>
      <span class="telemetry-val val-speed" id="speedVal">0</span>
    </div>
    <div class="telemetry-block">
      <span class="telemetry-label">двигун</span>
      <span class="telemetry-val val-temp"><span id="engineTempVal">85</span><small style="font-size:14px;">°C</small></span>
    </div>
  </div>

</div>

<div class="floating-controls">
  <button class="circle-btn" id="btnSound" onclick="toggleSound()">🔇</button>
  <button class="circle-btn active" id="btnCenter" onclick="reCenterMap()">🎯</button>
  <button class="circle-btn" onclick="openStyleModal()">🎨</button>
  <button class="circle-btn" onclick="openRouteModal()">🗺️</button>
</div>

<div id="styleModal" class="modal-overlay" onclick="closeModalOnBackdrop(event, 'styleModal')">
  <div class="modal-card">
    
    <div class="section-title">🗺️ Тип карти (Шар)</div>
    <div class="test-btn-group">
      <button class="test-btn active" id="mapVoyager" onclick="setMapLayer('voyager')">
        <span>CartoDB Voyager</span> <small>(Базова)</small>
      </button>
      <button class="test-btn" id="mapOsm" onclick="setMapLayer('osm')">
        <span>OpenStreetMap Standard</span> <small>(Деталізовані дороги)</small>
      </button>
      <button class="test-btn" id="mapDark" onclick="setMapLayer('dark')">
        <span>CartoDB Dark Matter</span> <small>(Нічна тема)</small>
      </button>
    </div>

    <div class="section-title" style="margin-top: 6px;">🎨 CSS Фільтр контрасту</div>
    <div class="test-btn-group">
      <button class="test-btn active" id="filterNone" onclick="setFilter('filter-none')">
        <span>Оригінал</span> <small>(Без фільтра)</small>
      </button>
      <button class="test-btn" id="filterNew" onclick="setFilter('filter-new')">
        <span>Новий фільтр</span> <small>(Контраст + Насиченість)</small>
      </button>
      <button class="test-btn" id="filterSharp" onclick="setFilter('filter-sharp')">
        <span>Максимальна чіткість</span> <small>(Висока чіткість доріг)</small>
      </button>
    </div>

    <div class="modal-actions" style="margin-top: 6px;">
      <button class="btn-action btn-start" onclick="closeModal('styleModal')">Застосувати</button>
    </div>

  </div>
</div>

<div id="routeModal" class="modal-overlay" onclick="closeModalOnBackdrop(event, 'routeModal')">
  <div class="modal-card">
    <div class="plate-selector">
      <button class="plate-btn white-plate active" id="btnWhitePlate" onclick="selectPlate('white')">
        🛵 50–250 cc (Білі)
      </button>
      <button class="plate-btn yellow-plate" id="btnYellowPlate" onclick="selectPlate('yellow')">
        🏍️ 250+ cc (Жовті/Червоні)
      </button>
    </div>

    <div class="input-box">
      <label for="gmapsUrl">Посилання з Google Maps:</label>
      <input type="text" id="gmapsUrl" placeholder="https://maps.app.goo.gl/...">
    </div>

    <div class="toggles-grid">
      <label class="toggle-item"><input type="checkbox" id="avoidTolls" checked> Без платних</label>
      <label class="toggle-item"><input type="checkbox" id="avoidHighways"> Без швидкісних</label>
      <label class="toggle-item"><input type="checkbox" id="avoidFerries" checked> Без переправ</label>
    </div>

    <div class="modal-actions">
      <button class="btn-action btn-stop" onclick="stopNavigation()">❌ Скинути</button>
      <button class="btn-action btn-start" onclick="startNavigation()">▶️ ПОЧАТИ</button>
    </div>
  </div>
</div>

<script>
let map;
let currentTileLayer = null;
let userMarker = null;
let autoTracking = true;
let isSoundOn = false;
let userCoords = [24.9531, 121.2264]; // Початкові координати (Тайвань)

// ДЖЕРЕЛА КАРТ (TILE LAYERS)
const tileProviders = {
  voyager: 'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
  osm: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  dark: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png'
};

function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(userCoords, 16);

  // Встановлюємо базову карту Voyager
  currentTileLayer = L.tileLayer(tileProviders.voyager, { maxZoom: 19, subdomains: 'abcd' }).addTo(map);

  userMarker = L.circleMarker(userCoords, { radius: 9, fillColor: '#2B80FF', color: '#ffffff', weight: 3, fillOpacity: 1 }).addTo(map);

  map.on('dragstart zoomstart', function() {
    if (autoTracking) {
      autoTracking = false;
      document.getElementById('btnCenter').classList.remove('active');
    }
  });

  startGpsTracking();
}

function startGpsTracking() {
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
      (pos) => {
        userCoords = [pos.coords.latitude, pos.coords.longitude];
        userMarker.setLatLng(userCoords);

        const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        document.getElementById('speedVal').innerText = speed;

        if (autoTracking) {
          map.setView(userCoords, map.getZoom() > 15 ? map.getZoom() : 16, { animate: true });
        }
      },
      (err) => console.warn(err),
      { enableHighAccuracy: true }
    );
  }
}

// ПЕРЕММИКАННЯ ШАРІВ КАРТИ (ТЕСТ)
function setMapLayer(type) {
  if (currentTileLayer) map.removeLayer(currentTileLayer);
  
  currentTileLayer = L.tileLayer(tileProviders[type], { maxZoom: 19, subdomains: 'abcd' }).addTo(map);

  document.querySelectorAll('#styleModal .test-btn-group:nth-of-type(1) .test-btn').forEach(btn => btn.classList.remove('active'));
  
  if(type === 'voyager') document.getElementById('mapVoyager').classList.add('active');
  if(type === 'osm') document.getElementById('mapOsm').classList.add('active');
  if(type === 'dark') document.getElementById('mapDark').classList.add('active');
}

// ПЕРЕМИКАННЯ CSS ФІЛЬТРІВ (ТЕСТ)
function setFilter(filterClass) {
  document.body.className = filterClass;

  document.querySelectorAll('#styleModal .test-btn-group:nth-of-type(2) .test-btn').forEach(btn => btn.classList.remove('active'));
  
  if(filterClass === 'filter-none') document.getElementById('filterNone').classList.add('active');
  if(filterClass === 'filter-new') document.getElementById('filterNew').classList.add('active');
  if(filterClass === 'filter-sharp') document.getElementById('filterSharp').classList.add('active');
}

function reCenterMap() {
  autoTracking = true;
  document.getElementById('btnCenter').classList.add('active');
  map.setView(userCoords, 16, { animate: true });
}

function toggleSound() {
  isSoundOn = !isSoundOn;
  const btn = document.getElementById('btnSound');
  btn.innerText = isSoundOn ? "🔊" : "🔇";
  btn.classList.toggle('active', isSoundOn);
}

function openStyleModal() { document.getElementById('styleModal').classList.add('open'); }
function openRouteModal() { document.getElementById('routeModal').classList.add('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeModalOnBackdrop(e, id) { if (e.target.id === id) closeModal(id); }

function selectPlate(type) {
  document.getElementById('btnWhitePlate').classList.toggle('active', type === 'white');
  document.getElementById('btnYellowPlate').classList.toggle('active', type === 'yellow');
  document.getElementById('avoidHighways').checked = (type === 'white');
}

function startNavigation() { closeModal('routeModal'); }
function stopNavigation() { document.getElementById('gmapsUrl').value = ''; closeModal('routeModal'); }

function updateEngineTemp(temp) {
  document.getElementById('engineTempVal').innerText = temp;
}

window.onload = initMap;
</script>
</body>
</html>
