<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>MotoNav Dash Pro</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root {
  --bg-panel: rgba(18, 18, 22, 0.92);
  --border-line: rgba(255, 255, 255, 0.15);
  --cyan: #37e0e6;
  --amber: #ffb74d;
  --red: #ff4d4d;
  --green: #4caf50;
  --text: #ffffff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

#map { position: fixed; inset: 0; z-index: 1; }

/* 1. HUD ПАНЕЛЬ (ЗВЕРХУ) */
#hudPanel {
  position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 2000;
  background: var(--bg-panel); border: 1px solid var(--border-line); border-radius: 16px;
  padding: 12px 16px; backdrop-filter: blur(12px); display: flex; flex-direction: column; gap: 10px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.4);
}

.hud-main-turn { display: flex; align-items: center; gap: 12px; }
.turn-icon { font-size: 32px; line-height: 1; }
.turn-details { display: flex; flex-direction: column; }
.turn-distance { font-size: 18px; font-weight: 800; color: var(--cyan); }
.turn-street { font-size: 14px; font-weight: 600; color: #ddd; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hud-telemetry {
  display: flex; justify-content: space-between; border-top: 1px solid var(--border-line);
  padding-top: 8px; font-size: 12px; font-weight: 600;
}
.telemetry-item { display: flex; align-items: center; gap: 6px; }
.telemetry-value { font-size: 15px; font-weight: 800; }
.val-speed { color: var(--amber); }
.val-temp { color: #ff7043; }

/* 2. ПЛАВАЮЧІ БУЛЬБАШКИ КНОПОК (СПРАВА ВНИЗУ) */
.floating-controls {
  position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); right: 16px; z-index: 2500;
  display: flex; flex-direction: column; gap: 12px; align-items: center;
}

.circle-btn {
  width: 50px; height: 50px; border-radius: 50%; background: var(--bg-panel);
  border: 1px solid var(--border-line); color: #fff; font-size: 20px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px);
  transition: all 0.2s ease;
}
.circle-btn:active { transform: scale(0.92); }
.circle-btn.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(55,224,230,0.4); }

/* 3. СПЛИВАЮЧЕ МЕНЮ МАРШРУТУ */
#routeModal {
  position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px); display: none; align-items: flex-end; justify-content: center;
}
#routeModal.open { display: flex; }

.modal-card {
  width: 100%; max-width: 500px; background: #141418; border: 1px solid var(--border-line);
  border-top-left-radius: 24px; border-top-right-radius: 24px; padding: 20px;
  display: flex; flex-direction: column; gap: 16px; box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
  max-height: 85vh; overflow-y: auto;
}

/* Перемикач кубатури */
.plate-selector {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: #000; padding: 4px; border-radius: 12px;
}
.plate-btn {
  padding: 10px 6px; border-radius: 8px; border: none; background: transparent; color: #888;
  font-size: 12px; font-weight: bold; cursor: pointer; text-align: center; transition: all 0.2s;
}
.plate-btn.active { background: #22222a; color: #fff; border: 1px solid var(--border-line); }
.plate-btn.white-plate.active { border-color: #fff; }
.plate-btn.yellow-plate.active { border-color: var(--amber); color: var(--amber); }

.input-box { display: flex; flex-direction: column; gap: 6px; }
.input-box label { font-size: 12px; color: #aaa; font-weight: bold; }
.input-box input {
  background: #000; border: 1px solid var(--border-line); border-radius: 10px;
  padding: 12px; color: #fff; font-size: 13px; outline: none;
}

.toggles-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 12px; }
.toggle-item { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.03); padding: 8px 10px; border-radius: 8px; }
.toggle-item input { accent-color: var(--cyan); }

.modal-actions { display: flex; gap: 10px; margin-top: 6px; }
.btn-action {
  flex: 1; padding: 14px; border-radius: 12px; border: none; font-weight: bold; font-size: 14px; cursor: pointer;
}
.btn-start { background: var(--green); color: #fff; box-shadow: 0 4px 15px rgba(76,175,80,0.3); }
.btn-stop { background: rgba(255, 77, 77, 0.15); color: var(--red); border: 1px solid var(--red); }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>

<div id="map"></div>

<!-- 1. HUD ПАНЕЛЬ -->
<div id="hudPanel">
  <div class="hud-main-turn">
    <div class="turn-icon" id="hudTurnIcon">↱</div>
    <div class="turn-details">
      <div class="turn-distance" id="hudDistance">через 150 м</div>
      <div class="turn-street" id="hudStreet">вул. Рузвельта (Roosevelt Rd)</div>
    </div>
  </div>
  
  <div class="hud-telemetry">
    <div class="telemetry-item">
      <span>⚡ Швидкість:</span>
      <span class="telemetry-value val-speed"><span id="speedVal">0</span> <small style="font-size:10px;">км/год</small></span>
    </div>
    <div class="telemetry-item">
      <span>🌡️ Двигун:</span>
      <span class="telemetry-value val-temp"><span id="engineTempVal">85</span> <small style="font-size:10px;">°C</small></span>
    </div>
  </div>
</div>

<!-- 2. БУЛЬБАШКИ УПРАВЛІННЯ -->
<div class="floating-controls">
  <button class="circle-btn" id="btnSound" onclick="toggleSound()">🔇</button>
  <button class="circle-btn active" id="btnCenter" onclick="reCenterMap()">🎯</button>
  <button class="circle-btn" onclick="openRouteModal()">🗺️</button>
</div>

<!-- 3. СПЛИВАЮЧЕ МЕНЮ "МАРШРУТ" -->
<div id="routeModal" onclick="closeModalOnBackdrop(event)">
  <div class="modal-card">
    
    <!-- Перемикач типу транспорту -->
    <div class="plate-selector">
      <button class="plate-btn white-plate active" id="btnWhitePlate" onclick="selectPlate('white')">
        🛵 50–250 cc<br><small style="font-size:10px; opacity:0.7;">(Білі номери)</small>
      </button>
      <button class="plate-btn yellow-plate" id="btnYellowPlate" onclick="selectPlate('yellow')">
        🏍️ 250+ cc<br><small style="font-size:10px; opacity:0.7;">(Жовті / Червоні)</small>
      </button>
    </div>

    <!-- Поле посилання -->
    <div class="input-box">
      <label for="gmapsUrl">Посилання з Google Maps:</label>
      <input type="text" id="gmapsUrl" placeholder="Вставте посилання (https://maps.app.goo.gl/...)">
    </div>

    <!-- Додаткові опції -->
    <div class="toggles-grid">
      <label class="toggle-item"><input type="checkbox" id="avoidTolls" checked> Без платних доріг</label>
      <label class="toggle-item"><input type="checkbox" id="avoidHighways"> Без швидкісних трас</label>
      <label class="toggle-item"><input type="checkbox" id="avoidFerries" checked> Без переправ</label>
    </div>

    <!-- Кнопки дій -->
    <div class="modal-actions">
      <button class="btn-action btn-stop" onclick="stopNavigation()">❌ Скинути</button>
      <button class="btn-action btn-start" onclick="startNavigation()">▶️ ПОЧАТИ</button>
    </div>

  </div>
</div>

<script>
let map;
let userMarker = null;
let autoTracking = true;
let isSoundOn = false;
let selectedPlate = 'white'; // 'white' або 'yellow'
let userCoords = [25.0330, 121.5654]; // За замовчуванням Тайбей

function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(userCoords, 15);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19 }).addTo(map);

  userMarker = L.circleMarker(userCoords, { radius: 9, fillColor: '#2B80FF', color: '#ffffff', weight: 3, fillOpacity: 1 }).addTo(map);

  // ВИМКНЕННЯ АВТОЦЕНТРОВКИ ПРИ РУЧНОМУ ЗСУВІ КАРТИ
  map.on('dragstart zoomstart', function() {
    if (autoTracking) {
      autoTracking = false;
      document.getElementById('btnCenter').classList.remove('active');
    }
  });

  startGpsTracking();
}

function startGpsTracking() {
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition(
      (pos) => {
        userCoords = [pos.coords.latitude, pos.coords.longitude];
        userMarker.setLatLng(userCoords);

        // Оновлення швидкості (переведення з м/с у км/год)
        const speed = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
        document.getElementById('speedVal').innerText = speed;

        if (autoTracking) {
          map.setView(userCoords, map.getZoom() > 15 ? map.getZoom() : 16, { animate: true });
        }
      },
      (err) => console.warn(err),
      { enableHighAccuracy: true }
    );
  }
}

// Кнопка Центровки
function reCenterMap() {
  autoTracking = true;
  document.getElementById('btnCenter').classList.add('active');
  map.setView(userCoords, 16, { animate: true });
}

// Кнопка Звуку
function toggleSound() {
  isSoundOn = !isSoundOn;
  const btn = document.getElementById('btnSound');
  btn.innerText = isSoundOn ? "🔊" : "🔇";
  btn.classList.toggle('active', isSoundOn);
}

// Управління меню Маршруту
function openRouteModal() { document.getElementById('routeModal').classList.add('open'); }
function closeRouteModal() { document.getElementById('routeModal').classList.remove('open'); }
function closeModalOnBackdrop(e) { if (e.target.id === 'routeModal') closeRouteModal(); }

// Вибір типу номерів
function selectPlate(type) {
  selectedPlate = type;
  document.getElementById('btnWhitePlate').classList.toggle('active', type === 'white');
  document.getElementById('btnYellowPlate').classList.toggle('active', type === 'yellow');
  
  // Автоматично виставляємо тумблер швидкісних трас для білих номерів
  if (type === 'white') {
    document.getElementById('avoidHighways').checked = true;
  } else {
    document.getElementById('avoidHighways').checked = false;
  }
}

// Дії з маршрутом
function startNavigation() {
  const url = document.getElementById('gmapsUrl').value.trim();
  closeRouteModal();
  // ТУТ БУДЕ ЛОГІКА РОЗПАРСЮВАННЯ ПОСИЛАННЯ ТА ВИКЛИКУ GOOGLE ROUTES API
}

function stopNavigation() {
  document.getElementById('gmapsUrl').value = '';
  closeRouteModal();
  // ТУТ БУДЕ ЛОГІКА ОЧИЩЕННЯ ЛІНІЇ МАРШРУТУ З КАРТИ
}

// Функція для майбутньої інтеграції температури двигуна (наприклад, з OBD2 скрипта)
function updateEngineTemperature(temp) {
  document.getElementById('engineTempVal').innerText = temp;
}

window.onload = initMap;
</script>
</body>
</html>
