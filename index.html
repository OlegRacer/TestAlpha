<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>vRacer Dash Pro - Smart Navigation</title>
<style>
:root {
  --bg: #000000; --panel: #0d0d0f; --line: rgba(255,255,255,0.12);
  --text: #f2f2f0; --muted: #888; --cyan: #37e0e6; --amber: #ffb74d; --green: #4caf50; --red: #ff4d4d;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

/* MAP CONTAINER (На весь екран + Колірний фільтр референсу) */
#map { 
  position: fixed; 
  inset: 0; 
  z-index: 1; 
  background-color: #f2efe9; /* Теплий пастельний фон */
}

/* Фільтр для тайлів для створення пастельних тонів і контрастних сірих доріг */
.leaflet-tile-pane {
  filter: contrast(115%) brightness(96%) saturate(85%) hue-rotate(-5deg);
}

/* HUD SPEED & INSTRUCTION DISPLAY */
#hudPanel {
  position: fixed; top: max(12px, env(safe-area-inset-top)); left: 10px; right: 10px; z-index: 2000;
  background: rgba(13, 13, 15, 0.92); border: 1px solid var(--line); border-radius: 12px;
  padding: 10px 14px; display: none; justify-content: space-between; align-items: center;
  backdrop-filter: blur(8px);
}
.hud-instruction { font-size: 15px; font-weight: bold; color: var(--cyan); display: flex; align-items: center; gap: 8px; }
.hud-speed { text-align: right; font-size: 11px; color: var(--muted); }
.hud-speed-val { font-size: 18px; font-weight: bold; color: var(--amber); }

/* ROUTE BUILDER PANEL */
#navOverlay {
  position: fixed; bottom: max(12px, env(safe-area-inset-bottom)); left: 10px; right: 10px; z-index: 2000;
  background: rgba(13, 13, 15, 0.94); border: 1px solid var(--line); border-radius: 14px;
  padding: 12px; backdrop-filter: blur(10px); display: flex; flex-direction: column; gap: 8px;
  max-height: 65vh; overflow-y: auto; transition: transform 0.3s ease, opacity 0.3s ease;
}
#navOverlay.hidden { transform: translateY(120%); opacity: 0; pointer-events: none; }

.input-group { display: flex; flex-direction: column; gap: 6px; }
.input-row { display: flex; gap: 6px; align-items: center; }
.input-label { font-size: 11px; color: var(--muted); width: 45px; font-weight: bold; }
input[type="text"], select {
  flex: 1; background: #000; border: 1px solid var(--line); border-radius: 6px;
  padding: 8px 10px; color: #fff; font-size: 13px; outline: none;
}
.icon-btn {
  background: #1a1a1e; color: var(--text); border: 1px solid var(--line);
  border-radius: 6px; width: 34px; height: 34px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; font-weight: bold; flex-shrink: 0;
}
.icon-btn.danger { color: var(--red); border-color: rgba(255,77,77,0.3); }

button.action-btn {
  background: var(--cyan); color: #000; border: none; border-radius: 6px;
  padding: 10px 14px; font-weight: bold; font-size: 13px; cursor: pointer;
}
button.close-panel-btn {
  background: #222; color: #fff; border: 1px solid var(--line); border-radius: 6px;
  padding: 10px 14px; font-weight: bold; font-size: 13px; cursor: pointer;
}
button.go-btn {
  background: var(--green); color: #fff; border: none; border-radius: 6px;
  padding: 12px 14px; font-weight: bold; font-size: 14px; cursor: pointer; margin-top: 4px;
  display: none; box-shadow: 0 0 10px rgba(76,175,80,0.4);
}

/* CHECKBOX FILTERS */
.filters-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
  background: rgba(255,255,255,0.03); padding: 8px; border-radius: 8px; border: 1px solid var(--line);
}
.filter-item { font-size: 11px; color: var(--text); display: flex; align-items: center; gap: 6px; cursor: pointer; }
.filter-item input { accent-color: var(--cyan); }

.options-row { display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: var(--muted); margin-top: 2px; }

/* BOTTOM ACTION BAR */
.bottom-controls {
  position: fixed; bottom: max(15px, env(safe-area-inset-bottom)); right: 15px; z-index: 3000;
  display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  transition: transform 0.3s ease;
}

.floating-btn {
  border: none; border-radius: 25px; padding: 12px 18px;
  font-weight: bold; font-size: 13px; cursor: pointer; color: #fff;
  backdrop-filter: blur(6px); box-shadow: 0 4px 15px rgba(0,0,0,0.5);
}
.icon-float-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(13, 13, 15, 0.9); border: 1px solid var(--line);
  color: #fff; font-size: 18px; display: flex; align-items: center;
  justify-content: center; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
  transition: border-color 0.3s, color 0.3s;
}
.icon-float-btn.active-tracking { border-color: var(--cyan); color: var(--cyan); }
.icon-float-btn.active-sound { border-color: var(--green); color: var(--green); }
.icon-float-btn:active { transform: scale(0.95); }

#toggleMenuBtn { background: #1a1a1e; border: 1px solid var(--line); display: none; }
#stopNavBtn { background: var(--red); display: none; box-shadow: 0 4px 15px rgba(255,77,77,0.4); }
#recalculateBtn {
  background: var(--amber); color: #000; display: none;
  animation: pulse 1.5s infinite; box-shadow: 0 0 12px rgba(255,183,77,0.6);
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* POPUP BUTTONS */
.popup-btn {
  display: block; width: 100%; margin: 4px 0; padding: 6px;
  background: #222; color: #fff; border: 1px solid var(--line);
  border-radius: 4px; font-size: 11px; cursor: pointer; text-align: center;
}
.popup-btn.primary { background: var(--cyan); color: #000; font-weight: bold; }
</style>

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>

<!-- HUD Підказок та Швидкості -->
<div id="hudPanel">
  <div class="hud-instruction" id="hudTurnInfo">
    <span>🧭</span> <span>Рухайтесь за маршрутом</span>
  </div>
  <div class="hud-speed">
    Ліміт: <span class="hud-speed-val" id="hudLimit">--</span> км/год
  </div>
</div>

<!-- Карта -->
<div id="map"></div>

<!-- Плаваючі кнопки керування знизу -->
<div class="bottom-controls" id="bottomControls">
  <button class="icon-float-btn" id="voiceToggleBtn" onclick="toggleVoice()" title="Увімкнути/Вимкнути звук">🔇</button>
  <button class="icon-float-btn active-tracking" id="centerGpsBtn" onclick="enableAutoTrackingAndCenter()" title="Центрувати та увімкнути стеження">🎯</button>
  <button class="floating-btn" id="recalculateBtn" onclick="recalculateRoute()">🔄 Перебудувати</button>
  <button class="floating-btn" id="toggleMenuBtn" onclick="openNavMenu()">🗺️ Маршрут</button>
  <button class="floating-btn" id="stopNavBtn" onclick="stopActiveNavigation()">❌ Завершити</button>
</div>

<!-- Панель адреси та налаштувань -->
<div id="navOverlay">

  <!-- Список фільтрів доріг -->
  <div class="filters-grid">
    <label class="filter-item"><input type="checkbox" id="avoidTolls" checked> 🆓 Без платних доріг</label>
    <label class="filter-item"><input type="checkbox" id="shortestRoute"> 📏 Найкоротший шлях</label>
    <label class="filter-item"><input type="checkbox" id="curvyMode"> 🏍️ Звивисті серпантини</label>
    <label class="filter-item"><input type="checkbox" id="scenicMode"> 🏞️ Сценічний / Краєвиди</label>
    <label class="filter-item"><input type="checkbox" id="noHighways"> 🏙️ Без швидкісних шосе</label>
    <label class="filter-item"><input type="checkbox" id="bikeMode"> 🚲 Скутер / Мото режим</label>
  </div>

  <div class="input-group" id="waypointsContainer">
    <!-- Звідки -->
    <div class="input-row">
      <span class="input-label">Звідки:</span>
      <input type="text" id="startInput" placeholder="Моє місцезнаходження (GPS)">
    </div>
    <!-- Куди -->
    <div class="input-row" id="destRow">
      <span class="input-label">Куди:</span>
      <input type="text" id="destInput" placeholder="Адреса / Назва / Клік на карті">
      <!-- Кнопка скидання маршруту/адреси -->
      <button class="icon-btn danger" onclick="resetRoute()" title="Скинути маршрут і адреси">❌</button>
    </div>
  </div>

  <div style="display: flex; gap: 6px; margin-top: 4px;">
    <button class="icon-btn" style="width: auto; padding: 0 10px; font-size: 11px;" onclick="addWaypointInput()">+ Зупинка</button>
    <button class="action-btn" style="flex: 1;" onclick="buildRoute()">Розрахувати 🔍</button>
    <button class="close-panel-btn" onclick="closeNavMenu()">✕ Закрити</button>
  </div>

  <!-- Кнопка ПОЇХАЛИ -->
  <button class="go-btn" id="startDriveBtn" onclick="startDriveMode()">▶️ ПОЇХАЛИ (Почати навігацію)</button>
  
  <div class="options-row">
    <span style="font-size: 11px; color: var(--muted);">Дистанція:</span>
    <span id="distDisplay" style="color: var(--cyan); font-weight: bold;">-- км</span>
  </div>
</div>

<script>
// --- ГЛОБАЛЬНІ ЗМІННІ ---
let map, userMarker, routeLayer, pinnedMarker;
let userCoords = [25.0330, 121.5654]; 
let customStartCoords = null;
let currentSteps = [];
let nextStepIndex = 0;
let isDriveActive = false; 
let activeDestCoords = null;
let offRouteWarned = false;
let autoTracking = true;

// --- 1. ГОЛОСОВИЙ МОДУЛЬ ---
const VoiceGuidance = {
  synth: window.speechSynthesis,
  enabled: false,

  toggle() {
    this.enabled = !this.enabled;
    const btn = document.getElementById('voiceToggleBtn');
    if (this.enabled) {
      btn.innerText = "🔊";
      btn.classList.add('active-sound');
      this.speak('Звук увімкнено');
    } else {
      btn.innerText = "🔇";
      btn.classList.remove('active-sound');
      if (this.synth) this.synth.cancel();
    }
  },

  speak(text) {
    if (!this.synth || !this.enabled) return;
    this.synth.cancel();
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'uk-UA';
    utterance.rate = 1.0;
    this.synth.speak(utterance);
  }
};

function toggleVoice() { VoiceGuidance.toggle(); }

// --- 2. ІНІЦІАЛІЗАЦІЯ КАРТИ ТА ЦЕНТРОВКА (З використанням стилізованих тайлів) ---
function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(userCoords, 14);
  
  // Використовуємо кастомний тайловий шар CartoDB Positron для світлої пастельної палітри
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    subdomains: 'abcd'
  }).addTo(map);

  // Стилізований маркер позиції користувача
  userMarker = L.circleMarker(userCoords, {
    radius: 8, fillColor: '#2B80FF', color: '#ffffff', weight: 3, fillOpacity: 1
  }).addTo(map);

  // Вимикаємо автоцентрування при ручному русі карти
  map.on('dragstart zoomstart touchstart', function() {
    if (autoTracking) {
      autoTracking = false;
      document.getElementById('centerGpsBtn').classList.remove('active-tracking');
    }
  });

  map.on('click', function(e) {
    if (!isDriveActive) setPinMarker(e.latlng.lat, e.latlng.lng);
  });

  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      pos => {
        userCoords = [pos.coords.latitude, pos.coords.longitude];
        userMarker.setLatLng(userCoords);
        
        if (isDriveActive && autoTracking) {
          map.panTo(userCoords, { animate: true });
        }

        processNavigation();
        fetchSpeedLimits(userCoords[0], userCoords[1]);
      },
      err => {},
      { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
    );
  }

  adjustControlsPosition();
}

function adjustControlsPosition() {
  const overlay = document.getElementById('navOverlay');
  const controls = document.getElementById('bottomControls');
  
  if (!overlay.classList.contains('hidden')) {
    const overlayHeight = overlay.offsetHeight;
    controls.style.transform = `translateY(-${overlayHeight + 8}px)`;
  } else {
    controls.style.transform = `translateY(0px)`;
  }
}

function enableAutoTrackingAndCenter() {
  autoTracking = true;
  document.getElementById('centerGpsBtn').classList.add('active-tracking');
  const zoomLevel = isDriveActive ? 18 : 16;
  map.setView(userCoords, zoomLevel, { animate: true, duration: 0.8 });
}

function setPinMarker(lat, lng) {
  if (pinnedMarker) map.removeLayer(pinnedMarker);

  const popupContent = `
    <div style="color:#000; font-size:12px; text-align:center;">
      <b>📌 Обрана точка</b><br>
      <button class="popup-btn" onclick="setAsStart(${lat}, ${lng})">🚩 Зробити Стартом</button>
      <button class="popup-btn" onclick="addWaypointFromPin(${lat}, ${lng})">➕ Додати як Зупинку</button>
      <button class="popup-btn primary" onclick="setAsDest(${lat}, ${lng})">🏁 Зробити Фінішем</button>
    </div>
  `;

  pinnedMarker = L.marker([lat, lng]).addTo(map).bindPopup(popupContent).openPopup();
}

function setAsStart(lat, lng) {
  customStartCoords = [lat, lng];
  document.getElementById('startInput').value = `${lat.toFixed(4)}, ${lng.toFixed(4)} (Карта)`;
  map.closePopup();
}

function setAsDest(lat, lng) {
  document.getElementById('destInput').value = `${lat.toFixed(4)}, ${lng.toFixed(4)} (Карта)`;
  document.getElementById('destInput').dataset.lat = lat;
  document.getElementById('destInput').dataset.lng = lng;
  map.closePopup();
}

function addWaypointFromPin(lat, lng) {
  addWaypointInput(`${lat.toFixed(4)}, ${lng.toFixed(4)} (Карта)`, [lat, lng]);
  map.closePopup();
}

function addWaypointInput(value = '', coords = null) {
  const destRow = document.getElementById('destRow');
  const row = document.createElement('div');
  row.className = 'input-row waypoint-row';
  
  const index = document.querySelectorAll('.waypoint-row').length + 1;
  row.innerHTML = `
    <span class="input-label">Точка ${index}:</span>
    <input type="text" class="wp-input" placeholder="Адреса зупинки" value="${value}">
    <button class="icon-btn danger" onclick="this.parentElement.remove(); adjustControlsPosition();">✕</button>
  `;
  
  if (coords) row.querySelector('.wp-input').dataset.coords = JSON.stringify(coords);
  destRow.parentNode.insertBefore(row, destRow);
  adjustControlsPosition();
}

// --- 3. УПРАВЛІННЯ ПАНЕЛЮ ТА КНОПКАМИ ---
function closeNavMenu() {
  document.getElementById('navOverlay').classList.add('hidden');
  adjustControlsPosition();
  
  if (!isDriveActive) {
    document.getElementById('toggleMenuBtn').style.display = 'inline-block';
  } else {
    document.getElementById('toggleMenuBtn').style.display = 'none';
  }
}

function openNavMenu() {
  document.getElementById('navOverlay').classList.remove('hidden');
  adjustControlsPosition();
  document.getElementById('toggleMenuBtn').style.display = 'none';
}

// --- 4. МАРШРУТИЗАЦІЯ ---
function generateCurvyWaypoints(start, end) {
  const dLat = end[0] - start[0];
  const dLon = end[1] - start[1];
  return [
    [start[0] + dLat * 0.33 - dLon * 0.18, start[1] + dLon * 0.33 + dLat * 0.18],
    [start[0] + dLat * 0.66 + dLon * 0.18, start[1] + dLon * 0.66 - dLat * 0.18]
  ];
}

function generateScenicWaypoints(start, end) {
  const dLat = end[0] - start[0];
  const dLon = end[1] - start[1];
  return [
    [start[0] + dLat * 0.5 + dLon * 0.22, start[1] + dLon * 0.5 - dLat * 0.22]
  ];
}

async function geocode(query) {
  if (!query || query.trim() === '') return null;
  const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&accept-language=zh-TW,en,uk&limit=1`;
  try {
    const res = await fetch(url);
    const data = await res.json();
    if (data && data.length > 0) return [parseFloat(data[0].lat), parseFloat(data[0].lon)];
  } catch (e) { console.error(e); }
  return null;
}

async function buildRoute(fromCurrentGps = false) {
  let start = userCoords;
  
  if (!fromCurrentGps) {
    const startVal = document.getElementById('startInput').value;
    if (customStartCoords && startVal.includes('(Карта)')) {
      start = customStartCoords;
    } else if (startVal.trim() !== '') {
      const g = await geocode(startVal);
      if (g) start = g;
    }
  }

  let dest = activeDestCoords;
  if (!fromCurrentGps || !dest) {
    const destInput = document.getElementById('destInput');
    if (destInput.dataset.lat && destInput.value.includes('(Карта)')) {
      dest = [parseFloat(destInput.dataset.lat), parseFloat(destInput.dataset.lng)];
    } else {
      dest = await geocode(destInput.value);
    }
  }

  if (!dest) {
    alert('Будь ласка, вкажіть фініш');
    return;
  }

  activeDestCoords = dest;

  let routeWaypoints = [start];

  const wpElements = document.querySelectorAll('.wp-input');
  for (let el of wpElements) {
    if (el.dataset.coords) {
      routeWaypoints.push(JSON.parse(el.dataset.coords));
    } else if (el.value.trim() !== '') {
      const g = await geocode(el.value);
      if (g) routeWaypoints.push(g);
    }
  }

  const isAvoidTolls = document.getElementById('avoidTolls').checked;
  const isShortest = document.getElementById('shortestRoute').checked;
  const isCurvy = document.getElementById('curvyMode').checked;
  const isScenic = document.getElementById('scenicMode').checked;
  const isNoHighways = document.getElementById('noHighways').checked;
  const isBike = document.getElementById('bikeMode').checked;

  if (isCurvy && wpElements.length === 0) {
    routeWaypoints.splice(1, 0, ...generateCurvyWaypoints(start, dest));
  } else if (isScenic && wpElements.length === 0) {
    routeWaypoints.splice(1, 0, ...generateScenicWaypoints(start, dest));
  }

  routeWaypoints.push(dest);

  let osrmProfile = (isAvoidTolls || isNoHighways || isBike) ? 'bike' : 'driving';
  let continueStraight = isShortest ? 'false' : 'true';

  const coordsStr = routeWaypoints.map(c => `${c[1]},${c[0]}`).join(';');
  const url = `https://router.project-osrm.org/route/v1/${osrmProfile}/${coordsStr}?overview=full&geometries=geojson&steps=true&continue_straight=${continueStraight}`;

  try {
    const res = await fetch(url);
    const data = await res.json();

    if (data.routes && data.routes.length > 0) {
      const route = data.routes[0];

      if (routeLayer) map.removeLayer(routeLayer);
      
      let routeColor = '#2563EB'; // Чіткий контрастний синій для маршруту
      if (isCurvy) routeColor = '#D97706';
      if (isAvoidTolls) routeColor = '#059669';

      routeLayer = L.geoJSON(route.geometry, { style: { color: routeColor, weight: 6, opacity: 0.9 } }).addTo(map);
      map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

      currentSteps = [];
      route.legs.forEach(leg => {
        currentSteps.push(...parseSteps(leg.steps));
      });
      nextStepIndex = 0;
      offRouteWarned = false;
      document.getElementById('recalculateBtn').style.display = 'none';

      const distKm = (route.distance / 1000).toFixed(1);
      document.getElementById('distDisplay').innerText = `${distKm} км`;

      document.getElementById('startDriveBtn').style.display = 'block';
      adjustControlsPosition();

      if (fromCurrentGps) {
        VoiceGuidance.speak(`Маршрут оновлено. Продовжуйте рух.`);
      } else {
        VoiceGuidance.speak(`Маршрут розраховано. Натисніть Поїхали.`);
      }
      updateHUD();
    }
  } catch (e) {
    alert('Помилка завантаження маршруту');
  }
}

// --- 5. РЕЖИМ "ПОЇХАЛИ" ТА СКИДАННЯ ---
function startDriveMode() {
  isDriveActive = true;
  document.getElementById('hudPanel').style.display = 'flex';
  document.getElementById('stopNavBtn').style.display = 'inline-block';
  
  closeNavMenu();
  enableAutoTrackingAndCenter();
  VoiceGuidance.speak(`Розпочинаємо рух.`);
}

function stopActiveNavigation() {
  isDriveActive = false;
  document.getElementById('hudPanel').style.display = 'none';
  document.getElementById('stopNavBtn').style.display = 'none';
  document.getElementById('recalculateBtn').style.display = 'none';
  
  openNavMenu();
  VoiceGuidance.speak(`Навігацію зупинено.`);
}

function recalculateRoute() {
  buildRoute(true);
}

function parseSteps(steps) {
  return steps.map(step => {
    const modifier = step.maneuver.modifier || '';
    const type = step.maneuver.type;

    let instruction = "Рухайтесь прямо";
    let icon = "⬆️";

    if (modifier.includes('left')) { instruction = "Поверніть ліворуч"; icon = "⬅️"; }
    else if (modifier.includes('right')) { instruction = "Поверніть праворуч"; icon = "➡️"; }
    else if (type === 'arrive') { instruction = "Ви дісталися точки"; icon = "🏁"; }

    if (step.name) instruction += ` на ${step.name}`;

    return {
      instruction: instruction,
      icon: icon,
      location: [step.maneuver.location[1], step.maneuver.location[0]]
    };
  });
}

function getDistanceMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)*Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function processNavigation() {
  if (!currentSteps.length || nextStepIndex >= currentSteps.length) return;

  const step = currentSteps[nextStepIndex];
  const dist = getDistanceMeters(userCoords[0], userCoords[1], step.location[0], step.location[1]);

  if (isDriveActive && dist > 50 && !offRouteWarned) {
    document.getElementById('recalculateBtn').style.display = 'inline-block';
    VoiceGuidance.speak(`Ви відхилилися від маршруту.`);
    offRouteWarned = true;
  }

  if (dist <= 30) {
    VoiceGuidance.speak(`Зараз ${step.instruction}`);
    nextStepIndex++;
    offRouteWarned = false;
    document.getElementById('recalculateBtn').style.display = 'none';
    updateHUD();
  }
}

function updateHUD() {
  if (currentSteps[nextStepIndex]) {
    const s = currentSteps[nextStepIndex];
    document.getElementById('hudTurnInfo').innerHTML = `<span>${s.icon}</span> <span>${s.instruction}</span>`;
  }
}

function resetRoute() {
  stopActiveNavigation();
  if (routeLayer) map.removeLayer(routeLayer);
  if (pinnedMarker) map.removeLayer(pinnedMarker);
  document.querySelectorAll('.waypoint-row').forEach(e => e.remove());
  document.getElementById('startInput').value = '';
  document.getElementById('destInput').value = '';
  delete document.getElementById('destInput').dataset.lat;
  delete document.getElementById('destInput').dataset.lng;
  customStartCoords = null;
  activeDestCoords = null;
  currentSteps = [];
  document.getElementById('distDisplay').innerText = '-- км';
  document.getElementById('startDriveBtn').style.display = 'none';
  document.getElementById('hudTurnInfo').innerHTML = '<span>🧭</span> <span>Рухайтесь за маршрутом</span>';
  adjustControlsPosition();
}

async function fetchSpeedLimits(lat, lon) {
  const query = `[out:json][timeout:3];way(around:20,${lat},${lon})["maxspeed"];out tags;`;
  try {
    const res = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(query));
    const data = await res.json();
    if (data.elements && data.elements.length > 0) {
      const speed = parseInt(data.elements[0].tags.maxspeed, 10);
      if (speed) document.getElementById('hudLimit').innerText = speed;
    }
  } catch (e) {}
}

window.onload = function() {
  initMap();
  window.addEventListener('resize', adjustControlsPosition);
};
</script>
