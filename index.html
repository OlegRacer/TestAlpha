<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>MotoNav - GPX Editor & Routing Test</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root {
  --bg-panel: rgba(18, 18, 22, 0.94);
  --border-line: rgba(255, 255, 255, 0.15);
  --cyan: #37e0e6;
  --amber: #ffb74d;
  --red: #ff4d4d;
  --green: #4caf50;
  --text: #ffffff;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
html, body { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

#map { position: fixed; inset: 0; z-index: 1; }

/* ВЕРХНЯ ЗОНА МЕРЕЖІ ПАНЕЛЕЙ */
#hudHeader {
  position: fixed; top: max(10px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 2000;
  display: flex; justify-content: space-between; align-items: center; pointer-events: none;
}

.hud-card {
  pointer-events: auto;
  background: var(--bg-panel); border: 1px solid var(--border-line); border-radius: 18px;
  padding: 8px 16px; backdrop-filter: blur(12px);
  box-shadow: 0 8px 32px rgba(0,0,0,0.6); display: flex; align-items: center;
}

.hud-nav-card { gap: 12px; }

.turn-arrow-svg {
  width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.turn-arrow-svg svg {
  width: 100%; height: 100%; fill: none; stroke: var(--cyan); stroke-width: 6; stroke-linecap: round; stroke-linejoin: round;
  filter: drop-shadow(0 0 6px rgba(55, 224, 230, 0.5));
}

.turn-dist { font-size: 30px; font-weight: 900; color: #ffffff; letter-spacing: -0.5px; white-space: nowrap; }

.hud-telemetry-card { gap: 16px; padding: 6px 16px; }
.telemetry-block { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
.telemetry-label { font-size: 10px; font-weight: 800; color: #888; text-transform: uppercase; margin-bottom: -2px; }
.telemetry-val { font-size: 30px; font-weight: 900; line-height: 1.1; }
.val-speed { color: var(--amber); }
.val-temp { color: var(--green); }

/* ПАНЕЛЬ РЕДАКТОРА GPX (ЗЛІВА/ВГОРІ) */
.editor-bar {
  position: fixed; top: max(75px, env(safe-area-inset-top)); left: 12px; z-index: 2200;
  background: var(--bg-panel); border: 1px solid var(--border-line); border-radius: 16px;
  padding: 8px; display: flex; flex-direction: column; gap: 6px; backdrop-filter: blur(10px);
  max-width: 220px;
}
.editor-btn {
  background: #22222a; border: 1px solid var(--border-line); color: #fff;
  padding: 8px 12px; border-radius: 8px; font-size: 11px; font-weight: bold;
  display: flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s;
}
.editor-btn:active { transform: scale(0.96); }
.editor-btn.active { border-color: var(--cyan); color: var(--cyan); background: rgba(55,224,230,0.15); }
.editor-btn.danger { border-color: var(--red); color: var(--red); }
.editor-btn.success { border-color: var(--green); color: var(--green); }

/* БУЛЬБАШКИ УПРАВЛІННЯ (СПРАВА ВНИЗУ) */
.floating-controls {
  position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); right: 16px; z-index: 2500;
  display: flex; flex-direction: column; gap: 10px;
}
.circle-btn {
  width: 46px; height: 46px; border-radius: 50%; background: var(--bg-panel);
  border: 1px solid var(--border-line); color: #fff; font-size: 18px;
  display: flex; align-items: center; justify-content: center; cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(10px); transition: all 0.2s;
}
.circle-btn:active { transform: scale(0.92); }
.circle-btn.active { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 0 12px rgba(55,224,230,0.4); }

/* СПЛИВАЮЧЕ МЕНЮ МАРШРУТУ */
.modal-overlay {
  position: fixed; inset: 0; z-index: 3000; background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center;
}
.modal-overlay.open { display: flex; }

.modal-card {
  width: 90%; max-width: 480px; background: #141418; border: 1px solid var(--border-line);
  border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.8); max-height: 90vh; overflow-y: auto;
}

.route-actions-grid { display: flex; flex-direction: column; gap: 8px; }
.btn-route-option {
  width: 100%; padding: 12px 14px; border-radius: 10px; background: #22222a;
  border: 1px solid var(--border-line); color: #fff; font-size: 13px; font-weight: 600;
  display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer;
}

.modal-actions { display: flex; gap: 10px; }
.btn-action { flex: 1; padding: 12px; border-radius: 10px; border: none; font-weight: bold; font-size: 13px; cursor: pointer; }
.btn-start { background: var(--green); color: #fff; }
.btn-stop { background: rgba(255, 77, 77, 0.15); color: var(--red); border: 1px solid var(--red); }

/* ТОСТ-СПОБІЩЕННЯ */
.toast-msg {
  position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
  background: rgba(0,0,0,0.85); border: 1px solid var(--border-line); color: #fff;
  padding: 8px 16px; border-radius: 20px; font-size: 12px; z-index: 4000;
  pointer-events: none; opacity: 0; transition: opacity 0.25s ease; white-space: nowrap;
}
.toast-msg.show { opacity: 1; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
</head>
<body>

<div id="map"></div>

<!-- ДВІ ОКРЕМІ КАРТКИ ЗВЕРХУ -->
<div id="hudHeader">
  <div class="hud-card hud-nav-card">
    <div class="turn-arrow-svg" id="hudArrow">
      <svg viewBox="0 0 24 24" id="arrowSvg">
        <path d="M 12 20 L 12 4 M 7 9 L 12 4 L 17 9"/>
      </svg>
    </div>
    <div class="turn-dist" id="hudDistance">---</div>
  </div>
  
  <div class="hud-card hud-telemetry-card">
    <div class="telemetry-block">
      <span class="telemetry-label">км/год</span>
      <span class="telemetry-val val-speed" id="speedVal">0</span>
    </div>
    <div class="telemetry-block">
      <span class="telemetry-label">двигун</span>
      <span class="telemetry-val val-temp"><span id="engineTempVal">85</span><small style="font-size:14px;">°C</small></span>
    </div>
  </div>
</div>

<!-- ПАНЕЛЬ РЕДАКТОРА GPX -->
<div class="editor-bar">
  <div style="font-size: 10px; font-weight: 800; color: #888; text-transform: uppercase;">🛠️ GPX Редактор</div>
  <button class="editor-btn" onclick="document.getElementById('gpxFileInput').click()">📁 Відкрити GPX</button>
  <button class="editor-btn" onclick="document.getElementById('gpxAppendInput').click()">➕ Додати / З'єднати GPX</button>
  <button class="editor-btn" id="btnCutMode" onclick="toggleCutMode()">✂️ Розрізати трек</button>
  <button class="editor-btn" id="btnRouteABMode" onclick="toggleRouteABMode()">📍 Маршрут по дорогах (А ➔ Б)</button>
  <button class="editor-btn success" id="btnSaveGpx" onclick="exportRouteToGpx()" style="display:none;">💾 Експорт в GPX</button>
</div>

<input type="file" id="gpxFileInput" accept=".gpx" style="display:none;" onchange="handleGpxUpload(this, false)">
<input type="file" id="gpxAppendInput" accept=".gpx" style="display:none;" onchange="handleGpxUpload(this, true)">

<!-- БУЛЬБАШКИ УПРАВЛІННЯ -->
<div class="floating-controls">
  <button class="circle-btn" id="btnSound" onclick="toggleSound()">🔇</button>
  <button class="circle-btn active" id="btnCenter" onclick="reCenterMap()">🎯</button>
  <button class="circle-btn" onclick="openRouteModal()">🗺️</button>
</div>

<!-- МЕНЮ "МАРШРУТ" -->
<div id="routeModal" class="modal-overlay" onclick="closeModalOnBackdrop(event)">
  <div class="modal-card">
    <div class="route-actions-grid">
      <button class="btn-route-option" onclick="pasteRouteFromClipboard()">📋 Вставити з буфера</button>
    </div>
    <div class="modal-actions">
      <button class="btn-action btn-stop" onclick="stopNavigation()">❌ Скинути</button>
      <button class="btn-action btn-start" onclick="startNavigation()">▶️ ПОЧАТИ</button>
    </div>
  </div>
</div>

<div class="toast-msg" id="toastMsg"></div>

<script>
let map;
let userMarker = null;
let autoTracking = true;
let isSoundOn = false;
let userCoords = [50.4501, 30.5234]; // Київ

let activeRouteCoords = []; // Загальний масив точок [[lat, lng], ...]
let activeRoutePolyline = null;

/* ЗМІННІ ДЛЯ РЕДАГУВАННЯ ТА МАРШРУТИЗАЦІЇ */
let cutMode = false;
let routeABMode = false;
let pointA = null;
let pointB = null;
let markerA = null;
let markerB = null;

function initMap() {
  map = L.map('map', { zoomControl: false, attributionControl: false }).setView(userCoords, 16);

  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { 
    maxZoom: 19, subdomains: 'abcd' 
  }).addTo(map);

  userMarker = L.circleMarker(userCoords, { radius: 9, fillColor: '#2B80FF', color: '#ffffff', weight: 3, fillOpacity: 1 }).addTo(map);

  map.on('dragstart zoomstart', function() {
    if (autoTracking) {
      autoTracking = false;
      document.getElementById('btnCenter').classList.remove('active');
    }
  });

  // КЛІК ПО КАРТІ ДЛЯ РЕЖИМІВ РЕДАГУВАННЯ
  map.on('click', function(e) {
    if (routeABMode) {
      handleRouteABClick(e.latlng);
    }
  });

  startGpsTracking();
}

/* 1. ЗАВАНТАЖЕННЯ ТА З'ЄДНАННЯ (MERGE) GPX */
function handleGpxUpload(input, isAppend = false) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = function(e) {
    const xml = new DOMParser().parseFromString(e.target.result, "text/xml");
    const pts = xml.querySelectorAll("trkpt, rtept");
    let newCoords = [];

    pts.forEach(pt => {
      const lat = parseFloat(pt.getAttribute("lat"));
      const lon = parseFloat(pt.getAttribute("lon"));
      if (!isNaN(lat) && !isNaN(lon)) newCoords.push([lat, lon]);
    });

    if (newCoords.length > 0) {
      if (isAppend && activeRouteCoords.length > 0) {
        activeRouteCoords = activeRouteCoords.concat(newCoords);
        showToast(`З'єднано! Всього точок: ${activeRouteCoords.length}`);
      } else {
        activeRouteCoords = newCoords;
        showToast(`Завантажено GPX (${newCoords.length} точок)`);
      }
      renderRoute();
    } else {
      showToast('Помилка: GPX не містить координат');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* 2. РОЗРІЗАННЯ ТРЕКУ У ВИБРАНІЙ ТОЧЦІ */
function toggleCutMode() {
  cutMode = !cutMode;
  if (routeABMode) toggleRouteABMode(); // Вимикаємо інший режим

  document.getElementById('btnCutMode').classList.toggle('active', cutMode);
  if (cutMode) {
    showToast('✂️ Клікніть на лінію треку, щоб розрізати');
  }
}

function handleRouteCut(clickLatLng) {
  if (activeRouteCoords.length < 2) return;

  // Знаходимо найближчу точку у треку до місця кліку
  let closestIndex = -1;
  let minDistance = Infinity;

  for (let i = 0; i < activeRouteCoords.length; i++) {
    let dist = map.distance(clickLatLng, activeRouteCoords[i]);
    if (dist < minDistance) {
      minDistance = dist;
      closestIndex = i;
    }
  }

  if (closestIndex > 0 && closestIndex < activeRouteCoords.length - 1) {
    // Ділимо трек і залишаємо першу частину (або за бажанням користувача)
    activeRouteCoords = activeRouteCoords.slice(0, closestIndex);
    showToast(`Маршрут розрізано! Залишено ${activeRouteCoords.length} точок`);
    renderRoute();
  }
  toggleCutMode();
}

/* 3. ПОБУДОВА МАРШРУТУ МІЖ ТОЧКАМИ А і Б ПО ДОРОГАХ (OSRM API) */
function toggleRouteABMode() {
  routeABMode = !routeABMode;
  if (cutMode) toggleCutMode();

  document.getElementById('btnRouteABMode').classList.toggle('active', routeABMode);

  if (!routeABMode) {
    resetABMarkers();
  } else {
    pointA = null; pointB = null;
    showToast('📍 Вкажіть точку А (Початок) на карті');
  }
}

async function handleRouteABClick(latlng) {
  if (!pointA) {
    pointA = [latlng.lat, latlng.lng];
    markerA = L.marker(pointA, { title: "Точка А" }).addTo(map).bindPopup("Точка А").openPopup();
    showToast('Тепер вкажіть точку Б (Кінець)');
  } else if (!pointB) {
    pointB = [latlng.lat, latlng.lng];
    markerB = L.marker(pointB, { title: "Точка Б" }).addTo(map).bindPopup("Точка Б").openPopup();
    showToast('⏳ Прокладаємо маршрут по дорогах...');

    // Запит до OSRM (Open Source Routing Machine)
    await fetchRoadRoute(pointA, pointB);
    toggleRouteABMode();
  }
}

async function fetchRoadRoute(ptA, ptB) {
  try {
    // OSRM чекає геометрію lng,lat
    const url = `https://router.project-osrm.org/route/v1/driving/${ptA[1]},${ptA[0]};${ptB[1]},${ptB[0]}?overview=full&geometries=geojson`;
    const response = await fetch(url);
    const data = await response.json();

    if (data.routes && data.routes.length > 0) {
      const routePoints = data.routes[0].geometry.coordinates.map(coord => [coord[1], coord[0]]); // Перетворюємо назад у lat,lng
      
      // Додаємо побудовану дорогу до наявного треку
      activeRouteCoords = activeRouteCoords.concat(routePoints);
      showToast(`Побудовано ${Math.round(data.routes[0].distance)} м по дорогах!`);
      renderRoute();
    } else {
      showToast('Не вдалося побудувати маршрут');
    }
  } catch (err) {
    showToast('Помилка мережі маршрутизації');
    console.error(err);
  } finally {
    resetABMarkers();
  }
}

function resetABMarkers() {
  if (markerA) map.removeLayer(markerA);
  if (markerB) map.removeLayer(markerB);
  markerA = null; markerB = null;
  pointA = null; pointB = null;
}

/* 4. ВІДОБРАЖЕННЯ ТА ЕКСПОРТ */
function renderRoute() {
  if (activeRoutePolyline) map.removeLayer(activeRoutePolyline);

  if (activeRouteCoords.length > 0) {
    activeRoutePolyline = L.polyline(activeRouteCoords, {
      color: '#37e0e6', weight: 6, opacity: 0.9
    }).addTo(map);

    // Додаємо клік на лінію для розрізання
    activeRoutePolyline.on('click', function(e) {
      if (cutMode) handleRouteCut(e.latlng);
    });

    document.getElementById('btnSaveGpx').style.display = 'flex';
  } else {
    document.getElementById('btnSaveGpx').style.display = 'none';
  }
}

async function exportRouteToGpx() {
  if (activeRouteCoords.length === 0) return;

  let gpxHeader = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="MotoNav" xmlns="http://www.topografix.com/GPX/1/1">
  <trk>
    <name>Edited_Route_${Date.now()}</name>
    <trkseg>\n`;

  let gpxBody = activeRouteCoords.map(pt => `      <trkpt lat="${pt[0]}" lon="${pt[1]}"></trkpt>`).join('\n');
  let gpxFooter = `\n    </trkseg>\n  </trk>\n</gpx>`;
  const blob = new Blob([gpxHeader + gpxBody + gpxFooter], { type: 'application/gpx+xml' });

  const a = document.createElement('a');
  a.href = URL.revokeObjectURL(blob);
  a.href = URL.createObjectURL(blob);
  a.download = `route_${Date.now()}.gpx`;
  a.click();
  showToast('💾 GPX файл успішно збережено!');
}

/* СТАДАРТНІ ФУНКЦІЇ HUD ТА GPS */
function startGpsTracking() {
  if ("geolocation" in navigator) {
    navigator.geolocation.watchPosition((pos) => {
      userCoords = [pos.coords.latitude, pos.coords.longitude];
      userMarker.setLatLng(userCoords);
      document.getElementById('speedVal').innerText = pos.coords.speed ? Math.round(pos.coords.speed * 3.6) : 0;
      if (autoTracking) map.setView(userCoords, 16, { animate: true });
    }, null, { enableHighAccuracy: true });
  }
}

function reCenterMap() {
  autoTracking = true;
  document.getElementById('btnCenter').classList.add('active');
  map.setView(userCoords, 16, { animate: true });
}

function toggleSound() {
  isSoundOn = !isSoundOn;
  const btn = document.getElementById('btnSound');
  btn.innerText = isSoundOn ? "🔊" : "🔇";
  btn.classList.toggle('active', isSoundOn);
}

function openRouteModal() { document.getElementById('routeModal').classList.add('open'); }
function closeRouteModal() { document.getElementById('routeModal').classList.remove('open'); }
function closeModalOnBackdrop(e) { if (e.target.id === 'routeModal') closeRouteModal(); }

function showToast(msg) {
  const el = document.getElementById('toastMsg');
  el.innerText = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2500);
}

function startNavigation() { closeRouteModal(); }
function stopNavigation() {
  activeRouteCoords = [];
  renderRoute();
  closeRouteModal();
  showToast('Маршрут скинуто');
}

window.onload = initMap;
</script>
</body>
</html>
