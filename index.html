<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пошук BLE TPMS Yamaha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 450px;
            width: 90%;
        }

        h2 {
            margin-bottom: 10px;
            color: #e60012; /* Yamaha Red */
        }

        p {
            color: #aaa;
            font-size: 14px;
        }

        button {
            margin-top: 20px;
            padding: 14px 24px;
            background-color: #e60012;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #b3000e;
        }

        #device-info {
            margin-top: 20px;
            padding: 15px;
            background-color: #2a2a2a;
            border-radius: 8px;
            text-align: left;
            word-break: break-all;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>BLE TPMS Сканер</h2>
        <p>Пошук Bluetooth-датчиків тиску в шинах поруч</p>

        <button id="scanBtn">Шукати BLE Датчики</button>

        <div id="device-info">
            <strong>Знайдений пристрій:</strong>
            <p id="deviceName">Назва: -</p>
            <p id="deviceId">ID: -</p>
            <p id="status" style="color: #4caf50;">Підключено успішно!</p>
        </div>
    </div>

    <script>
        document.getElementById('scanBtn').addEventListener('click', async () => {
            const infoBox = document.getElementById('device-info');
            const nameElem = document.getElementById('deviceName');
            const idElem = document.getElementById('deviceId');
            const statusElem = document.getElementById('status');

            try {
                // Пошук BLE пристроїв
                // acceptAllDevices: true дозволяє побачити всі Bluetooth пристрої поруч
                const device = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['battery_service'] // Тут можна вказати UUID сервісу вашого TPMS
                });

                // Відображення базової інформації
                nameElem.textContent = `Назва: ${device.name || 'Невідомий пристрій (TPMS)'}`;
                idElem.textContent = `ID: ${device.id}`;
                statusElem.textContent = 'Знайдено! Підключаємось...';
                infoBox.style.display = 'block';

                // Підключення до GATT сервера пристрою
                const server = await device.gatt.connect();
                statusElem.textContent = 'Успішно підключено до BLE датчика!';
                statusElem.style.color = '#4caf50';

            } catch (error) {
                console.error(error);
                infoBox.style.display = 'block';
                statusElem.style.color = '#f44336';
                statusElem.textContent = `Помилка: ${error.message}`;
            }
        });
    </script>

</body>
</html>
