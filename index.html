<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>vRacer Dash Pro</title>
  
  <style>
    /* 1. БАЗОВІ НАЛАШТУВАННЯ ТА СКИДАННЯ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* 2. АДАПТИВНИЙ ПОВНОЕКРАННИЙ КОНТЕЙНЕР (Замість JS-хаків) */
    html, body {
      width: 100vw;
      /* 100dvh враховує реальну висоту екрана в мобільних браузерах з урахуванням тулбарів */
      height: 100dvh;
      min-height: -webkit-fill-available;
      overflow: hidden;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
    }

    /* 3. ОСНОВНА СІТКА (#grid) НА ВЕСЬ ЕКРАН */
    #grid {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      height: 100%;
      
      /* Враховуємо безпечні зони вирізів (Safe Area Insets) для iOS */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);

      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 8px;
      padding: 8px;
      box-sizing: border-box;
    }

    /* Стилі для блоків сітки */
    .dash-block {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    /* Приклади позиціонування блоків у сітці */
    .block-speed {
      grid-column: span 6;
      grid-row: span 5;
    }

    .block-map {
      grid-column: span 6;
      grid-row: span 5;
    }

    .block-telemetry {
      grid-column: span 12;
      grid-row: span 3;
    }
  </style>
</head>
<body>

  <!-- Головна сітка дашборду -->
  <div id="grid">
    <div class="dash-block block-speed">
      <h2>Спідометр</h2>
    </div>
    
    <div class="dash-block block-map">
      <h2>Карта / Навігація</h2>
    </div>
    
    <div class="dash-block block-telemetry">
      <h2>Телеметрія / Статистика</h2>
    </div>
  </div>

</body>
</html>
