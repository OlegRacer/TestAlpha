<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>V-Racer Dashboard - Responsive Demo</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #0e1117;
      --panel-bg: #161a23;
      --panel-border: #2e3648;
      --text-main: #e0e6ed;
      --text-dim: #6c7a8e;
      --accent-red: #ff2a4b;
      --accent-green: #00ff88;
      --accent-cyan: #00d9ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Share Tech Mono', monospace;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* Scaling Container */
    .viewport-scaler {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Outermost Frame with fixed aspect ratio base */
    .dashboard-frame {
      width: 1100px;
      height: 560px;
      background: radial-gradient(circle at center, #1c222e 0%, #0f131a 100%);
      border: 3px solid #3a455a;
      border-radius: 20px;
      padding: 15px;
      position: absolute;
      box-shadow: 0 0 50px rgba(0,0,0,0.8), inset 0 0 15px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform-origin: center center;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 36px;
    }

    .top-left, .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-hdr {
      background: #202735;
      border: 1px solid #3d4a61;
      color: var(--text-main);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .status-led {
      width: 8px;
      height: 8px;
      background-color: var(--accent-green);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent-green);
    }

    .net-title {
      font-size: 11px;
      color: var(--text-dim);
      margin-left: 10px;
      letter-spacing: 1px;
    }

    /* Main Section */
    .main-grid {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      gap: 12px;
      flex: 1;
    }

    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4);
    }

    /* Left Panel: Engine Temp */
    .panel-left {
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .panel-title {
      color: var(--text-dim);
      font-size: 16px;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .engine-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 15px;
    }

    .engine-graphic {
      width: 120px;
      height: 120px;
      position: relative;
    }

    .sensor-dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: var(--accent-red);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--accent-red);
      animation: blink 1.5s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 0.3; }
      to { opacity: 1; }
    }

    .digital-val-large {
      font-family: 'Orbitron', sans-serif;
      font-size: 54px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    /* Center Panel: Speedometer */
    .panel-center {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at center, #1e2635 0%, #121620 100%);
    }

    .speed-display {
      font-family: 'Orbitron', sans-serif;
      font-size: 100px;
      font-weight: 900;
      line-height: 1;
      color: #ffffff;
      text-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    .speed-unit {
      font-size: 26px;
      color: var(--text-dim);
      margin-top: 5px;
    }

    .v-logo {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .v-symbol {
      font-family: 'Orbitron', sans-serif;
      font-size: 38px;
      font-weight: 900;
      color: var(--accent-red);
      text-shadow: 0 0 15px rgba(255, 42, 75, 0.6);
      transform: scaleY(0.9);
    }

    .v-text {
      font-size: 16px;
      letter-spacing: 3px;
      color: #fff;
      margin-top: -8px;
    }

    /* Right Panel: Map & Bike HUD */
    .panel-right {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 11px;
    }

    .net-header {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      border-bottom: 1px solid rgba(255,255,255,0.05);
      padding-bottom: 5px;
    }

    .hud-info-grid {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 10px;
    }

    .map-box {
      width: 80px;
      height: 55px;
      background: #252e3d;
      border: 1px solid #3d4a61;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .gps-spec {
      color: var(--text-dim);
      line-height: 1.3;
    }

    .gps-spec strong {
      color: #fff;
    }

    .bike-schematic {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .callout {
      position: absolute;
      color: var(--text-dim);
      font-size: 10px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .callout::before {
      content: '';
      width: 20px;
      height: 1px;
      background: var(--accent-red);
    }

    /* Bottom Row Controls */
    .bottom-row {
      display: grid;
      grid-template-columns: 1fr 1fr 1.5fr 1.2fr;
      gap: 12px;
      height: 110px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .card-title {
      font-size: 12px;
      color: var(--text-dim);
      text-align: center;
      letter-spacing: 1px;
    }

    .card-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 24px;
      text-align: center;
      color: #fff;
      margin: 2px 0;
    }

    .sparkline {
      width: 100%;
      height: 25px;
    }

    .nav-card {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      padding: 6px;
    }

    .nav-btn {
      background: #1c222e;
      border: 1px solid #2e384a;
      border-radius: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-dim);
      cursor: pointer;
      gap: 4px;
      font-size: 10px;
    }

    .nav-btn.active {
      background: #283244;
      color: #fff;
      border-color: var(--accent-cyan);
    }

    .nav-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .bottom-brand {
      position: absolute;
      bottom: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Orbitron', sans-serif;
      font-weight: 900;
      font-size: 16px;
      letter-spacing: 2px;
      color: #fff;
    }
    .bottom-brand span { color: var(--accent-red); }
  </style>
</head>
<body>

  <div class="viewport-scaler" id="scaler">
    <div class="dashboard-frame" id="dash">
      <!-- Top Header Bar -->
      <header class="top-bar">
        <div class="top-left">
          <button class="btn-hdr"><div class="status-led"></div> Connect</button>
          <button class="btn-hdr">Скинути</button>
          <button class="btn-hdr">PiP</button>
          <button class="btn-hdr">Trip</button>
          <span class="net-title">SAMURAI_NET</span>
        </div>
        <div class="top-right">
          <button class="btn-hdr">Налаштувати</button>
          <span class="net-title">CONF_SYS</span>
        </div>
      </header>

      <!-- Main Section -->
      <main class="main-grid">
        <!-- Panel Left: Engine Temp -->
        <div class="panel panel-left">
          <div class="panel-title">T_ENG</div>
          <div class="engine-container">
            <div class="engine-graphic">
              <svg viewBox="0 0 100 100" width="100%" height="100%" stroke="#4a5a75" stroke-width="1.5" fill="none">
                <path d="M 20 30 L 40 10 L 60 10 L 80 30 L 80 70 L 60 90 L 40 90 L 20 70 Z" />
                <circle cx="50" cy="50" r="18" />
                <path d="M 30 40 L 70 40 M 30 60 L 70 60" />
              </svg>
              <div class="sensor-dot" style="top: 20%; left: 35%;"></div>
              <div class="sensor-dot" style="top: 65%; left: 15%;"></div>
              <div class="sensor-dot" style="top: 80%; left: 60%;"></div>
              <div class="sensor-dot" style="top: 30%; left: 75%;"></div>
            </div>
            <div class="digital-val-large" id="t-eng-val">112</div>
          </div>
        </div>

        <!-- Panel Center: Speedometer -->
        <div class="panel panel-center">
          <div class="speed-display" id="speed-val">0</div>
          <div class="speed-unit">km/h</div>
          <div class="v-logo">
            <div class="v-symbol">V</div>
            <div class="v-text">Racer</div>
          </div>
        </div>

        <!-- Panel Right: Map & Scooter Spec -->
        <div class="panel panel-right">
          <div class="net-header">
            <div class="status-led"></div>
            <span>NET_LINK: HEYWOOD FREE NET</span>
          </div>

          <div class="hud-info-grid">
            <div class="map-box">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="var(--accent-cyan)"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
              <span style="font-size: 9px; margin-top:2px;">0km/h</span>
            </div>
            <div class="gps-spec">
              <div>ENGINE_SPEC</div>
              <div style="font-size: 9px; opacity: 0.7;">30.5866°E, 129.6995°E</div>
              <div style="margin-top: 3px;"><strong>NIGHT CITY GPS</strong></div>
              <div style="font-size: 9px; opacity: 0.7;">V-Racer Headquarters</div>
            </div>
          </div>

          <div class="bike-schematic">
            <svg width="170" height="100" viewBox="0 0 200 120" stroke="#00d9ff" stroke-width="1.5" fill="none" opacity="0.8">
              <path d="M 40 80 A 15 15 0 1 0 40 110 A 15 15 0 1 0 40 80 Z" fill="#111" />
              <path d="M 160 80 A 15 15 0 1 0 160 110 A 15 15 0 1 0 160 80 Z" fill="#111" />
              <path d="M 40 95 L 80 90 L 110 60 L 150 50 L 160 95" />
              <path d="M 110 60 L 130 30 L 145 30" />
              <path d="M 70 65 L 100 65" stroke-width="3" />
            </svg>
            <div class="callout" style="top: 15px; right: 20px;">ECU</div>
            <div class="callout" style="bottom: 15px; right: 10px;">SENSOR</div>
          </div>

          <div style="text-align: center; color: var(--text-dim); font-size: 10px; letter-spacing: 1px;">
            [ STREET-LEVEL: ACTIVE ]
          </div>
        </div>
      </main>

      <!-- Bottom Row Cards -->
      <footer class="bottom-row">
        <div class="card">
          <div class="card-title">TPS%</div>
          <div class="card-val" id="tps-val">00</div>
          <canvas id="chart-tps" class="sparkline"></canvas>
        </div>

        <div class="card">
          <div class="card-title">T_AIR</div>
          <div class="card-val" id="tair-val">25</div>
          <canvas id="chart-tair" class="sparkline"></canvas>
        </div>

        <div class="card" style="display: grid; grid-template-columns: 1fr 1fr; gap: 5px;">
          <div>
            <div class="card-title">VOLT</div>
            <div class="card-val" id="volt-val" style="font-size: 18px;">12.8</div>
            <canvas id="chart-volt" class="sparkline"></canvas>
          </div>
          <div>
            <div class="card-title">RPM</div>
            <div class="card-val" id="rpm-val" style="font-size: 18px;">0</div>
            <canvas id="chart-rpm" class="sparkline"></canvas>
          </div>
        </div>

        <div class="card nav-card">
          <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            GPS
          </div>
          <div class="nav-btn active">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
            Speedometer
          </div>
          <div class="nav-btn">
            <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
            TRIP
          </div>
        </div>
      </footer>

      <div class="bottom-brand"><span>V-</span>Racer</div>
    </div>
  </div>

  <script>
    // Auto-Scaler for Responsive Viewport
    function resizeDashboard() {
      const dash = document.getElementById('dash');
      const baseWidth = 1100;
      const baseHeight = 560;
      const padding = 20;

      const scaleX = (window.innerWidth - padding) / baseWidth;
      const scaleY = (window.innerHeight - padding) / baseHeight;
      const scale = Math.min(scaleX, scaleY, 1.2); // max 1.2x on giant screens

      dash.style.transform = `scale(${scale})`;
    }

    window.addEventListener('resize', resizeDashboard);
    window.addEventListener('load', resizeDashboard);

    // Demo Mode Logic
    let speed = 0;
    let targetSpeed = 0;
    let tps = 0;
    let rpm = 0;
    let tEng = 108;
    let tAir = 25;
    let volt = 12.8;

    const historyLength = 30;
    const tpsHistory = new Array(historyLength).fill(0);
    const tAirHistory = new Array(historyLength).fill(25);
    const voltHistory = new Array(historyLength).fill(12.8);
    const rpmHistory = new Array(historyLength).fill(0);

    const ctxTps = document.getElementById('chart-tps').getContext('2d');
    const ctxAir = document.getElementById('chart-tair').getContext('2d');
    const ctxVolt = document.getElementById('chart-volt').getContext('2d');
    const ctxRpm = document.getElementById('chart-rpm').getContext('2d');

    function drawChart(ctx, data, minVal, maxVal, color = '#00d9ff') {
      const width = ctx.canvas.width = ctx.canvas.clientWidth;
      const height = ctx.canvas.height = ctx.canvas.clientHeight;
      
      ctx.clearRect(0, 0, width, height);
      ctx.beginPath();
      ctx.strokeStyle = color;
      ctx.lineWidth = 1.5;

      const step = width / (historyLength - 1);

      for (let i = 0; i < data.length; i++) {
        const normalized = (data[i] - minVal) / (maxVal - minVal || 1);
        const y = height - (normalized * (height - 4) + 2);
        const x = i * step;

        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    let accelerating = true;

    function updateDemo() {
      if (accelerating) {
        targetSpeed += Math.random() * 8;
        if (targetSpeed > 180) accelerating = false;
      } else {
        targetSpeed -= Math.random() * 10;
        if (targetSpeed < 5) accelerating = true;
      }

      speed += (targetSpeed - speed) * 0.1;
      
      tps = Math.min(100, Math.max(0, Math.floor((targetSpeed - speed) * 4 + (speed > 10 ? 20 : 0))));
      rpm = speed > 2 ? Math.floor(speed * 45 + (tps * 25) + (Math.random() * 150)) : 0;
      volt = +(13.4 + (rpm / 10000) * 0.8 + (Math.random() * 0.2 - 0.1)).toFixed(1);
      tEng = Math.floor(105 + (speed * 0.12) + Math.sin(Date.now() / 3000) * 3);

      document.getElementById('speed-val').innerText = Math.round(speed);
      document.getElementById('t-eng-val').innerText = tEng;
      document.getElementById('tps-val').innerText = String(tps).padStart(2, '0');
      document.getElementById('tair-val').innerText = tAir;
      document.getElementById('volt-val').innerText = volt;
      document.getElementById('rpm-val').innerText = rpm;

      tpsHistory.push(tps); tpsHistory.shift();
      tAirHistory.push(tAir + (Math.random() * 0.4 - 0.2)); tAirHistory.shift();
      voltHistory.push(volt); voltHistory.shift();
      rpmHistory.push(rpm); rpmHistory.shift();

      drawChart(ctxTps, tpsHistory, 0, 100, '#00d9ff');
      drawChart(ctxAir, tAirHistory, 20, 30, '#00ff88');
      drawChart(ctxVolt, voltHistory, 11, 15, '#ff2a4b');
      drawChart(ctxRpm, rpmHistory, 0, 9000, '#00d9ff');
    }

    setInterval(updateDemo, 100);
  </script>
</body>
</html>
