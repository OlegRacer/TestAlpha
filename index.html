<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>vRacer Dash Pro</title>
  
  <style>
    /* 1. СКИДАННЯ СТИЛІВ */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* 2. НАЛАШТУВАННЯ BODY ДЛЯ МІКРОСКРОЛУ У BLUEFY */
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      /* Дозволяємо вертикальну прокрутку на 1px для активації хаку Bluefy */
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    /* 3. ФІКСОВАНА СІТКА (#grid) — ФІКСУЄТЬСЯ НА ВЕСЬ ЕКРАН */
    #grid {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh; /* Сучасний динамічний розмір екрана */
      
      /* Захист від вирізів iOS (Safe Area) */
      padding-top: max(8px, env(safe-area-inset-top));
      padding-bottom: max(8px, env(safe-area-inset-bottom));
      padding-left: max(8px, env(safe-area-inset-left));
      padding-right: max(8px, env(safe-area-inset-right));

      display: grid;
      grid-template-columns: repeat(12, 1fr);
      grid-template-rows: repeat(8, 1fr);
      gap: 8px;
      box-sizing: border-box;
      z-index: 1;
    }

    /* Стилі для блоків сітки */
    .dash-block {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .block-speed {
      grid-column: span 6;
      grid-row: span 5;
    }

    .block-map {
      grid-column: span 6;
      grid-row: span 5;
    }

    .block-telemetry {
      grid-column: span 12;
      grid-row: span 3;
    }

    h2 {
      font-size: 1.2rem;
      font-weight: 600;
      color: #00e5ff;
    }
  </style>
</head>
<body>

  <!-- Сітка зафіксована поверх body -->
  <div id="grid">
    <div class="dash-block block-speed">
      <h2>Спідометр</h2>
    </div>
    
    <div class="dash-block block-map">
      <h2>Карта / Навігація</h2>
    </div>
    
    <div class="dash-block block-telemetry">
      <h2>Телеметрія</h2>
    </div>
  </div>

  <script>
    // Мінімальний тригер для приховування тулбару Bluefy
    (function initBluefyFullscreen() {
      function applyScrollHack() {
        // Задаємо висоту body рівно на 1px більше видимого вікна
        document.body.style.minHeight = (window.innerHeight + 1) + 'px';
        
        // Виконуємо мікроскролл на 1px, який тригерить приховування панелі Bluefy
        if (window.scrollY === 0) {
          window.scrollTo(0, 1);
        }
      }

      // 1. Спроба при завантаженні
      window.addEventListener('load', () => {
        applyScrollHack();
      });

      // 2. Гарантований приховуючий скролл при першому тапі на екран
      window.addEventListener('touchstart', function onFirstTouch() {
        applyScrollHack();
        window.removeEventListener('touchstart', onFirstTouch);
      }, { passive: true });

      // 3. Перерахунок при повороті екрана
      window.addEventListener('orientationchange', () => {
        setTimeout(applyScrollHack, 200);
      });
    })();
  </script>

</body>
</html>
