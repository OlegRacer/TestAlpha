<script>
/* ХАК 1: Безпечний мікроскролл */
(function initFullscreenHack() {
  var style = document.createElement('style');
  style.innerHTML = 'html, body { width: 100lvw !important; min-height: 100.1vh !important; margin: 0 !important; padding: 0 !important; overflow-x: hidden; -webkit-overflow-scrolling: touch; }';
  document.head.appendChild(style);

  function triggerFullscreenScroll() {
    if (window.scrollY === 0) {
      window.scrollTo({ top: 1, behavior: 'instant' });
    }
  }

  document.addEventListener('DOMContentLoaded', function() {
    setTimeout(triggerFullscreenScroll, 50);
  });

  window.addEventListener('load', function() {
    setTimeout(triggerFullscreenScroll, 100);
    setTimeout(triggerFullscreenScroll, 300);
  });

  function handleFirstTouch() {
    triggerFullscreenScroll();
    window.removeEventListener('touchstart', handleFirstTouch);
  }

  window.addEventListener('touchstart', handleFirstTouch, { passive: true });

  window.addEventListener('orientationchange', function() {
    setTimeout(triggerFullscreenScroll, 200);
  });
})();
</script>
